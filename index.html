
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fefcf3">
<title>Note Master by: paulm(katupo)</title>

<style>
:root{
  --bg-color:#fefcf3;
  --card-bg:#fef0c7;
  --text-color:#2c2c2c;
  --primary-blue:#0284c7;
  --active-tab-bg:#0284c7;
  --active-tab-text:#fff;
  --inactive-tab-bg:#f3f4f6;
  --inactive-tab-text:#4b5563;
  --border-color:#e5e7eb;
  --marker-bg:#fef08a;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{background:#121212;display:flex;justify-content:center;
  align-items:center;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app-container{width:100%;max-width:430px;height:100dvh;
  max-height:900px;background:var(--bg-color);display:flex;
  flex-direction:column;position:relative;overflow:hidden;
  box-shadow:0 10px 30px #0005}
.screen{display:none;flex-direction:column;height:100%;
  width:100%;position:relative;min-height:0}
.screen.active{display:flex}
.home-header{display:flex;justify-content:space-between;
  align-items:center;padding:14px 16px}
.home-header-right{display:flex;align-items:center;gap:14px}
.icon-btn{background:none;border:0;font-size:20px;color:#333;
  padding:5px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;min-width:32px;min-height:32px}
.category-bar-wrapper{display:flex;align-items:center;
  padding:4px 12px 12px;gap:8px}
.category-scroll-container{display:flex;gap:8px;overflow-x:auto;
  white-space:nowrap;flex:1;scrollbar-width:none}
.category-scroll-container::-webkit-scrollbar{display:none}
.category-tab{padding:8px 15px;border-radius:20px;font-size:.85rem;
  font-weight:600;background:var(--inactive-tab-bg);
  color:var(--inactive-tab-text);border:0;flex-shrink:0}
.category-tab.active{background:var(--active-tab-bg);
  color:var(--active-tab-text)}
.add-category-btn{background:none;border:0;font-size:23px;
  color:#555;padding:4px 7px;flex-shrink:0}
.notes-grid{display:grid;grid-template-columns:1fr 1fr;
  gap:12px;padding:8px 16px 90px;overflow-y:auto;flex:1;
  align-content:start}
.note-card{background:var(--card-bg);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;justify-content:space-between;
  height:180px;min-width:0;box-shadow:0 2px 5px #00008;
  cursor:pointer;overflow:hidden}
.note-card:active{transform:scale(.98)}
.note-card-title{font-size:1.02rem;font-weight:700;color:#1a1a1a;
  margin-bottom:8px;overflow-wrap:anywhere}
.note-card-preview{font-size:.85rem;color:#4a4a4a;line-height:1.4;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;
  -webkit-box-orient:vertical;flex:1;overflow-wrap:anywhere}
.note-card-date{font-size:.72rem;color:#888;margin-top:8px}
.favorite-star{color:#b77900;margin-left:4px}
.fab-add-btn{position:absolute;bottom:48px;right:20px;width:58px;
  height:58px;border-radius:50%;background:var(--primary-blue);
  color:#fff;border:0;font-size:32px;display:flex;
  align-items:center;justify-content:center;
  box-shadow:0 6px 16px #0284c766;z-index:10}
.app-footer{text-align:center;font-size:.7rem;color:#777;
  padding:6px;background:#fff;border-top:1px solid #efefef;
  flex-shrink:0}
.drawer-overlay{position:absolute;inset:0;background:#0006;
  z-index:90;display:none}
.drawer-overlay.show{display:block}
.side-drawer{position:absolute;top:0;left:-280px;width:270px;
  height:100%;background:#fff;z-index:100;transition:left .25s;
  display:flex;flex-direction:column;box-shadow:4px 0 15px #0002}
.side-drawer.show{left:0}
.drawer-header{padding:24px 20px 16px;border-bottom:1px solid #eee}
.drawer-title{font-size:1.5rem;font-weight:800;color:var(--primary-blue)}
.drawer-subtitle{font-size:.75rem;color:#888;margin-top:3px}
.drawer-list{padding:12px 0;overflow-y:auto;flex:1}
.drawer-item{padding:12px 20px;display:flex;align-items:center;
  gap:12px;font-size:.92rem;color:#333;cursor:pointer}
.drawer-item.active,.drawer-item:active{background:#f0f9ff;
  color:var(--primary-blue)}
.top-bar{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px 6px;border-bottom:1px solid #0000000d;z-index:10}
.status-badge{font-size:.7rem;font-weight:700;padding:4px 8px;
  border-radius:12px;white-space:nowrap}
.status-badge.read{background:#e0f2fe;color:#0369a1}
.status-badge.edit{background:#fef3c7;color:#b45309}
.top-actions{display:flex;gap:10px;align-items:center}
.meta-bar{display:flex;justify-content:space-between;align-items:center;
  padding:7px 16px;font-size:.8rem;color:#666;gap:8px}
.category-select{background:transparent;border:0;font-size:.82rem;
  font-weight:600;color:#333;outline:none;max-width:58%;
  text-overflow:ellipsis}
.editor-container{flex:1;min-height:0;padding:12px 18px;
  overflow-y:auto;display:flex;flex-direction:column}
.note-title{font-size:1.5rem;font-weight:700;border:0;
  background:transparent;outline:none;width:100%;margin-bottom:12px;
  color:#111;flex-shrink:0}
.note-body{font-size:1.15rem;line-height:1.7;color:var(--text-color);
  border:0;outline:none;width:100%;flex:1;min-height:180px;
  white-space:pre-wrap;overflow-wrap:anywhere}
.read-mode .note-body{cursor:pointer;user-select:none;
  -webkit-user-select:none}
.read-mode .note-title{pointer-events:none}
.read-mode .formatting-toolbar{display:none}
.read-marker-highlight{background:var(--marker-bg);border-radius:3px;
  padding:0 2px;box-shadow:0 0 0 1px #eab308;font-weight:bold}
.formatting-toolbar{position:absolute;bottom:32px;left:0;right:0;
  background:#fff;border-top:1px solid var(--border-color);
  padding:7px 5px;display:flex;justify-content:space-around;
  align-items:center;gap:1px;z-index:20}
.fmt-btn{background:none;border:1px solid transparent;font-size:.95rem;
  font-weight:600;padding:7px 6px;border-radius:6px;color:#333;
  min-width:32px;display:flex;align-items:center;justify-content:center}
.fmt-btn:active,.fmt-btn.active{background:#f0f0f0;border-color:#ccc}
.color-indicator{width:18px;height:18px;border-radius:50%;
  border:2px solid #ccc}
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);
  background:#222;color:#fff;padding:9px 15px;border-radius:20px;
  font-size:.82rem;opacity:0;pointer-events:none;z-index:200;
  transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.dropdown-menu{position:absolute;top:48px;right:12px;background:#fff;
  border-radius:12px;box-shadow:0 10px 25px #0003;width:210px;
  display:none;flex-direction:column;overflow:hidden;z-index:50;
  border:1px solid var(--border-color)}
.dropdown-menu.show{display:flex}
.menu-item{padding:12px 14px;font-size:.9rem;color:#333;border:0;
  background:#fff;text-align:left;display:flex;align-items:center;gap:10px}
.menu-item:active{background:#f5f5f5}
.menu-item.danger{color:#d9534f}
.modal-overlay{position:absolute;inset:0;background:#0007;display:none;
  justify-content:center;align-items:center;z-index:150;padding:20px}
.modal-overlay.show{display:flex}
.modal-card{background:#fff;border-radius:14px;padding:20px;
  width:100%;max-width:330px;max-height:85%;overflow-y:auto}
.modal-card h3{margin-bottom:14px;font-size:1.08rem}
.modal-card p{font-size:.88rem;color:#666;margin-bottom:12px}
.modal-card input,.modal-card select{width:100%;padding:11px 12px;
  border:1px solid #ccc;border-radius:7px;margin-bottom:12px;
  background:#fff;color:#222}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:7px;border:0;font-weight:600}
.btn-primary{background:var(--primary-blue);color:#fff}
.btn-secondary{background:#eee;color:#333}
.empty-state{grid-column:1/-1;text-align:center;color:#888;
  padding:45px 15px;font-size:.92rem}
@media(max-width:350px){
  .notes-grid{gap:8px;padding-left:10px;padding-right:10px}
  .note-card{padding:10px;height:165px}
  .fmt-btn{padding:7px 4px;min-width:28px}
}
</style>
</head>
<body>
<div class="app-container" id="appContainer">

  <div class="toast" id="toast"></div>

  <!-- HOME -->
  <section class="screen active" id="homeScreen">
    <div class="home-header">
      <button class="icon-btn" id="btnOpenDrawer" aria-label="Open categories">☰</button>
      <div class="home-header-right">
        <button class="icon-btn" id="btnSearch" title="Search notes">🔍</button>
        <button class="icon-btn" id="btnDateSort" title="Sort by date">📅</button>
        <button class="icon-btn" id="btnHomeMenu" title="Home options">⋮</button>
      </div>
    </div>

    <div class="category-bar-wrapper">
      <div class="category-scroll-container" id="categoryTabsContainer"></div>
      <button class="add-category-btn" id="btnAddCategory" title="Add Category">⊞+</button>
    </div>

    <div class="notes-grid" id="notesGrid"></div>
    <button class="fab-add-btn" id="btnFabAdd" title="Create New Note">+</button>
    <div class="app-footer">Note Master by: paulm(katupo)</div>
  </section>

  <!-- DRAWER -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Note Master</div>
      <div class="drawer-subtitle">by: paulm(katupo)</div>
    </div>
    <div class="drawer-list" id="drawerList"></div>
  </aside>

  <!-- EDITOR -->
  <section class="screen read-mode" id="editorScreen">
    <div class="top-bar">
      <button class="icon-btn" id="btnBackToHome" title="Back">←</button>
      <span class="status-badge read" id="modeBadge">READ MODE</span>
      <div class="top-actions">
        <button class="icon-btn" id="topCopyBtn" title="Copy All Text">📋</button>
        <button class="icon-btn" id="menuBtn" title="More Options">⋮</button>
      </div>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
      <button class="menu-item" id="btnSwitchMode">✏️ Edit Mode</button>
      <button class="menu-item" id="btnMove">↔️ Move to Category</button>
      <button class="menu-item" id="btnFav">⭐ Add to Favorites</button>
      <button class="menu-item danger" id="btnDelete">🗑️ Delete Note</button>
    </div>

    <div class="meta-bar">
      <span id="noteDateTime"></span>
      <select class="category-select" id="editorCategory"></select>
    </div>

    <div class="editor-container">
      <input class="note-title" id="noteTitle" placeholder="Note title" readonly>
      <div class="note-body" id="noteBody" contenteditable="false"></div>
    </div>

    <div class="formatting-toolbar" id="formattingToolbar">
      <button class="fmt-btn" id="tbCopyBtn" title="Copy">📋</button>
      <button class="fmt-btn" id="btnBold" title="Bold"><b>B</b></button>
      <button class="fmt-btn" id="btnItalic" title="Italic"><i>I</i></button>
      <button class="fmt-btn" id="btnUnderline" title="Underline"><u>U</u></button>
      <button class="fmt-btn" id="btnColor" title="Text Color"><span class="color-indicator" id="colorIndicator" style="background:#2c2c2c"></span></button>
      <button class="fmt-btn" id="btnFontMinus" title="Decrease Size">A-</button>
      <button class="fmt-btn" id="btnFontPlus" title="Increase Size">A+</button>
    </div>
    <div class="app-footer">Note Master by: paulm(katupo)</div>
  </section>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3 id="modalTitle">Add Category</h3>
      <p id="modalDescription"></p>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const STORAGE_KEY = 'notemaster_paulm_v1';

const DEFAULT_CATEGORIES = [
  'Anniversary Songs',
  'Exhort Tithes and Offerings',
  'Preaching',
  'Sunday Services'
];

const DEFAULT_NOTES = [
  {
    id:'sample-funeral',
    title:'Funeral',
    content:'Juan 11:24-26 ASD\\n[24] Sumagot si Marta, "Alam ko pong mabubuhay siyang muli sa huling araw..."\\n\\n[25] Sinabi ni Hesus sa kanya, "Ako ang bumubuhay sa mga namatay, at ako rin ang nagbibigay ng buhay."\\n\\n[26] Ang sinumang nabubuhay at sumasampalataya sa akin ay hindi mamamatay kailanman. Naniniwala ka ba dito?',
    category:'Anniversary Songs',
    updatedAt:Date.now(),
    favorite:false,
    fontSize:1.15
  },
  {
    id:'sample-opening',
    title:'Opening - Praise + tribes',
    content:'https://youtu.be/Q9YI4RgBifA?si=3pgmMrsiDZ6k1SFJ\\n\\nOutline for Sunday Worship Praise Service.',
    category:'Anniversary Songs',
    updatedAt:Date.now()-86400000,
    favorite:false,
    fontSize:1.15
  }
];

let data;
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  data = saved ? JSON.parse(saved) : null;
} catch(e) { data = null; }

if (!data || !Array.isArray(data.notes) || !Array.isArray(data.categories)) {
  data = {categories:[...DEFAULT_CATEGORIES],notes:DEFAULT_NOTES.map(n=>({...n}))};
}
if (!data.categories.includes('Favorites')) data.categories.push('Favorites');

let selectedCategory = 'All Notes';
let currentNoteId = null;
let isEditMode = false;
let fontSize = 1.15;
let colorIdx = 0;
let sortNewestFirst = true;
let searchQuery = '';
let modalAction = null;
let lastSavedSignature = '';

const colors = ['#2c2c2c','#b91c1c','#1d4ed8','#15803d','#7e22ce'];

const homeScreen = $('homeScreen');
const editorScreen = $('editorScreen');
const noteTitle = $('noteTitle');
const noteBody = $('noteBody');
const dropdownMenu = $('dropdownMenu');
const toast = $('toast');

function persist(){
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    return true;
  } catch(e) {
    showToast('Unable to save. Storage may be full.');
    return false;
  }
}
function makeId(){
  return 'n-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
}
function showToast(message){
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>toast.classList.remove('show'),2200);
}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function formatDate(timestamp){
  return new Date(timestamp || Date.now()).toLocaleString([],{
    month:'short',day:'numeric',hour:'numeric',minute:'2-digit'
  });
}
function currentNote(){
  return data.notes.find(n=>n.id===currentNoteId) || null;
}
function notePlainContent(note){
  const div = document.createElement('div');
  div.innerHTML = note.content || '';
  return div.innerText || div.textContent || '';
}
function saveCurrentNote(){
  const note = currentNote();
  if (!note) return;
  note.title = noteTitle.value;
  note.content = noteBody.innerHTML;
  note.fontSize = fontSize;
  note.updatedAt = Date.now();
  persist();
}
function visibleNotes(){
  let notes = data.notes.filter(n=>{
    const categoryMatch =
      selectedCategory==='All Notes' ? true :
      selectedCategory==='Favorites' ? !!n.favorite :
      n.category===selectedCategory;
    const query = searchQuery.trim().toLowerCase();
    const searchMatch = !query ||
      (n.title||'').toLowerCase().includes(query) ||
      notePlainContent(n).toLowerCase().includes(query);
    return categoryMatch && searchMatch;
  });
  notes.sort((a,b)=>sortNewestFirst
    ? (b.updatedAt||0)-(a.updatedAt||0)
    : (a.updatedAt||0)-(b.updatedAt||0));
  return notes;
}

function renderCategories(){
  const tabs = $('categoryTabsContainer');
  tabs.innerHTML = '';
  const categories = ['All Notes',...data.categories];
  categories.forEach(category=>{
    const button = document.createElement('button');
    button.className = 'category-tab'+(selectedCategory===category?' active':'');
    button.textContent = category==='All Notes'?'All Notes':
      category==='Favorites'?'⭐ Favorites':category;
    button.addEventListener('click',()=>{
      selectedCategory=category;
      renderHome();
    });
    tabs.appendChild(button);
  });

  const drawer = $('drawerList');
  drawer.innerHTML = '';
  categories.forEach(category=>{
    const item = document.createElement('div');
    item.className='drawer-item'+(selectedCategory===category?' active':'');
    item.textContent = category==='All Notes'?'📁 All Notes':
      category==='Favorites'?'⭐ Favorites':'📂 '+category;
    item.addEventListener('click',()=>{
      selectedCategory=category;
      closeDrawer();
      renderHome();
    });
    drawer.appendChild(item);
  });
}

function renderHome(){
  renderCategories();
  const grid = $('notesGrid');
  grid.innerHTML='';
  const notes = visibleNotes();
  if (!notes.length){
    const empty = document.createElement('div');
    empty.className='empty-state';
    empty.textContent=searchQuery
      ? 'No notes match your search.'
      : selectedCategory==='All Notes'
        ? 'No notes yet. Tap + to create your first note.'
        : 'No notes in this category yet.';
    grid.appendChild(empty);
    return;
  }
  notes.forEach(note=>{
    const card=document.createElement('div');
    card.className='note-card';
    card.tabIndex=0;
    const top=document.createElement('div');
    const title=document.createElement('div');
    title.className='note-card-title';
    title.textContent=note.title||'Untitled Note';
    if(note.favorite){
      const star=document.createElement('span');
      star.className='favorite-star';
      star.textContent='★';
      title.appendChild(star);
    }
    const preview=document.createElement('div');
    preview.className='note-card-preview';
    preview.textContent=notePlainContent(note);
    top.append(title,preview);
    const date=document.createElement('div');
    date.className='note-card-date';
    date.textContent=formatDate(note.updatedAt);
    card.append(top,date);
    card.addEventListener('click',()=>openNote(note.id,false));
    card.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();openNote(note.id,false);}
    });
    grid.appendChild(card);
  });
}

function closeDrawer(){
  $('sideDrawer').classList.remove('show');
  $('drawerOverlay').classList.remove('show');
}
$('btnOpenDrawer').addEventListener('click',()=>{
  $('sideDrawer').classList.add('show');
  $('drawerOverlay').classList.add('show');
});
$('drawerOverlay').addEventListener('click',closeDrawer);

function showHomeScreen(){
  if(isEditMode) saveCurrentNote();
  editorScreen.classList.remove('active');
  homeScreen.classList.add('active');
  dropdownMenu.classList.remove('show');
  renderHome();
}
$('btnBackToHome').addEventListener('click',showHomeScreen);

function openNote(id,edit){
  const note=data.notes.find(n=>n.id===id);
  if(!note)return;
  currentNoteId=id;
  noteTitle.value=note.title||'';
  noteBody.innerHTML=note.content||'';
  fontSize=Number(note.fontSize)||1.15;
  noteBody.style.fontSize=fontSize+'rem';
  $('noteDateTime').textContent=formatDate(note.updatedAt);
  renderEditorCategories(note.category);
  homeScreen.classList.remove('active');
  editorScreen.classList.add('active');
  setMode(!!edit);
}

function newNote(){
  const category = data.categories.includes(selectedCategory)
    ? selectedCategory
    : (data.categories.find(c=>c!=='Favorites') || data.categories[0] || 'Anniversary Songs');
  const note={
    id:makeId(),title:'',content:'',category,
    updatedAt:Date.now(),favorite:false,fontSize:1.15
  };
  data.notes.unshift(note);
  persist();
  currentNoteId=note.id;
  noteTitle.value='';
  noteBody.innerHTML='';
  fontSize=1.15;
  noteBody.style.fontSize=fontSize+'rem';
  $('noteDateTime').textContent='New note';
  renderEditorCategories(category);
  homeScreen.classList.remove('active');
  editorScreen.classList.add('active');
  setMode(true);
}
$('btnFabAdd').addEventListener('click',newNote);

function renderEditorCategories(category){
  const select=$('editorCategory');
  select.innerHTML='';
  data.categories.filter(c=>c!=='Favorites').forEach(c=>{
    const option=document.createElement('option');
    option.value=c;option.textContent='📂 '+c;
    select.appendChild(option);
  });
  if(!data.categories.includes(category) || category==='Favorites'){
    category=data.categories.find(c=>c!=='Favorites')||data.categories[0];
  }
  select.value=category;
}
$('editorCategory').addEventListener('change',()=>{
  const note=currentNote();
  if(!note)return;
  saveCurrentNote();
  note.category=$('editorCategory').value;
  note.updatedAt=Date.now();
  persist();
  showToast('Category updated');
});

function setMode(edit){
  if(isEditMode && !edit) saveCurrentNote();
  isEditMode=edit;
  dropdownMenu.classList.remove('show');
  clearReadMarker();

  if(edit){
    editorScreen.classList.remove('read-mode');
    editorScreen.classList.add('edit-mode');
    $('modeBadge').textContent='EDIT MODE';
    $('modeBadge').className='status-badge edit';
    $('btnSwitchMode').textContent='📖 Read Mode';
    noteTitle.removeAttribute('readonly');
    noteBody.contentEditable='true';
  }else{
    editorScreen.classList.remove('edit-mode');
    editorScreen.classList.add('read-mode');
    $('modeBadge').textContent='READ MODE';
    $('modeBadge').className='status-badge read';
    $('btnSwitchMode').textContent='✏️ Edit Mode';
    noteTitle.setAttribute('readonly','true');
    noteBody.contentEditable='false';
  }
}
$('btnSwitchMode').addEventListener('click',()=>{
  setMode(!isEditMode);
  if(isEditMode){
    noteTitle.focus();
  }else{
    showToast('Changes saved');
  }
});

noteTitle.addEventListener('input',()=>{
  const note=currentNote();
  if(note){note.title=noteTitle.value;note.updatedAt=Date.now();persist();}
});
noteBody.addEventListener('input',()=>{
  const note=currentNote();
  if(note){note.content=noteBody.innerHTML;note.updatedAt=Date.now();persist();}
});
noteTitle.addEventListener('blur',saveCurrentNote);
noteBody.addEventListener('blur',saveCurrentNote);

$('menuBtn').addEventListener('click',e=>{
  e.stopPropagation();
  dropdownMenu.classList.toggle('show');
});
dropdownMenu.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>dropdownMenu.classList.remove('show'));

function copyAllText(){
  const fullContent=(noteTitle.value||'')+'\\n\\n'+notePlainContent({
    content:noteBody.innerHTML
  });
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(fullContent)
      .then(()=>showToast('Copied to clipboard! 📋'))
      .catch(()=>fallbackCopy(fullContent));
  }else fallbackCopy(fullContent);
}
function fallbackCopy(text){
  const area=document.createElement('textarea');
  area.value=text;
  area.style.position='fixed';
  area.style.opacity='0';
  document.body.appendChild(area);
  area.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  area.remove();
  showToast(ok?'Copied to clipboard! 📋':'Copy unavailable in this browser');
}
$('topCopyBtn').addEventListener('click',copyAllText);
$('tbCopyBtn').addEventListener('click',copyAllText);

function clearReadMarker(){
  noteBody.querySelectorAll('.read-marker-highlight').forEach(span=>{
    span.replaceWith(document.createTextNode(span.textContent));
  });
}
noteBody.addEventListener('click',e=>{
  if(isEditMode)return;
  clearReadMarker();
  const selection=window.getSelection();
  if(!selection || !selection.rangeCount)return;
  const range=selection.getRangeAt(0);
  const node=range.startContainer;
  if(node.nodeType!==Node.TEXT_NODE)return;
  const text=node.textContent;
  let start=range.startOffset,end=range.startOffset;
  while(start>0 && !/\\s/.test(text[start-1]))start--;
  while(end<text.length && !/\\s/.test(text[end]))end++;
  if(start===end)return;
  const wordRange=document.createRange();
  wordRange.setStart(node,start);wordRange.setEnd(node,end);
  const span=document.createElement('span');
  span.className='read-marker-highlight';
  try{wordRange.surroundContents(span);}catch(e){}
});

function formatDoc(command,value=null){
  if(!isEditMode)setMode(true);
  noteBody.focus();
  try{document.execCommand(command,false,value);}catch(e){}
  saveCurrentNote();
}
$('btnBold').addEventListener('click',()=>formatDoc('bold'));
$('btnItalic').addEventListener('click',()=>formatDoc('italic'));
$('btnUnderline').addEventListener('click',()=>formatDoc('underline'));

$('btnColor').addEventListener('click',()=>{
  colorIdx=(colorIdx+1)%colors.length;
  const color=colors[colorIdx];
  $('colorIndicator').style.backgroundColor=color;
  formatDoc('foreColor',color);
});
$('btnFontPlus').addEventListener('click',()=>{
  fontSize=Math.min(fontSize+.1,2.2);
  noteBody.style.fontSize=fontSize+'rem';
  saveCurrentNote();
});
$('btnFontMinus').addEventListener('click',()=>{
  fontSize=Math.max(fontSize-.1,.8);
  noteBody.style.fontSize=fontSize+'rem';
  saveCurrentNote();
});

function openModal(title,description,fieldHTML,action){
  $('modalTitle').textContent=title;
  $('modalDescription').textContent=description||'';
  $('modalFields').innerHTML=fieldHTML||'';
  modalAction=action;
  $('modalOverlay').classList.add('show');
  const input=$('modalFields').querySelector('input,select');
  if(input)setTimeout(()=>input.focus(),50);
}
function closeModal(){
  $('modalOverlay').classList.remove('show');
  modalAction=null;
}
$('modalCancel').addEventListener('click',closeModal);
$('modalOverlay').addEventListener('click',e=>{
  if(e.target===$('modalOverlay'))closeModal();
});
$('modalConfirm').addEventListener('click',()=>{
  if(modalAction)modalAction();
});

$('btnAddCategory').addEventListener('click',()=>{
  openModal('Add Category','Enter a name for the new category.',
    '<input id="categoryNameInput" maxlength="60" placeholder="Category name">',
    ()=>{
      const name=$('categoryNameInput').value.trim();
      if(!name){showToast('Enter a category name');return;}
      if(data.categories.some(c=>c.toLowerCase()===name.toLowerCase())){
        showToast('Category already exists');return;
      }
      data.categories.push(name);
      selectedCategory=name;
      persist();closeModal();renderHome();
      showToast('Category added');
    });
});
$('categoryNameInput')?.addEventListener('keydown',e=>{
  if(e.key==='Enter')$('modalConfirm').click();
});

$('btnMove').addEventListener('click',()=>{
  const note=currentNote();
  if(!note)return;
  const options=data.categories.filter(c=>c!=='Favorites')
    .map(c=>'<option value="'+escapeHTML(c)+'"'+(c===note.category?' selected':'')+'>'+escapeHTML(c)+'</option>').join('');
  openModal('Move Note','Choose the destination category.',
    '<select id="moveCategorySelect">'+options+'</select>',
    ()=>{
      const destination=$('moveCategorySelect').value;
      if(!destination)return;
      saveCurrentNote();
      note.category=destination;
      note.updatedAt=Date.now();
      persist();
      renderEditorCategories(destination);
      closeModal();renderHome();
      showToast('Note moved to '+destination);
    });
  dropdownMenu.classList.remove('show');
});

$('btnFav').addEventListener('click',()=>{
  const note=currentNote();
  if(!note)return;
  note.favorite=!note.favorite;
  note.updatedAt=Date.now();
  persist();
  updateFavoriteMenu();
  dropdownMenu.classList.remove('show');
  renderHome();
  showToast(note.favorite?'Added to Favorites ⭐':'Removed from Favorites');
});
function updateFavoriteMenu(){
  const note=currentNote();
  $('btnFav').textContent=note&&note.favorite
    ?'⭐ Remove from Favorites':'⭐ Add to Favorites';
}

$('btnDelete').addEventListener('click',()=>{
  const note=currentNote();
  if(!note)return;
  dropdownMenu.classList.remove('show');
  openModal('Delete Note','Delete "'+(note.title||'Untitled Note')+'"? This cannot be undone.',
    '',
    ()=>{
      data.notes=data.notes.filter(n=>n.id!==currentNoteId);
      persist();closeModal();
      currentNoteId=null;
      editorScreen.classList.remove('active');
      homeScreen.classList.add('active');
      renderHome();
      showToast('Note deleted');
    });
});

const originalOpenNote=openNote;
openNote=function(id,edit){
  originalOpenNote(id,edit);
  updateFavoriteMenu();
};

$('btnSearch').addEventListener('click',()=>{
  openModal('Search Notes','Search by note title or content.',
    '<input id="searchInput" placeholder="Type to search..." value="'+escapeHTML(searchQuery)+'">',
    ()=>{
      searchQuery=$('searchInput').value.trim();
      closeModal();renderHome();
    });
});
$('btnDateSort').addEventListener('click',()=>{
  sortNewestFirst=!sortNewestFirst;
  renderHome();
  showToast(sortNewestFirst?'Newest notes first':'Oldest notes first');
});
$('btnHomeMenu').addEventListener('click',()=>{
  openModal('Home Options','Choose an action.',
    '<button class="btn btn-secondary" id="showAllBtn" style="width:100%;margin-bottom:8px">Show All Notes</button><button class="btn btn-secondary" id="showFavoritesBtn" style="width:100%">Show Favorites</button>',
    ()=>{});
  $('showAllBtn').addEventListener('click',()=>{
    selectedCategory='All Notes';searchQuery='';closeModal();renderHome();
  });
  $('showFavoritesBtn').addEventListener('click',()=>{
    selectedCategory='Favorites';closeModal();renderHome();
  });
});

renderHome();
})();
</script>
</body>
</html>
