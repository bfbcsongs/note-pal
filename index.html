
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>NOTE PAL</title>
<style>
:root{
  --bg:#f3f5f9;--surface:#fff;--text:#172033;--muted:#758096;
  --line:#e4e8f0;--accent:#5367e8;--accent2:#4053d4;
  --amber:#ffbf47;--danger:#dc3545;--shadow:0 5px 22px #1720330b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:900px;margin:0 auto;min-height:100dvh;background:var(--bg)}
.topbar{height:65px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:21px;letter-spacing:-.7px}
.logo{width:36px;height:36px;display:grid;place-items:center;background:var(--accent);color:white;border-radius:12px;font-size:19px}
.top-actions{display:flex;align-items:center;gap:8px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.primary{background:var(--accent);color:white}
.primary:active{background:var(--accent2)}
.secondary{background:#edf0ff;color:var(--accent)}
.ghost{background:transparent;color:var(--text)}
.danger{background:#fff0f0;color:var(--danger)}
.icon-btn{width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);display:grid;place-items:center;font-size:19px}
.icon-btn:active,.tool:active{transform:scale(.96)}
main{padding:20px 16px 35px}
h1{font-size:27px;line-height:1.2;margin:3px 0 7px;letter-spacing:-.7px}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:19px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 13px;height:48px;box-shadow:var(--shadow)}
.searchbox span{font-size:18px;color:var(--muted)}
.searchbox input{border:0;outline:0;background:transparent;width:100%;min-width:0;color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:15px 0 17px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:30px;padding:8px 13px;font-size:12px;font-weight:750}
.chip.active{background:var(--accent);border-color:var(--accent);color:white}
.list-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.list-heading strong{font-size:15px}
.list-heading select{background:var(--surface);border:1px solid var(--line);padding:8px 10px;border-radius:9px;color:var(--text);font-size:12px;max-width:145px}
.notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;min-height:145px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;cursor:pointer;overflow:hidden}
.note-card:active{transform:scale(.99)}
.note-card h3{font-size:15px;margin:0;padding-right:24px;line-height:1.35;overflow-wrap:anywhere}
.note-card .preview{font-size:12px;line-height:1.55;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.note-meta{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:3px}
.category-tag{display:inline-block;padding:4px 7px;border-radius:7px;background:#eef0ff;color:#5367d9;font-weight:750;max-width:125px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-flags{position:absolute;right:12px;top:12px;display:flex;gap:4px;font-size:13px}
.empty{padding:45px 15px;text-align:center;color:var(--muted);grid-column:1/-1}
.empty .empty-icon{font-size:40px;margin-bottom:9px}
.empty h3{color:var(--text);margin:0 0 6px}
.empty p{font-size:13px;line-height:1.6}
.hidden{display:none!important}

/* Editor */
.editor-screen{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.editor-top{min-height:59px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.editor-left,.editor-right{display:flex;align-items:center;gap:6px}
.editor-top .icon-btn{width:38px;height:38px;border:0}
.save-btn{color:#18864b;font-size:24px;font-weight:900}
.editor-right .icon-btn{font-size:18px}
.editor-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 15px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.timestamp{font-size:11px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.category-select{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--surface);color:var(--text);font-size:12px;max-width:145px}
.editor-content{flex:1;overflow:auto;overscroll-behavior:contain;padding:20px 18px 30px;min-height:0}
.note-title{display:block;width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:25px;font-weight:800;line-height:1.3;letter-spacing:-.5px;resize:none;overflow:hidden;margin:0 0 17px;padding:0}
.note-title::placeholder{color:#a4acbb}
.note-body{outline:none;min-height:45vh;font-size:16px;line-height:1.8;color:var(--text);overflow-wrap:anywhere;white-space:normal}
.note-body:empty:before{content:"Start writing your note...";color:#a4acbb;pointer-events:none}
.note-body[contenteditable="false"]{user-select:text}
.note-body p{margin:0 0 10px}
.note-body ul,.note-body ol{padding-left:25px}
.note-body img{max-width:100%;height:auto;border-radius:10px}
.note-body a{color:var(--accent)}
.note-body blockquote{margin:12px 0;padding:8px 13px;border-left:3px solid var(--accent);background:#f0f2ff}
.note-body table{border-collapse:collapse;max-width:100%}
.note-body td,.note-body th{border:1px solid var(--line);padding:6px}
.note-body [data-checklist="true"]{list-style:none;padding-left:3px}
.note-body [data-checklist="true"] input{margin-right:8px;accent-color:var(--accent)}
.read-badge{display:inline-block;margin-left:5px;border:1px solid #ffca62;color:#8b5a00;background:#fff3cf;border-radius:99px;font-size:10px;padding:0 5px;vertical-align:middle}
.editor-bottom{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 9px calc(8px + env(safe-area-inset-bottom));z-index:4}
.toolbar{display:flex;align-items:center;justify-content:flex-start;gap:5px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{flex-shrink:0;min-width:37px;height:38px;padding:0 9px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);font-weight:750;font-size:15px;display:flex;align-items:center;justify-content:center;gap:5px}
.tool.active{background:#edf0ff;border-color:#dce1ff;color:var(--accent)}
.tool-label{font-size:10px;font-weight:700}
.color-tool{position:relative;overflow:hidden}
.color-tool input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.menu-wrap{position:relative}
.menu-panel{position:absolute;right:0;top:45px;width:205px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 35px #0002;padding:6px;z-index:60}
.menu-item{width:100%;text-align:left;border:0;border-radius:9px;background:transparent;color:var(--text);padding:11px 10px;font-size:13px;font-weight:650}
.menu-item:active{background:var(--bg)}
.menu-item.delete{color:var(--danger)}
.modal-backdrop{position:fixed;inset:0;background:#10182777;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(100%,360px);background:var(--surface);border-radius:18px;padding:21px;box-shadow:0 15px 45px #0003}
.modal h3{margin:0 0 8px;font-size:18px}
.modal p{font-size:13px;line-height:1.55;color:var(--muted)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.read-highlight{background:#ffd166;color:#241800;border-radius:4px;box-shadow:0 0 0 2px #ffbf47,0 0 12px #ffbf47aa}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#182238;color:#fff;padding:11px 16px;border-radius:12px;font-size:12px;z-index:150;box-shadow:0 5px 20px #0002;max-width:90%;text-align:center}
@media(min-width:700px){
  .app{max-width:900px}
  main{padding:27px 25px 45px}
  .notes-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .editor-content{padding:28px max(24px,calc((100% - 720px)/2)) 35px}
  .editor-bottom{padding-left:calc((100% - 720px)/2);padding-right:calc((100% - 720px)/2)}
}
@media(max-width:360px){
  .notes-grid{grid-template-columns:1fr}
  .brand{font-size:19px}
  .topbar{padding:0 11px}
  .btn{padding:9px 10px}
}
</style>
</head>
<body>
<div class="app" id="homeScreen">
  <header class="topbar">
    <div class="brand"><div class="logo">✎</div><span>NOTE PAL</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="homeSortBtn" title="Sort notes" aria-label="Sort notes">⇅</button>
      <button class="btn primary" id="addNoteBtn"><span>＋</span> Add Note</button>
    </div>
  </header>
  <main>
    <h1>Your Notes</h1>
    <div class="subtitle">Your thoughts, organized in one place.</div>
    <div class="searchbox"><span>⌕</span><input id="searchInput" type="search" placeholder="Search your notes..." autocomplete="off"></div>
    <div class="chips" id="categoryChips"></div>
    <div class="list-heading">
      <strong id="notesCount">All Notes</strong>
      <select id="sortSelect" aria-label="Sort notes">
        <option value="updated">Recently updated</option>
        <option value="created">Date created</option>
        <option value="title">Title A–Z</option>
        <option value="favorite">Favorites first</option>
      </select>
    </div>
    <div class="notes-grid" id="notesGrid"></div>
  </main>
</div>

<section class="editor-screen hidden" id="editorScreen" aria-label="Note editor">
  <header class="editor-top">
    <div class="editor-left">
      <button class="icon-btn save-btn" id="saveBtn" title="Save note" aria-label="Save note">✓</button>
    </div>
    <div class="editor-right">
      <button class="icon-btn" id="undoBtn" title="Undo" aria-label="Undo">↶</button>
      <button class="icon-btn" id="redoBtn" title="Redo" aria-label="Redo">↷</button>
      <div class="menu-wrap">
        <button class="icon-btn" id="menuBtn" title="More options" aria-label="More options">⋮</button>
        <div class="menu-panel hidden" id="menuPanel">
          <button class="menu-item" id="modeMenuBtn">☷ &nbsp; Read Mode</button>
          <button class="menu-item" id="favoriteMenuBtn">☆ &nbsp; Add to Favorites</button>
          <button class="menu-item" id="pinMenuBtn">⌁ &nbsp; Pin Note</button>
          <button class="menu-item" id="shareMenuBtn">↗ &nbsp; Share Note</button>
          <button class="menu-item" id="duplicateMenuBtn">▣ &nbsp; Duplicate Note</button>
          <button class="menu-item delete" id="deleteMenuBtn">⌫ &nbsp; Delete Note</button>
        </div>
      </div>
    </div>
  </header>
  <div class="editor-sub">
    <div class="timestamp" id="noteTimestamp">New note</div>
    <select class="category-select" id="editorCategory" aria-label="Note category">
      <option>General</option><option>Sermon</option><option>Bible Study</option>
      <option>Devotion</option><option>Ministry</option><option>Personal</option>
    </select>
  </div>
  <div class="editor-content" id="editorScroll">
    <textarea class="note-title" id="noteTitle" rows="1" placeholder="Note title..." maxlength="180"></textarea>
    <div class="note-body" id="noteBody" contenteditable="true" role="textbox" aria-label="Note content" data-placeholder="Start writing your note..."></div>
  </div>
  <footer class="editor-bottom" id="editorToolbar">
    <div class="toolbar" id="editToolbar">
      <button class="tool" data-command="bold" title="Bold"><b>B</b></button>
      <button class="tool" data-command="italic" title="Italic"><i>I</i></button>
      <button class="tool" data-command="underline" title="Underline"><u>U</u></button>
      <button class="tool" data-command="strikeThrough" title="Strikethrough"><s>S</s></button>
      <button class="tool" id="wordColorBtn" title="Word Color">A<span style="font-size:10px;color:#5367e8">▾</span></button>
      <input type="color" id="wordColorPicker" value="#5367e8" class="hidden" aria-label="Choose word color">
      <button class="tool" id="fontDownBtn" title="Decrease font size">A−</button>
      <button class="tool" id="fontUpBtn" title="Increase font size">A+</button>
      <button class="tool" id="checklistBtn" title="Insert checklist">☑</button>
      <button class="tool" id="attachBtn" title="Attach image or file">＋<span class="tool-label">Attach</span></button>
      <input type="file" id="attachInput" accept="image/*,.txt,.pdf,.doc,.docx" multiple class="hidden">
      <button class="tool" id="drawBtn" title="Open drawing pad">✎<span class="tool-label">Draw</span></button>
      <button class="tool" id="clearFormatBtn" title="Clear formatting">Tx</button>
    </div>
    <div class="toolbar hidden" id="readToolbar">
      <button class="tool" id="readHighlightBtn" title="Tap a word in your note to highlight it">✦ <span class="tool-label">Highlight word</span><span class="read-badge" id="highlightCount">0</span></button>
      <button class="tool" id="readFontDownBtn" title="Decrease font size">A−</button>
      <button class="tool" id="readFontUpBtn" title="Increase font size">A+</button>
      <button class="tool" id="readEditBtn" title="Return to Edit Mode">✎ <span class="tool-label">Edit</span></button>
    </div>
  </footer>
</section>

<div class="modal-backdrop hidden" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle">Confirm action</h3>
    <p id="confirmText">Are you sure?</p>
    <div class="modal-actions">
      <button class="btn secondary" id="cancelConfirmBtn">Cancel</button>
      <button class="btn primary" id="acceptConfirmBtn">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="drawModal">
  <div class="modal" style="width:min(100%,520px)">
    <h3>Drawing Pad</h3>
    <p>Draw with your finger or mouse. Add the drawing to your note when finished.</p>
    <canvas id="drawCanvas" style="width:100%;height:240px;display:block;border:1px solid var(--line);border-radius:10px;touch-action:none;background:white"></canvas>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn secondary" id="clearDrawingBtn">Clear</button>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" id="cancelDrawingBtn">Cancel</button>
        <button class="btn primary" id="saveDrawingBtn">Insert Drawing</button>
      </div>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(function(){
"use strict";

/* NOTE PAL: one declaration for each state variable */
const $ = id => document.getElementById(id);
const STORAGE_KEY = "notepal_notes_v1";
const CATEGORIES_KEY = "notepal_categories_v1";
const DEFAULT_CATEGORIES = ["General","Sermon","Bible Study","Devotion","Ministry","Personal"];

let notes = [];
let activeNoteId = null;
let activeCategory = "All";
let searchTerm = "";
let sortMode = "updated";
let isReadMode = false;
let confirmAction = null;
let toastTimer = null;
let savedSelection = null;
let undoStack = [];
let redoStack = [];
let isRestoring = false;
let highlightEnabled = false;
let highlightedWords = 0;
let readFontSize = 16;
let drawContext = null;
let drawing = false;
let lastDrawPoint = null;

function makeId(){
  return "note_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9);
}
function now(){return new Date().toISOString()}
function escapeHTML(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}
function stripHTML(html){
  const temp=document.createElement("div");
  temp.innerHTML=html||"";
  return (temp.innerText||temp.textContent||"").trim();
}
function safeDate(value){
  const d=new Date(value);
  return isNaN(d.getTime()) ? new Date() : d;
}
function dateLabel(value){
  const d=safeDate(value);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function timeLabel(value){
  const d=safeDate(value);
  return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function getNote(id){return notes.find(n=>n.id===id)}
function createEmptyNote(){
  return {
    id:makeId(),title:"",content:"",category:"General",
    createdAt:now(),updatedAt:now(),pinned:false,favorite:false
  };
}
function normalizeNote(n){
  return {
    id:n.id||makeId(),
    title:typeof n.title==="string"?n.title:"",
    content:typeof n.content==="string"?n.content:"",
    category:DEFAULT_CATEGORIES.includes(n.category)?n.category:"General",
    createdAt:n.createdAt||now(),updatedAt:n.updatedAt||n.createdAt||now(),
    pinned:!!n.pinned,favorite:!!n.favorite
  };
}
function loadNotes(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    const parsed=raw?JSON.parse(raw):[];
    notes=Array.isArray(parsed)?parsed.map(normalizeNote):[];
  }catch(error){
    notes=[];
    showToast("Could not read saved notes. Check browser storage.");
  }
}
function saveNotes(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(notes));
    return true;
  }catch(error){
    showToast("Storage is full. Try removing large attachments.");
    return false;
  }
}
function saveCategories(){
  try{localStorage.setItem(CATEGORIES_KEY,JSON.stringify(DEFAULT_CATEGORIES));}catch(e){}
}
function showToast(message){
  const el=$("toast");
  el.textContent=message;
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add("hidden"),2200);
}
function setEditorOpen(open){
  $("editorScreen").classList.toggle("hidden",!open);
  $("homeScreen").classList.toggle("hidden",open);
}
function renderCategoryChips(){
  const host=$("categoryChips");
  const cats=["All","Pinned","Favorites",...DEFAULT_CATEGORIES];
  host.innerHTML=cats.map(cat=>{
    const active=cat===activeCategory?" active":"";
    return '<button class="chip'+active+'" data-category="'+escapeHTML(cat)+'">'+escapeHTML(cat)+'</button>';
  }).join("");
}
function sortNotes(list){
  const result=list.slice();
  result.sort((a,b)=>{
    if(a.pinned!==b.pinned)return a.pinned?-1:1;
    if(sortMode==="title")return (a.title||"Untitled").localeCompare(b.title||"Untitled");
    if(sortMode==="created")return new Date(b.createdAt)-new Date(a.createdAt);
    if(sortMode==="favorite"&&a.favorite!==b.favorite)return a.favorite?-1:1;
    return new Date(b.updatedAt)-new Date(a.updatedAt);
  });
  return result;
}
function renderNotes(){
  renderCategoryChips();
  const q=searchTerm.trim().toLowerCase();
  let list=notes.filter(n=>{
    if(activeCategory==="Pinned"&&!n.pinned)return false;
    if(activeCategory==="Favorites"&&!n.favorite)return false;
    if(activeCategory!=="All"&&activeCategory!=="Pinned"&&activeCategory!=="Favorites"&&n.category!==activeCategory)return false;
    if(q&&!(n.title+" "+stripHTML(n.content)+" "+n.category).toLowerCase().includes(q))return false;
    return true;
  });
  list=sortNotes(list);
  $("notesCount").textContent=(activeCategory==="All"?"All Notes":activeCategory)+" · "+list.length;
  const host=$("notesGrid");
  if(!list.length){
    host.innerHTML='<div class="empty"><div class="empty-icon">📝</div><h3>'+(q?'No matching notes':'No notes yet')+'</h3><p>'+(q?'Try another search term.':'Tap “Add Note” to create your first note.')+'</p></div>';
    return;
  }
  host.innerHTML=list.map(n=>{
    const title=n.title.trim()||"Untitled note";
    const preview=stripHTML(n.content)||"No additional text";
    return '<article class="note-card" data-open-note="'+escapeHTML(n.id)+'">'+
      '<div class="card-flags">'+(n.pinned?'<span title="Pinned">📌</span>':'')+(n.favorite?'<span title="Favorite">★</span>':'')+'</div>'+
      '<h3>'+escapeHTML(title)+'</h3>'+
      '<div class="preview">'+escapeHTML(preview)+'</div>'+
      '<div class="note-meta"><span class="category-tag">'+escapeHTML(n.category)+'</span><span>'+escapeHTML(dateLabel(n.updatedAt))+'</span></div>'+
      '</article>';
  }).join("");
}
function saveCurrentEditor(showMessage){
  if(!activeNoteId)return false;
  const n=getNote(activeNoteId);
  if(!n)return false;
  n.title=$("noteTitle").value;
  n.content=$("noteBody").innerHTML;
  n.category=$("editorCategory").value;
  n.updatedAt=now();
  const ok=saveNotes();
  if(ok){
    $("noteTimestamp").textContent="Updated "+timeLabel(n.updatedAt);
    if(showMessage)showToast("Note saved ✓");
  }
  return ok;
}
function openNewNote(){
  const n=createEmptyNote();
  notes.unshift(n);
  activeNoteId=n.id;
  saveNotes();
  openEditor(n.id);
}
function openEditor(id){
  const n=getNote(id);
  if(!n)return;
  activeNoteId=id;
  isReadMode=false;
  highlightEnabled=false;
  highlightedWords=0;
  readFontSize=16;
  undoStack=[];
  redoStack=[];
  $("noteTitle").value=n.title;
  $("noteBody").innerHTML=n.content||"";
  $("editorCategory").value=n.category;
  $("noteTimestamp").textContent=n.createdAt===n.updatedAt?"Created "+timeLabel(n.createdAt):"Updated "+timeLabel(n.updatedAt);
  $("menuPanel").classList.add("hidden");
  setEditorOpen(true);
  applyMode();
  pushUndoState();
  updateMenuLabels();
  autoResizeTitle();
}
function closeEditor(){
  saveCurrentEditor(false);
  activeNoteId=null;
  setEditorOpen(false);
  renderNotes();
}
function applyMode(){
  $("noteTitle").readOnly=isReadMode;
  $("noteBody").setAttribute("contenteditable",isReadMode?"false":"true");
  $("editToolbar").classList.toggle("hidden",isReadMode);
  $("readToolbar").classList.toggle("hidden",!isReadMode);
  $("undoBtn").classList.toggle("hidden",isReadMode);
  $("redoBtn").classList.toggle("hidden",isReadMode);
  $("editorToolbar").classList.toggle("hidden",false);
  $("modeMenuBtn").innerHTML=isReadMode?"✎ &nbsp; Edit Mode":"☷ &nbsp; Read Mode";
  $("readHighlightBtn").classList.toggle("active",highlightEnabled);
  $("highlightCount").textContent=String(highlightedWords);
  $("noteBody").style.fontSize=readFontSize+"px";
  $("noteTitle").style.fontSize=Math.min(32,25+(readFontSize-16)*.35)+"px";
}
function updateMenuLabels(){
  const n=getNote(activeNoteId);
  if(!n)return;
  $("favoriteMenuBtn").innerHTML=(n.favorite?"★ &nbsp; Remove Favorite":"☆ &nbsp; Add to Favorites");
  $("pinMenuBtn").innerHTML=(n.pinned?"📌 &nbsp; Unpin Note":"⌁ &nbsp; Pin Note");
}
function autoResizeTitle(){
  const el=$("noteTitle");
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,150)+"px";
}
function pushUndoState(){
  if(isRestoring)return;
  const state=JSON.stringify({title:$("noteTitle").value,content:$("noteBody").innerHTML});
  if(undoStack[undoStack.length-1]===state)return;
  undoStack.push(state);
  if(undoStack.length>80)undoStack.shift();
  redoStack=[];
}
function restoreState(state){
  try{
    isRestoring=true;
    const data=JSON.parse(state);
    $("noteTitle").value=data.title||"";
    $("noteBody").innerHTML=data.content||"";
    autoResizeTitle();
    saveCurrentEditor(false);
  }finally{isRestoring=false}
}
function doUndo(){
  if(undoStack.length<2){showToast("Nothing to undo");return}
  const current=undoStack.pop();
  redoStack.push(current);
  restoreState(undoStack[undoStack.length-1]);
}
function doRedo(){
  if(!redoStack.length){showToast("Nothing to redo");return}
  const state=redoStack.pop();
  undoStack.push(state);
  restoreState(state);
}
function saveSelection(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  const body=$("noteBody");
  if(body.contains(range.commonAncestorContainer)){
    savedSelection=range.cloneRange();
  }
}
function restoreSelection(){
  const body=$("noteBody");
  body.focus();
  const sel=window.getSelection();
  if(sel&&savedSelection){
    try{sel.removeAllRanges();sel.addRange(savedSelection)}catch(e){}
  }
}
function runCommand(command,value){
  if(isReadMode)return;
  restoreSelection();
  $("noteBody").focus();
  try{document.execCommand(command,false,value||null)}catch(e){}
  saveSelection();
  pushUndoState();
  saveCurrentEditor(false);
}
function changeFontSize(delta){
  const body=$("noteBody");
  if(isReadMode){
    readFontSize=Math.max(11,Math.min(32,readFontSize+delta));
    body.style.fontSize=readFontSize+"px";
    $("noteTitle").style.fontSize=Math.min(32,25+(readFontSize-16)*.35)+"px";
    return;
  }
  restoreSelection();
  body.focus();
  const sel=window.getSelection();
  if(sel&&sel.rangeCount&&!sel.isCollapsed&&body.contains(sel.anchorNode)){
    const span=document.createElement("span");
    span.style.fontSize=""+Math.max(1,Math.min(7,(delta>0?4:3)+(delta>0?1:-1)))+"";
    const range=sel.getRangeAt(0);
    try{range.surroundContents(span)}catch(e){
      const frag=range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);
    }
    sel.removeAllRanges();
    const newRange=document.createRange();
    newRange.selectNodeContents(span);
    sel.addRange(newRange);
    savedSelection=newRange.cloneRange();
  }else{
    const current=parseFloat(body.style.fontSize)||16;
    body.style.fontSize=Math.max(11,Math.min(32,current+delta))+"px";
  }
  pushUndoState();
  saveCurrentEditor(false);
}
function setWordColor(color){
  if(isReadMode)return;
  restoreSelection();
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed){
    showToast("Select a word or text first, then choose its color.");
    return;
  }
  runCommand("foreColor",color);
}
function insertChecklist(){
  if(isReadMode)return;
  restoreSelection();
  $("noteBody").focus();
  const sel=window.getSelection();
  if(sel&&sel.rangeCount&&!sel.isCollapsed){
    runCommand("insertUnorderedList");
  }else{
    const li=document.createElement("div");
    li.setAttribute("data-checklist","true");
    li.innerHTML='<label><input type="checkbox"> <span>Checklist item</span></label>';
    if(!sel||!sel.rangeCount){
      $("noteBody").appendChild(li);
    }else{
      const range=sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(li);
    }
    const range=document.createRange();
    range.selectNodeContents(li.querySelector("span"));
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
    savedSelection=range.cloneRange();
  }
  pushUndoState();
  saveCurrentEditor(false);
}
function attachFiles(files){
  const list=Array.from(files||[]);
  if(!list.length)return;
  list.forEach(file=>{
    if(file.type.startsWith("image/")){
      const reader=new FileReader();
      reader.onload=()=>{
        const img=document.createElement("img");
        img.src=reader.result;
        img.alt=file.name;
        restoreSelection();
        const sel=window.getSelection();
        if(sel&&sel.rangeCount&&$("noteBody").contains(sel.anchorNode)){
          const range=sel.getRangeAt(0);
          range.deleteContents();
          range.insertNode(img);
          range.setStartAfter(img);range.collapse(true);
          sel.removeAllRanges();sel.addRange(range);
        }else{
          $("noteBody").appendChild(img);
        }
        pushUndoState();saveCurrentEditor(false);
      };
      reader.readAsDataURL(file);
    }else{
      const link=document.createElement("a");
      link.href=URL.createObjectURL(file);
      link.download=file.name;
      link.textContent="📎 "+file.name+" (downloadable while this page is open)";
      link.target="_blank";
      link.rel="noopener";
      link.style.display="block";
      link.style.margin="8px 0";
      $("noteBody").appendChild(link);
      pushUndoState();saveCurrentEditor(false);
      showToast("File attached. Non-image files may not persist after reload.");
    }
  });
}
function confirmBox(title,message,fn){
  $("confirmTitle").textContent=title;
  $("confirmText").textContent=message;
  confirmAction=fn;
  $("confirmModal").classList.remove("hidden");
}
function closeConfirm(){
  $("confirmModal").classList.add("hidden");
  confirmAction=null;
}
function deleteCurrentNote(){
  const n=getNote(activeNoteId);
  if(!n)return;
  confirmBox("Delete note?","This note will be removed from this browser.",function(){
    notes=notes.filter(item=>item.id!==activeNoteId);
    saveNotes();
    closeConfirm();
    activeNoteId=null;
    setEditorOpen(false);
    renderNotes();
    showToast("Note deleted");
  });
}
function toggleFavorite(){
  const n=getNote(activeNoteId);if(!n)return;
  n.favorite=!n.favorite;n.updatedAt=now();
  saveNotes();updateMenuLabels();
  showToast(n.favorite?"Added to Favorites":"Removed from Favorites");
}
function togglePin(){
  const n=getNote(activeNoteId);if(!n)return;
  n.pinned=!n.pinned;n.updatedAt=now();
  saveNotes();updateMenuLabels();
  showToast(n.pinned?"Note pinned":"Note unpinned");
}
async function shareCurrentNote(){
  saveCurrentEditor(false);
  const n=getNote(activeNoteId);if(!n)return;
  const text=(n.title||"Untitled note")+"\n\n"+stripHTML(n.content);
  try{
    if(navigator.share){
      await navigator.share({title:n.title||"NOTE PAL",text});
    }else if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      showToast("Note copied to clipboard");
    }else{
      const area=document.createElement("textarea");
      area.value=text;document.body.appendChild(area);area.select();
      document.execCommand("copy");area.remove();
      showToast("Note copied to clipboard");
    }
  }catch(e){
    if(e&&e.name!=="AbortError")showToast("Unable to share note on this device.");
  }
}
function duplicateCurrentNote(){
  saveCurrentEditor(false);
  const n=getNote(activeNoteId);if(!n)return;
  const copy=normalizeNote({...n,id:makeId(),title:(n.title||"Untitled note")+" (Copy)",createdAt:now(),updatedAt:now(),pinned:false});
  notes.unshift(copy);saveNotes();
  openEditor(copy.id);
  showToast("Note duplicated");
}
function setReadHighlight(on){
  highlightEnabled=on;
  $("readHighlightBtn").classList.toggle("active",on);
  showToast(on?"Tap a word in the note to highlight it":"Word highlight off");
}
function handleReadWordTap(event){
  if(!isReadMode||!highlightEnabled)return;
  if(event.target.closest("a,button,input,textarea"))return;
  const sel=window.getSelection();
  if(sel&&!sel.isCollapsed)return;
  let node=event.target;
  let offset=0;
  if(node.nodeType!==Node.TEXT_NODE){
    const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
    const first=walker.nextNode();
    if(!first)return;
    node=first;
  }
  const text=node.textContent||"";
  const pos=typeof event.offsetX==="number"?null:null;
  if(!text.trim())return;
  const parent=node.parentElement;
  if(parent&&parent.classList.contains("read-highlight")){
    const plain=document.createTextNode(parent.textContent);
    parent.replaceWith(plain);
    highlightedWords=Math.max(0,highlightedWords-1);
    $("highlightCount").textContent=String(highlightedWords);
    saveCurrentEditor(false);
    return;
  }
  const range=document.createRange();
  const wordRegex=/[\p{L}\p{N}_'-]+/gu;
  let match,chosen=null;
  const x=event.clientX,y=event.clientY;
  while((match=wordRegex.exec(text))!==null){
    range.setStart(node,match.index);
    range.setEnd(node,match.index+match[0].length);
    const rect=range.getBoundingClientRect();
    if(x>=rect.left-3&&x<=rect.right+3&&y>=rect.top-3&&y<=rect.bottom+3){
      chosen={start:match.index,end:match.index+match[0].length};
      break;
    }
  }
  if(!chosen){
    const trimmed=text.trim();
    const index=text.indexOf(trimmed);
    if(index>=0){chosen={start:index,end:index+trimmed.split(/\s+/)[0].length}}
  }
  if(!chosen)return;
  range.setStart(node,chosen.start);
  range.setEnd(node,chosen.end);
  const span=document.createElement("span");
  span.className="read-highlight";
  try{
    range.surroundContents(span);
  }catch(e){
    const frag=range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
  }
  highlightedWords++;
  $("highlightCount").textContent=String(highlightedWords);
  saveCurrentEditor(false);
}
function resizeCanvas(){
  const canvas=$("drawCanvas");
  const rect=canvas.getBoundingClientRect();
  const ratio=window.devicePixelRatio||1;
  const snapshot=canvas.toDataURL();
  canvas.width=Math.round(rect.width*ratio);
  canvas.height=Math.round(rect.height*ratio);
  drawContext=canvas.getContext("2d");
  drawContext.scale(ratio,ratio);
  drawContext.lineWidth=3;
  drawContext.lineCap="round";
  drawContext.lineJoin="round";
  drawContext.strokeStyle="#20283a";
  const img=new Image();
  img.onload=()=>{try{drawContext.drawImage(img,0,0,rect.width,rect.height)}catch(e){}};
  img.src=snapshot;
}
function canvasPoint(event){
  const rect=$("drawCanvas").getBoundingClientRect();
  return {x:event.clientX-rect.left,y:event.clientY-rect.top};
}
function startDrawing(event){
  event.preventDefault();
  drawing=true;
  lastDrawPoint=canvasPoint(event);
  try{$("drawCanvas").setPointerCapture(event.pointerId)}catch(e){}
}
function continueDrawing(event){
  if(!drawing||!drawContext)return;
  event.preventDefault();
  const p=canvasPoint(event);
  drawContext.beginPath();
  drawContext.moveTo(lastDrawPoint.x,lastDrawPoint.y);
  drawContext.lineTo(p.x,p.y);
  drawContext.stroke();
  lastDrawPoint=p;
}
function stopDrawing(){drawing=false;lastDrawPoint=null}
function clearDrawing(){
  if(!drawContext)return;
  const c=$("drawCanvas");
  drawContext.clearRect(0,0,c.width,c.height);
}
function openDrawing(){
  $("drawModal").classList.remove("hidden");
  requestAnimationFrame(()=>{
    const c=$("drawCanvas");
    c.width=0;c.height=0;
    drawContext=null;
    resizeCanvas();
  });
}
function insertDrawing(){
  const canvas=$("drawCanvas");
  const img=document.createElement("img");
  img.src=canvas.toDataURL("image/png");
  img.alt="Drawing";
  restoreSelection();
  $("noteBody").appendChild(img);
  $("drawModal").classList.add("hidden");
  pushUndoState();
  saveCurrentEditor(false);
  showToast("Drawing added to note");
}
function handleEditorInput(){
  autoResizeTitle();
  pushUndoState();
  saveCurrentEditor(false);
}

/* Boot */
loadNotes();
saveCategories();
