
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>NOTE PAL</title>
<style>
:root{
  --bg:#f3f4f6;--surface:#fff;--text:#111827;--muted:#6b7280;
  --primary:#2563eb;--border:#e5e7eb;--danger:#dc2626;
  --highlight:#fde68a;--shadow:0 4px 16px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding-bottom:24px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app-header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:20px;letter-spacing:.3px;flex:1}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text);flex-shrink:0}
.search-wrap{padding:12px 14px 4px}
.search-input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text)}
.category-row{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 12px;scrollbar-width:none;align-items:center;touch-action:pan-y}
.category-row::-webkit-scrollbar{display:none}
.category-tab{white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:20px;font-size:13px;flex-shrink:0;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.category-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.category-tab.dragging,.drawer-category.dragging{opacity:.45;border:2px dashed var(--primary)}
.category-tab.drag-target,.drawer-category.drag-target{outline:2px solid var(--primary);outline-offset:2px}
.add-category{border:1px dashed #9ca3af;background:transparent;color:var(--muted);border-radius:20px;padding:8px 12px;white-space:nowrap;flex-shrink:0}
.main{padding:8px 14px 90px;max-width:900px;margin:auto}
.note-list{display:flex;flex-direction:column;gap:10px}
.note-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.025)}
.note-card-head{display:flex;align-items:flex-start;gap:8px}
.note-card-title{font-weight:750;font-size:17px;line-height:1.35;flex:1;overflow-wrap:anywhere}
.note-card-meta{font-size:11px;color:var(--muted);margin-top:5px}
.note-card-body{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;max-height:130px;overflow:hidden}
.note-card-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.small-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 10px;font-size:12px}
.small-btn.danger{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:44px 18px;line-height:1.6}
.fab{position:fixed;bottom:20px;right:18px;z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:var(--primary);color:white;font-size:31px;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.55);display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-backdrop.show{display:flex}
.modal{background:var(--surface);color:var(--text);width:100%;max-width:760px;max-height:94dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px 26px;box-shadow:var(--shadow)}
.modal-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-title{font-size:19px;font-weight:800;flex:1}
.close-btn{border:0;background:transparent;font-size:27px;color:var(--muted);width:36px;height:36px}
.field-label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.field{width:100%;border:1px solid var(--border);border-radius:11px;padding:12px;background:var(--surface);color:var(--text);font-size:16px}
textarea.field{resize:vertical;min-height:180px;line-height:1.6}
.editor-tools{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.tool-btn{border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:8px 10px;font-size:13px}
.color-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-chip{width:29px;height:29px;border-radius:50%;border:2px solid rgba(0,0,0,.12);padding:0}
.color-picker{width:36px;height:34px;border:0;background:transparent;padding:0}
.modal-actions{display:flex;gap:9px;margin-top:18px}
.btn{flex:1;border:0;border-radius:11px;padding:13px 12px;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#e5e7eb;color:#111827}
.btn-danger{background:#fee2e2;color:#991b1b}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.drawer-backdrop.show{display:block}
.drawer{position:fixed;z-index:41;top:0;bottom:0;left:0;width:min(88vw,360px);background:var(--surface);padding:18px 14px 30px;overflow-y:auto;transform:translateX(-105%);transition:transform .22s ease}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;margin-bottom:16px;gap:10px}
.drawer-head strong{font-size:20px;flex:1}
.drawer-section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;margin:18px 4px 9px}
.drawer-item{width:100%;text-align:left;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--text);padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.drawer-item:active{background:var(--bg)}
.drawer-category{width:100%;text-align:left;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text);padding:11px 10px;display:flex;align-items:center;gap:10px;margin-bottom:7px;user-select:none;-webkit-user-select:none}
.drawer-category.active{border-color:var(--primary);background:#eff6ff}
.drawer-category .drag-handle{touch-action:none;cursor:grab;flex-shrink:0;color:#9ca3af;font-size:21px;line-height:1;padding:3px 4px;user-select:none;-webkit-user-select:none}
.drawer-category .category-name{flex:1;overflow-wrap:anywhere}
.drawer-category .category-count{font-size:11px;color:var(--muted)}
.drawer-category .category-menu{color:var(--muted);font-size:16px}
.drawer-footer{font-size:11px;color:var(--muted);padding:18px 5px}
.read-mode{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}
.read-mode.show{display:flex}
.read-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.read-title{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.read-content{flex:1;overflow-y:auto;padding:24px 20px 50px;max-width:850px;width:100%;margin:0 auto;font-size:20px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.read-content .word-highlight{background:var(--highlight);border-radius:3px}
.read-content .word-color{border-radius:3px}
.read-controls{display:flex;gap:7px;overflow-x:auto;padding:10px 12px;background:var(--surface);border-top:1px solid var(--border)}
.read-controls button{white-space:nowrap}
.wordVibrate{display:inline-block;animation:wordVibrate .16s linear infinite}
@keyframes wordVibrate{0%,100%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
@media(prefers-reduced-motion:reduce){.wordVibrate{animation:none}}
.confirm-text{line-height:1.6;font-size:14px;color:var(--muted)}
@media(min-width:700px){
 .modal-backdrop{align-items:center;padding:20px}
 .modal{border-radius:20px;max-height:90dvh}
 .main{padding-top:12px}
}
</style>
</head>
<body>

<header class="app-header">
  <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
  <div class="brand">NOTE PAL</div>
  <button class="icon-btn" id="searchToggle" aria-label="Search notes">⌕</button>
</header>

<div class="search-wrap" id="searchWrap" hidden>
  <input class="search-input" id="searchInput" placeholder="Search notes..." autocomplete="off">
</div>

<div class="category-row" id="categoryRow"></div>

<main class="main">
  <div class="note-list" id="noteList"></div>
  <div class="empty" id="emptyState" hidden>
    <div style="font-size:38px;margin-bottom:8px">📝</div>
    <strong>No notes yet</strong>
    <div>Tap the + button to create your first note.</div>
  </div>
</main>

<button class="fab" id="addNoteBtn" aria-label="Add note">+</button>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <strong>NOTE PAL</strong>
    <button class="close-btn" id="closeDrawer" aria-label="Close menu">×</button>
  </div>
  <button class="drawer-item" id="drawerAddNote">✚ <span>New Note</span></button>
  <button class="drawer-item" id="drawerReadLast">📖 <span>Read Mode</span></button>
  <div class="drawer-section-title">Categories · Drag ⠿ to reorder</div>
  <div id="drawerCategoryList"></div>
  <button class="drawer-item" id="drawerAddCategory">＋ <span>Add Category</span></button>
  <div class="drawer-section-title">Tools</div>
  <button class="drawer-item" id="drawerExport">↗ <span>Export Notes</span></button>
  <button class="drawer-item" id="drawerImport">↙ <span>Import Notes</span></button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div class="drawer-footer">Your notes are saved on this device.</div>
</aside>

<div class="modal-backdrop" id="editorBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editorHeading">
    <div class="modal-top">
      <div class="modal-title" id="editorHeading">New Note</div>
      <button class="close-btn" id="closeEditor" aria-label="Close editor">×</button>
    </div>
    <label class="field-label" for="noteTitle">Title</label>
    <input class="field" id="noteTitle" maxlength="180" placeholder="Note title">
    <label class="field-label" for="noteCategory">Category</label>
    <select class="field" id="noteCategory"></select>
    <label class="field-label" for="noteBody">Note</label>
    <div class="editor-tools">
      <button class="tool-btn" id="boldBtn"><b>B</b></button>
      <button class="tool-btn" id="italicBtn"><i>I</i></button>
      <button class="tool-btn" id="underlineBtn"><u>U</u></button>
      <button class="tool-btn" id="highlightBtn">🖍 Highlight</button>
      <button class="tool-btn" id="clearFormatBtn">Clear format</button>
    </div>
    <textarea class="field" id="noteBody" placeholder="Write your note here..."></textarea>
    <label class="field-label">Text color</label>
    <div class="color-tools">
      <button class="color-chip" style="background:#111827" data-editor-color="#111827" aria-label="Black"></button>
      <button class="color-chip" style="background:#dc2626" data-editor-color="#dc2626" aria-label="Red"></button>
      <button class="color-chip" style="background:#2563eb" data-editor-color="#2563eb" aria-label="Blue"></button>
      <button class="color-chip" style="background:#15803d" data-editor-color="#15803d" aria-label="Green"></button>
      <button class="color-chip" style="background:#9333ea" data-editor-color="#9333ea" aria-label="Purple"></button>
      <input class="color-picker" type="color" id="customEditorColor" value="#111827" aria-label="Choose text color">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelEditor">Cancel</button>
      <button class="btn btn-primary" id="saveNoteBtn">Save Note</button>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="categoryBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="categoryHeading">
    <div class="modal-top">
      <div class="modal-title" id="categoryHeading">Add Category</div>
      <button class="close-btn" id="closeCategory" aria-label="Close">×</button>
    </div>
    <label class="field-label" for="categoryNameInput">Category name</label>
    <input class="field" id="categoryNameInput" maxlength="50" placeholder="Enter category name">
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelCategory">Cancel</button>
      <button class="btn btn-primary" id="saveCategoryBtn">Save Category</button>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="confirmBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmHeading">
    <div class="modal-top">
      <div class="modal-title" id="confirmHeading">Confirm</div>
      <button class="close-btn" id="closeConfirm" aria-label="Close">×</button>
    </div>
    <div class="confirm-text" id="confirmMessage"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
      <button class="btn btn-danger" id="confirmOkay">Confirm</button>
    </div>
  </section>
</div>

<div class="read-mode" id="readMode">
  <div class="read-header">
    <button class="icon-btn" id="closeRead" aria-label="Close read mode">←</button>
    <div class="read-title" id="readTitle">Read Mode</div>
    <button class="icon-btn" id="readPrev" aria-label="Previous note">‹</button>
    <button class="icon-btn" id="readNext" aria-label="Next note">›</button>
  </div>
  <div class="read-content" id="readContent"></div>
  <div class="read-controls">
    <button class="tool-btn" id="readHighlightBtn">🖍 Highlight</button>
    <button class="tool-btn" id="readColorBtn">🎨 Word color</button>
    <input type="color" id="readColorPicker" value="#2563eb" aria-label="Choose word color" style="width:36px;min-width:36px;height:34px;border:0;background:transparent;padding:0">
    <button class="tool-btn" id="vibrateBtn">〰 Vibration</button>
    <button class="tool-btn" id="readEditBtn">✎ Edit</button>
  </div>
</div>

<script>
"use strict";

const NOTES_KEY = "notepal_notes_v2";
const CATEGORIES_KEY = "notepal_categories_v2";

const DEFAULT_CATEGORIES = ["All Notes","Personal","Study","Work","Ideas"];

let notes = [];
let categories = [...DEFAULT_CATEGORIES];
let activeCategory = "All Notes";
let editingId = null;
let editorMode = "new";
let searchTerm = "";
let currentReadNotes = [];
let currentReadIndex = 0;
let readVibrationOn = false;
let readHighlightOn = false;
let readColorOn = false;
let lastReadNoteId = null;
let confirmCallback = null;
let suppressCategoryClick = false;
let dragInfo = null;
let dragFinishTimer = null;

const $ = id => document.getElementById(id);

function makeId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}

function loadData(){
  try{
    const storedNotes = localStorage.getItem(NOTES_KEY);
    const storedCategories = localStorage.getItem(CATEGORIES_KEY);
    if(storedNotes){
      const parsed = JSON.parse(storedNotes);
      if(Array.isArray(parsed)) notes = parsed;
    }
    if(storedCategories){
      const parsed = JSON.parse(storedCategories);
      if(Array.isArray(parsed)){
        categories = parsed.filter(c => typeof c === "string" && c.trim());
      }
    }
  }catch(err){
    console.error("Could not load NOTE PAL data:",err);
  }

  if(!categories.includes("All Notes")) categories.unshift("All Notes");
  categories = categories.filter((c,i,a) => a.indexOf(c) === i);
  categories = ["All Notes",...categories.filter(c => c !== "All Notes")];

  notes = notes.map(n => ({
    id:n.id || makeId(),
    title:typeof n.title === "string" ? n.title : "",
    body:typeof n.body === "string" ? n.body : "",
    category:categories.includes(n.category) ? n.category : (n.category || "Personal"),
    createdAt:n.createdAt || Date.now(),
    updatedAt:n.updatedAt || n.createdAt || Date.now()
  }));

  notes.forEach(n => {
    if(n.category !== "All Notes" && !categories.includes(n.category)){
      categories.push(n.category);
    }
  });

  persist();
}

function persist(){
  try{
    localStorage.setItem(NOTES_KEY,JSON.stringify(notes));
    localStorage.setItem(CATEGORIES_KEY,JSON.stringify(categories));
  }catch(err){
    alert("Pal, hindi ma-save ang data. Baka puno na ang storage ng browser.");
    console.error(err);
  }
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function formatDate(timestamp){
  try{
    return new Date(timestamp).toLocaleString([],{
      month:"short",day:"numeric",year:"numeric",
      hour:"numeric",minute:"2-digit"
    });
  }catch(e){
    return "";
  }
}

function getFilteredNotes(){
  return notes.filter(note => {
    const categoryMatch = activeCategory === "All Notes" || note.category === activeCategory;
    const haystack = `${note.title} ${note.body} ${note.category}`.toLowerCase();
    const searchMatch = !searchTerm || haystack.includes(searchTerm.toLowerCase());
    return categoryMatch && searchMatch;
  }).sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
}

function renderCategories(){
  const row = $("categoryRow");
  row.innerHTML = "";

  const ordered = ["All Notes",...categories.filter(c => c !== "All Notes")];

  ordered.forEach(category => {
    const button = document.createElement("button");
    button.className = "category-tab" + (activeCategory === category ? " active" : "");
    button.type = "button";
    button.dataset.category = category;
    button.textContent = category;
    button.setAttribute("aria-label",category === "All Notes" ? "All Notes" : `Drag to reorder ${category}`);

    button.addEventListener("click",() => {
      if(suppressCategoryClick){
        suppressCategoryClick = false;
        return;
      }
      activeCategory = category;
      renderCategories();
      renderNotes();
    });

    if(category !== "All Notes") attachCategoryDrag(button,"tabs");
    row.appendChild(button);
  });

  const add = document.createElement("button");
  add.className = "add-category";
  add.type = "button";
  add.textContent = "+ Category";
  add.addEventListener("click",openCategoryModal);
  row.appendChild(add);

  renderDrawerCategories();
  updateCategorySelect();
}

function renderDrawerCategories(){
  const list = $("drawerCategoryList");
  list.innerHTML = "";

  const ordered = ["All Notes",...categories.filter(c => c !== "All Notes")];

  ordered.forEach(category => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "drawer-category" + (activeCategory === category ? " active" : "");
    button.dataset.category = category;

    const handle = document.createElement("span");
    handle.className = "drag-handle";
    handle.textContent = category === "All Notes" ? "•" : "⠿";
    handle.setAttribute("aria-label","Drag to reorder");
    if(category === "All Notes"){
      handle.style.visibility = "hidden";
    }

    const name = document.createElement("span");
    name.className = "category-name";
    name.textContent = category;

    const count = document.createElement("span");
    count.className = "category-count";
    count.textContent = category === "All Notes"
      ? notes.length
      : notes.filter(n => n.category === category).length;

    button.append(handle,name,count);

    button.addEventListener("click",() => {
      if(suppressCategoryClick){
        suppressCategoryClick = false;
        return;
      }
      activeCategory = category;
      renderCategories();
      renderNotes();
      closeDrawer();
    });

    if(category !== "All Notes") attachCategoryDrag(button,"drawer");
    list.appendChild(button);
  });
}

/*
  Shared category drag system.
  Tabs: horizontal drag.
  Drawer: vertical drag using the ⠿ handle.
  The All Notes category is deliberately not draggable.
*/
function attachCategoryDrag(button,surface){
  const isTabs = surface === "tabs";
  const container = isTabs ? $("categoryRow") : $("drawerCategoryList");
  const selector = isTabs ? ".category-tab[data-category]" : ".drawer-category[data-category]";
  const axis = isTabs ? "x" : "y";

  button.addEventListener("pointerdown",event => {
    if(event.pointerType === "mouse" && event.button !== 0) return;

    if(!isTabs){
      const handle = event.target.closest(".drag-handle");
      if(!handle || button.dataset.category === "All Notes") return;
    }

    if(button.dataset.category === "All Notes") return;

    dragInfo = {
      button,
      container,
      selector,
      axis,
      pointerId:event.pointerId,
      startX:event.clientX,
      startY:event.clientY,
      moved:false,
      surface,
      lastTarget:null
    };

    try{
      button.setPointerCapture(event.pointerId);
    }catch(e){}
  });

  button.addEventListener("pointermove",event => {
    if(!dragInfo || dragInfo.button !== button || dragInfo.pointerId !== event.pointerId) return;

    const dx = event.clientX - dragInfo.startX;
    const dy = event.clientY - dragInfo.startY;
    const primary = axis === "x" ? dx : dy;
    const secondary = axis === "x" ? dy : dx;

    if(!dragInfo.moved){
      if(Math.abs(primary) < 8) return;
      if(Math.abs(primary) < Math.abs(secondary)) return;
      dragInfo.moved = true;
      button.classList.add("dragging");
    }

    if(event.cancelable) event.preventDefault();

    const target = document.elementFromPoint(event.clientX,event.clientY);
    const targetButton = target ? target.closest(selector) : null;

    if(!targetButton || targetButton === button || targetButton.dataset.category === "All Notes") return;
    if(targetButton.parentElement !== container) return;

    container.querySelectorAll(".drag-target").forEach(el => el.classList.remove("drag-target"));
    targetButton.classList.add("drag-target");
    dragInfo.lastTarget = targetButton;

    const rect = targetButton.getBoundingClientRect();
    const before = axis === "x"
      ? event.clientX < rect.left + rect.width / 2
      : event.clientY < rect.top + rect.height / 2;

    if(before){
      if(button.nextElementSibling !== targetButton){
        container.insertBefore(button,targetButton);
      }
    }else{
      if(targetButton.nextElementSibling !== button){
        container.insertBefore(button,targetButton.nextElementSibling);
      }
    }
  });

  const finish = event => {
    if(!dragInfo || dragInfo.button !== button || dragInfo.pointerId !== event.pointerId) return;

    const moved = dragInfo.moved;

    button.classList.remove("dragging");
    container.querySelectorAll(".drag-target").forEach(el => el.classList.remove("drag-target"));

    if(moved){
      const reordered = Array.from(container.querySelectorAll(selector))
        .map(el => el.dataset.category)
        .filter(category => category && category !== "All Notes");

      const remaining = categories.filter(category => category !== "All Notes" && !reordered.includes(category));
      categories = ["All Notes",...reordered,...remaining];

      persist();
      suppressCategoryClick = true;

      renderCategories();
      renderNotes();

      clearTimeout(dragFinishTimer);
      dragFinishTimer = setTimeout(() => {
        suppressCategoryClick = false;
      },350);
    }

    dragInfo = null;
  };

  button.addEventListener("pointerup",finish);
  button.addEventListener("pointercancel",finish);
  button.addEventListener("lostpointercapture",event => {
    if(dragInfo && dragInfo.button === button && dragInfo.pointerId === event.pointerId){
      finish(event);
    }
  });
}

function renderNotes(){
  const list = $("noteList");
  const empty = $("emptyState");
  const filtered = getFilteredNotes();
  list.innerHTML = "";

  if(!filtered.length){
    empty.hidden = false;
    empty.innerHTML = `
      <div style="font-size:38px;margin-bottom:8px">📝</div>
      <strong>${searchTerm ? "No matching notes" : "No notes yet"}</strong>
      <div>${searchTerm ? "Try a different search." : "Tap the + button to create your first note."}</div>`;
    return;
  }

  empty.hidden = true;

  filtered.forEach(note => {
    const card = document.createElement("article");
    card.className = "note-card";

    const head = document.createElement("div");
    head.className = "note-card-head";

    const title = document.createElement("div");
    title.className = "note-card-title";
    title.textContent = note.title || "Untitled Note";

    const edit = document.createElement("button");
    edit.className = "icon-btn";
    edit.type = "button";
    edit.style.width = "35px";
    edit.style.height = "35px";
    edit.textContent = "✎";
    edit.setAttribute("aria-label","Edit note");
    edit.addEventListener("click",() => openEditor(note.id));

    head.append(title,edit);

    const meta = document.createElement("div");
    meta.className = "note-card-meta";
    meta.textContent = `${note.category} · Updated ${formatDate(note.updatedAt)}`;

    const body = document.createElement("div");
    body.className = "note-card-body";
    body.textContent = note.body;

    const actions = document.createElement("div");
    actions.className = "note-card-actions";

    const read = document.createElement("button");
    read.className = "small-btn";
    read.textContent = "📖 Read";
    read.addEventListener("click",() => openReadMode(note.id));

    const editBtn = document.createElement("button");
    editBtn.className = "small-btn";
    editBtn.textContent = "✎ Edit";
    editBtn.addEventListener("click",() => openEditor(note.id));

    const del = document.createElement("button");
    del.className = "small-btn danger";
    del.textContent = "Delete";
    del.addEventListener("click",() => confirmAction(
      "Delete note?",
      `Delete “${note.title || "Untitled Note"}”? This cannot be undone.`,
      () => {
        notes = notes.filter(n => n.id !== note.id);
        persist();
        renderNotes();
        renderCategories();
      },
      "Delete"
    ));

    actions.append(read,editBtn,del);
    card.append(head,meta,body,actions);
    list.appendChild(card);
  });
}

function updateCategorySelect(){
  const select = $("noteCategory");
  const previous = select.value;
  select.innerHTML = "";

  categories.filter(c => c !== "All Notes").forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    select.appendChild(option);
  });

  if(previous && categories.includes(previous) && previous !== "All Notes"){
    select.value = previous;
  }else if(activeCategory !== "All Notes" && categories.includes(activeCategory)){
    select.value = activeCategory;
  }else if(categories.includes("Personal")){
    select.value = "Personal";
  }
}

function showModal(id){
  $(id).classList.add("show");
}

function hideModal(id){
  $(id).classList.remove("show");
}

function openEditor(id=null){
  editingId = id;
  editorMode = id ? "edit" : "new";

  const note = id ? notes.find(n => n.id === id) : null;
  $("editorHeading").textContent = note ? "Edit Note" : "New Note";
  $("noteTitle").value = note?.title || "";
  $("noteBody").value = note?.body || "";

  updateCategorySelect();

  if(note && categories.includes(note.category)){
    $("noteCategory").value = note.category;
  }else if(activeCategory !== "All Notes" && categories.includes(activeCategory)){
    $("noteCategory").value = activeCategory;
  }

  $("saveNoteBtn").textContent = note ? "Save Changes" : "Save Note";
  showModal("editorBackdrop");
  setTimeout(() => $("noteTitle").focus(),100);
}

function closeEditor(){
  hideModal("editorBackdrop");
}

function saveNote(){
  const title = $("noteTitle").value.trim();
  const body = $("noteBody").value;
  const category = $("noteCategory").value || "Personal";

  if(!title && !body.trim()){
    alert("Pal, maglagay muna ng title o note content.");
    return;
  }

  const now = Date.now();

  if(editingId){
    const index = notes.findIndex(n => n.id === editingId);
    if(index >= 0){
      notes[index] = {
        ...notes[index],
        title,
        body,
        category,
        updatedAt:now
      };
    }
  }else{
    notes.push({
      id:makeId(),
      title,
      body,
      category,
      createdAt:now,
      updatedAt:now
    });
  }

  persist();
  closeEditor();
  renderCategories();
  renderNotes();
}

function openCategoryModal(){
  $("categoryNameInput").value = "";
  showModal("categoryBackdrop");
  setTimeout(() => $("categoryNameInput").focus(),100);
}

function saveCategory(){
  const name = $("categoryNameInput").value.trim();

  if(!name){
    alert("Pal, maglagay ng category name.");
    return;
  }
  if(name.toLowerCase() === "all notes"){
    alert("Reserved ang All Notes category.");
    return;
  }
  if(categories.some(c => c.toLowerCase() === name.toLowerCase())){
    alert("May category na kapangalan nito.");
    return;
  }

  categories.push(name);
  activeCategory = name;
  persist();
  hideModal("categoryBackdrop");
  renderCategories();
  renderNotes();
}

function openDrawer(){
  $("drawer").classList.add("show");
  $("drawerBackdrop").classList.add("show");
  renderDrawerCategories();
}

function closeDrawer(){
  $("drawer").classList.remove("show");
  $("drawerBackdrop").classList.remove("show");
}

function confirmAction(title,message,callback,okayLabel="Confirm"){
  $("confirmHeading").textContent = title;
  $("confirmMessage").textContent = message;
  $("confirmOkay").textContent = okayLabel;
  confirmCallback = callback;
  showModal("confirmBackdrop");
}

function closeConfirm(){
  hideModal("confirmBackdrop");
  confirmCallback = null;
}

function runConfirm(){
  const callback = confirmCallback;
  closeConfirm();
  if(callback) callback();
}

function openReadMode(id){
  currentReadNotes = getFilteredNotes();
  currentReadIndex = currentReadNotes.findIndex(n => n.id === id);

  if(currentReadIndex < 0){
    currentReadNotes = notes.slice().sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    currentReadIndex = currentReadNotes.findIndex(n => n.id === id);
  }

  if(currentReadIndex < 0) return;

  lastReadNoteId = id;
  readHighlightOn = false;
  readColorOn = false;
  readVibrationOn = false;
  renderReadNote();
  $("readMode").classList.add("show");
}

function closeReadMode(){
  $("readMode").classList.remove("show");
}

function renderReadNote(){
  const note = currentReadNotes[currentReadIndex];
  if(!note) return;

  $("readTitle").textContent = note.title || "Untitled Note";
  const content = $("readContent");
  content.textContent = note.body || "";

  $("readHighlightBtn").style.background = readHighlightOn ? "#fde68a" : "";
  $("readColorBtn").style.background = readColorOn ? "#dbeafe" : "";
  $("vibrateBtn").style.background = readVibrationOn ? "#dbeafe" : "";

  if(readVibrationOn){
    content.classList.add("wordVibrate");
  }else{
    content.classList.remove("wordVibrate");
  }
}

function changeReadNote(direction){
  if(!currentReadNotes.length) return;
  currentReadIndex = (currentReadIndex + direction + currentReadNotes.length) % currentReadNotes.length;
  readHighlightOn = false;
  readColorOn = false;
  readVibrationOn = false;
  renderReadNote();
}

function getSelectedTextNodeRange(container){
  const selection = window.getSelection();
  if(!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;

  const range = selection.getRangeAt(0);
  if(!container.contains(range.commonAncestorContainer)) return null;

  return range;
}

function wrapSelectedText(styleObject){
  const range = getSelectedTextNodeRange($("readContent"));
  if(!range){
    alert("Pal, piliin muna ang word o text na babaguhin.");
    return;
  }

  const span = document.createElement("span");
  Object.entries(styleObject).forEach(([key,value]) => {
    span.style[key] = value;
  });

  try{
    range.surroundContents(span);
  }catch(e){
    const selected = range.extractContents();
    span.appendChild(selected);
    range.insertNode(span);
  }

  window.getSelection()?.removeAllRanges();
}

function exportNotes(){
  const data = {
    app:"NOTE PAL",
    version:2,
    exportedAt:new Date().toISOString(),
    categories,
    notes
  };

  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `notepal-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  closeDrawer();
}

function importNotesFile(file){
  if(!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      const importedNotes = Array.isArray(data) ? data : data.notes;
      const importedCategories = Array.isArray(data.categories) ? data.categories : [];

      if(!Array.isArray(importedNotes)){
        throw new Error("Invalid file format");
      }

      confirmAction(
        "Import notes?",
        "Importing will merge the notes from this file with the notes currently on this device. Existing notes will be kept.",
        () => {
          importedCategories.forEach(category => {
            if(typeof category === "string" && category.trim() &&
              category !== "All Notes" &&
              !categories.some(c => c.toLowerCase() === category.toLowerCase())){
              categories.push(category);
            }
          });

          importedNotes.forEach(item => {
            if(!item || typeof item !== "object") return;

            let category = typeof item.category === "string" ? item.category : "Personal";
            if(category === "All Notes") category = "Personal";
            if(!categories.includes(category)) categories.push(category);

            const imported = {
              id:makeId(),
              title:String(item.title || ""),
              body:String(item.body || item.content || ""),
              category,
              createdAt:Number(item.createdAt) || Date.now(),
              updatedAt:Number(item.updatedAt) || Date.now()
            };

            notes.push(imported);
          });

          persist();
          renderCategories();
          renderNotes();
          closeDrawer();
          alert("Import complete, pal!");
        },
        "Import"
      );
    }catch(err){
      alert("Hindi mabasa ang file. Gumamit ng valid NOTE PAL JSON backup.");
      console.error(err);
    }
  };

  reader.readAsText(file);
}

$("menuBtn").addEventListener("click",openDrawer);
$("closeDrawer").addEventListener("click",closeDrawer);
$("drawerBackdrop").addEventListener("click",closeDrawer);

$("searchToggle").addEventListener("click",() => {
  $("searchWrap").hidden = !$("searchWrap").hidden;

  else{
    $("searchInput").value = "";
    searchTerm = "";
    renderNotes();
  }
});

$("searchInput").addEventListener("input",event => {
  searchTerm = event.target.value.trim();
  renderNotes();
});

$("addNoteBtn").addEventListener("click",() => openEditor());
$("drawerAddNote").addEventListener("click",() => {
  closeDrawer();
  openEditor();
});

$("drawerReadLast").addEventListener("click",() => {
  closeDrawer();
  const note = lastReadNoteId ? notes.find(n => n.id === lastReadNoteId) : getFilteredNotes()[0];
  if(note) openReadMode(note.id);

$("drawerAddCategory").addEventListener("click",() => {
  closeDrawer();
  openCategoryModal();
});

$("closeEditor").addEventListener("click",closeEditor);
$("cancelEditor").addEventListener("click",closeEditor);
$("saveNoteBtn").addEventListener("click",saveNote);

$("closeCategory").addEventListener("click",() => hideModal("categoryBackdrop"));
$("cancelCategory").addEventListener("click",() => hideModal("categoryBackdrop"));
$("saveCategoryBtn").addEventListener("click",saveCategory);
$("categoryNameInput").addEventListener("keydown",event => {
  if(event.key === "Enter") saveCategory();
});

$("closeConfirm").addEventListener("click",closeConfirm);
$("confirmCancel").addEventListener("click",closeConfirm);
$("confirmOkay").addEventListener("click",runConfirm);

$("drawerExport").addEventListener("click",exportNotes);
$("drawerImport").addEventListener("click",() => $("importFile").click());
$("importFile").addEventListener("change",event => {
  importNotesFile(event.target.files?.[0]);
  event.target.value = "";
});

$("closeRead").addEventListener("click",closeReadMode);
$("readPrev").addEventListener("click",() => changeReadNote(-1));
$("readNext").addEventListener("click",() => changeReadNote(1));

$("readHighlightBtn").addEventListener("click",() => {
  readHighlightOn = !readHighlightOn;
  readColorOn = false;
  $("readContent").style.userSelect = "text";
  $("readHighlightBtn").style.background = readHighlightOn ? "#fde68a" : "";
  if(readHighlightOn){
    wrapSelectedText({backgroundColor:"#fde68a"});
    readHighlightOn = false;
    $("readHighlightBtn").style.background = "";
  }
});

$("readColorBtn").addEventListener("click",() => {
  readColorOn = true;
  readHighlightOn = false;
  $("readColorPicker").click();
});

$("readColorPicker").addEventListener("input",event => {
  if(readColorOn){
    wrapSelectedText({color:event.target.value});
    readColorOn = false;
  }
});

$("vibrateBtn").addEventListener("click",() => {
  readVibrationOn = !readVibrationOn;
  $("readContent").classList.toggle("wordVibrate",readVibrationOn);
  $("vibrateBtn").style.background = readVibrationOn ? "#dbeafe" : "";
});

$("readEditBtn").addEventListener("click",() => {
  const note = currentReadNotes[currentReadIndex];
  if(!note) return;
  closeReadMode();
  openEditor(note.id);
});

$("boldBtn").addEventListener("click",() => {
  const field = $("noteBody");
  const start = field.selectionStart;
  const end = field.selectionEnd;
  if(start === end) return alert("Pal, piliin muna ang text.");
  const selected = field.value.slice(start,end);
  field.setRangeText(`**${selected}**`,start,end,"select");
  field.focus();
});

$("italicBtn").addEventListener("click",() => {
  const field = $("noteBody");
  const start = field.selectionStart;
  const end = field.selectionEnd;
  if(start === end) return alert("Pal, piliin muna ang text.");
  const selected = field.value.slice(start,end);
  field.setRangeText(`_${selected}_`,start,end,"select");
  field.focus();
});

$("underlineBtn").addEventListener("click",() => {
  const field = $("noteBody");
  const start = field.selectionStart;
  const end = field.selectionEnd;
  if(start === end) return alert("Pal, piliin muna ang text.");
  const selected = field.value.slice(start,end);
  field.setRangeText(`<u>${selected}</u>`,start,end,"select");
  field.focus();
});

$("highlightBtn").addEventListener("click",() => {
  const field = $("noteBody");
  const start = field.selectionStart;
  const end = field.selectionEnd;
  if(start === end) return alert("Pal, piliin muna ang text.");
  const selected = field.value.slice(start,end);
  field.setRangeText(`<mark>${selected}</mark>`,start,end,"select");
  field.focus();
});

$("clearFormatBtn").addEventListener("click",() => {
  const field = $("noteBody");
  const start = field.selectionStart;
  const end = field.selectionEnd;
  if(start === end){
    field.value = field.value
      .replace(/\*\*(.*?)\*\*/g,"$1")
      .replace(/_(.*?)_/g,"$1")
      .replace(/<\/?u>/g,"")
      .replace(/<\/?mark>/g,"");
    return;
  }
  const selected = field.value.slice(start,end)
    .replace(/\*\*(.*?)\*\*/g,"$1")
    .replace(/_(.*?)_/g,"$1")
    .replace(/<\/?u>/g,"")
    .replace(/<\/?mark>/g,"");
  field.setRangeText(selected,start,end,"select");
  field.focus();
});

document.querySelectorAll("[data-editor-color]").forEach(button => {
  button.addEventListener("click",() => {
    const field = $("noteBody");
    const start = field.selectionStart;
    const end = field.selectionEnd;
    if(start === end) return alert("Pal, piliin muna ang text.");
    const color = button.dataset.editorColor;
    const selected = field.value.slice(start,end);
    field.setRangeText(`<span style="color:${color}">${selected}</span>`,start,end,"select");
    field.focus();
  });
});

$("customEditorColor").addEventListener("input",event => {
  const field = $("noteBody");
  const start = field.selectionStart;
  const end = field.selectionEnd;
  if(start === end) return;
  const selected = field.value.slice(start,end);
  field.setRangeText(`<span style="color:${event.target.value}">${selected}</span>`,start,end,"select");
  field.focus();
});

["editorBackdrop","categoryBackdrop","confirmBackdrop"].forEach(id => {
  $(id).addEventListener("click",event => {
    if(event.target !== $(id)) return;
    if(id === "editorBackdrop") closeEditor();
    if(id === "categoryBackdrop") hideModal(id);
    if(id === "confirmBackdrop") closeConfirm();
  });
});

document.addEventListener("keydown",event => {
  if(event.key === "Escape"){
    closeDrawer();
    closeEditor();
    hideModal("categoryBackdrop");
    closeConfirm();
    closeReadMode();
  }
});

loadData();
renderCategories();
renderNotes();
</script>
