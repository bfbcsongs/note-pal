<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>NOTE PAL</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#778196;--line:#e3e8f0;--accent:#2563eb;--accent2:#1d4ed8;--soft:#eaf1ff;--amber:#ffcf4a;--danger:#dc2626;--shadow:0 8px 28px #1720330c}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid #93b4ff;outline-offset:2px}.app{height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}.home-head{padding:18px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;font-size:25px;letter-spacing:-.7px}.brand span{color:var(--accent)}.subbrand{font-size:12px;color:var(--muted);margin-top:2px}.primary{background:var(--accent);color:white;border-radius:12px;padding:11px 15px;font-weight:750;box-shadow:0 4px 12px #2563eb24}.primary:active{background:var(--accent2)}.searchrow{display:flex;gap:8px;margin-top:15px}.search{flex:1;min-width:0;border:1px solid var(--line);background:#f8faff;border-radius:11px;padding:10px 12px}.filter{border:1px solid var(--line);background:#fff;border-radius:11px;padding:0 11px;color:var(--ink)}.chips{display:flex;gap:7px;overflow:auto;padding:11px 16px;scrollbar-width:none;background:var(--panel);border-bottom:1px solid var(--line)}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;color:#59657a;font-size:13px}.chip.active{background:var(--soft);color:var(--accent);border-color:#c9d9ff;font-weight:750}.home-main{padding:14px 13px 28px;overflow:auto;flex:1}.sectionline{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 12px}.sectionline h2{font-size:15px;margin:0}.smallmuted{font-size:12px;color:var(--muted)}.notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.note-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;min-height:135px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;overflow:hidden}.note-card:active{transform:scale(.99)}.note-card h3{font-size:15px;margin:0;padding-right:3px;line-height:1.3;overflow-wrap:anywhere}.note-preview{font-size:12px;color:#6c778a;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}.card-meta{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:auto;padding-top:5px}.tag{font-size:10px;background:#eef2f7;color:#5b6678;border-radius:6px;padding:4px 6px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date-mini{font-size:10px;color:#929bad}.pinmark{position:absolute;right:10px;top:10px;font-size:13px}.empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.screen{display:none;flex-direction:column;height:100%;min-height:0}.screen.active{display:flex}.editor-top{background:var(--panel);border-bottom:1px solid var(--line);padding:9px 12px;flex-shrink:0}.actionbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px}.actiongroup{display:flex;align-items:center;gap:4px}.iconbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;background:transparent;color:#344054;font-size:20px;flex-shrink:0}.iconbtn:active{background:#eef2f8}.iconbtn.save{background:var(--accent);color:white;font-size:22px}.iconbtn.save:active{background:var(--accent2)}.action-title{font-size:12px;color:var(--muted);font-weight:700;flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subheader{display:flex;gap:9px;align-items:center;padding:7px 0 1px}.timestamp{font-size:11px;color:var(--muted);white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.category-select{max-width:48%;min-width:115px;border:1px solid var(--line);border-radius:9px;background:#f8faff;padding:7px 9px;font-size:12px;color:#344054}.body-scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:17px 17px 25px;background:var(--panel)}.title-input{width:100%;border:0;outline:none!important;font-size:25px;line-height:1.25;font-weight:800;letter-spacing:-.5px;color:var(--ink);padding:0 0 16px;background:transparent}.title-input::placeholder{color:#b2bac8}.content-body{font-size:16px;line-height:1.75;min-height:calc(100% - 55px);outline:none;overflow-wrap:anywhere;word-break:break-word;white-space:normal}.content-body:empty:before{content:'Start writing your note…';color:#a6afbe;pointer-events:none}.content-body img{max-width:100%;height:auto;border-radius:9px}.content-body ul,.content-body ol{padding-left:25px}.content-body input[type=checkbox]{width:18px;height:18px;vertical-align:middle;margin-right:8px}.readmode .title-input{pointer-events:none}.readmode .content-body{user-select:text}.word{border-radius:4px;transition:background .15s,box-shadow .15s;cursor:pointer}.word.marked{background:#ffda70;box-shadow:0 0 0 2px #ffda70;color:#382900}.formatbar{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom));display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;box-shadow:0 -5px 18px #17203308}.formatbar::-webkit-scrollbar{display:none}.toolbtn{min-width:42px;height:42px;padding:0 10px;border-radius:10px;background:#f4f6fa;color:#354157;display:flex;align-items:center;justify-content:center;gap:5px;font-size:17px;white-space:nowrap;border:1px solid transparent}.toolbtn:active,.toolbtn.selected{background:var(--soft);border-color:#d4e1ff;color:var(--accent)}.toolbtn.texttool{font-size:13px;font-weight:800}.toolsep{width:1px;background:var(--line);margin:4px 1px;flex-shrink:0}.menu-wrap{position:relative}.menu{position:absolute;right:0;top:45px;width:205px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 15px 40px #11182725;padding:6px;z-index:20;display:none}.menu.open{display:block}.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;padding:11px 10px;border-radius:9px;color:#293449;font-size:13px}.menu button:active{background:#f1f5fb}.menu button.danger{color:var(--danger)}.menu .menuline{height:1px;background:var(--line);margin:4px}.read-status{font-size:11px;color:var(--muted);text-align:center;padding:4px 0 0}.modalback{display:none;position:fixed;inset:0;background:#11182775;z-index:50;align-items:center;justify-content:center;padding:16px}.modalback.open{display:flex}.modal{background:white;width:min(500px,100%);max-height:90dvh;overflow:auto;border-radius:18px;padding:17px;box-shadow:0 20px 60px #0003}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modalhead h3{font-size:17px;margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.secondary{background:#eef2f7;color:#334155;border-radius:10px;padding:10px 13px;font-weight:650}.dangerbtn{background:#fee2e2;color:#b91c1c;border-radius:10px;padding:10px 13px;font-weight:700}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;margin:5px 0 10px}.drawing-canvas{width:100%;height:270px;border:1px solid #d7deea;border-radius:10px;touch-action:none;background:white;display:block}.drawtools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.drawtools input[type=color]{height:35px;width:44px;border:0;background:transparent}.attachment{display:inline-flex;align-items:center;gap:7px;padding:9px 10px;background:#f2f5fb;border:1px solid var(--line);border-radius:9px;margin:5px 5px 5px 0;font-size:13px}.attachment a{color:var(--accent);text-decoration:none}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:10px 15px;border-radius:99px;font-size:12px;z-index:90;box-shadow:0 8px 25px #0002;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}.toast.show{opacity:1}.hidden{display:none!important}@media(min-width:650px){.home-main{padding:18px 18px 30px}.notes-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.body-scroll{padding:25px 32px}.editor-top{padding-left:20px;padding-right:20px}.formatbar{justify-content:center}.title-input{font-size:29px}}@media(max-width:360px){.brand{font-size:22px}.primary{padding:10px 12px}.notes-grid{gap:8px}.note-card{padding:10px}.iconbtn{width:36px;height:38px}.category-select{min-width:100px}.toolbtn{min-width:39px}}
</style></head>
<body><div class="app">
<section id="homeScreen" class="screen active">
<header class="home-head"><div class="brandrow"><div><div class="brand">NOTE <span>PAL</span></div><div class="subbrand">Your thoughts, always within reach.</div></div><button class="primary" id="addNoteBtn">＋ New note</button></div><div class="searchrow"><input id="searchInput" class="search" placeholder="Search notes…" aria-label="Search notes"><button id="sortBtn" class="filter" title="Sort notes">↕ Recent</button></div></header>
<nav id="categoryChips" class="chips"></nav><main class="home-main"><div class="sectionline"><h2 id="listHeading">All notes</h2><span id="noteCount" class="smallmuted">0 notes</span></div><div id="notesGrid" class="notes-grid"></div></main>
</section>
<section id="editorScreen" class="screen">
<header class="editor-top"><div class="actionbar"><div class="actiongroup"><button id="saveBtn" class="iconbtn save" title="Save note" aria-label="Save note">✓</button></div><div id="actionTitle" class="action-title">New note</div><div class="actiongroup"><button id="undoBtn" class="iconbtn edit-only" title="Undo" aria-label="Undo">↶</button><button id="redoBtn" class="iconbtn edit-only" title="Redo" aria-label="Redo">↷</button><div class="menu-wrap"><button id="menuBtn" class="iconbtn" title="More actions" aria-label="More actions">⋮</button><div id="actionMenu" class="menu"><button id="menuEdit">✎ <span>Edit mode</span></button><button id="menuRead">◉ <span>Read mode</span></button><button id="menuShare">↗ <span>Share note</span></button><button id="menuFavorite">☆ <span>Add to favorites</span></button><div class="menuline"></div><button id="menuDelete" class="danger">⌫ <span>Delete note</span></button></div></div></div></div>
<div class="subheader"><div id="timestamp" class="timestamp">New note · Not saved yet</div><select id="noteCategory" class="category-select" aria-label="Note category"></select></div></header>
<div id="editorScroll" class="body-scroll"><input id="noteTitle" class="title-input" placeholder="Untitled note" maxlength="180" aria-label="Note title"><div id="noteBody" class="content-body" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true"></div><div id="readStatus" class="read-status">Tap any word to highlight it.</div></div>
<footer id="formatBar" class="formatbar"><button class="toolbtn texttool" data-cmd="bold" title="Bold"><b>B</b></button><button class="toolbtn texttool" data-cmd="italic" title="Italic"><i>I</i></button><button class="toolbtn texttool" data-cmd="underline" title="Underline"><u>U</u></button><button class="toolbtn texttool" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button><div class="toolsep"></div><button id="fontColorBtn" class="toolbtn" title="Text color">A<span style="font-size:10px;color:#e34b4b">▰</span></button><input id="fontColor" type="color" class="hidden" value="#172033" aria-label="Text color"><button id="highlightBtn" class="toolbtn" title="Word highlighter">🖍</button><button id="clearFormatBtn" class="toolbtn" title="Clear formatting">Tx</button><div class="toolsep"></div><button id="checklistBtn" class="toolbtn" title="Checklist">☑</button><button id="attachBtn" class="toolbtn" title="Attach file">📎</button><button id="drawBtn" class="toolbtn" title="Draw">✎</button><button id="fontSizeBtn" class="toolbtn" title="Text size">A↕</button><button id="undoBarBtn" class="toolbtn" title="Undo">↶</button><button id="redoBarBtn" class="toolbtn" title="Redo">↷</button></footer>
<input type="file" id="filePicker" class="hidden" multiple accept="image/*,.pdf,.txt,.doc,.docx,.xlsx,.ppt,.pptx,.mp3,.m4a,.wav,.mp4">
</section></div>
<div id="drawModal" class="modalback"><div class="modal"><div class="modalhead"><h3>Draw on your note</h3><button id="closeDraw" class="iconbtn" aria-label="Close drawing">×</button></div><div class="drawtools"><label>Pen <input id="penColor" type="color" value="#172033"></label><label>Size <input id="penSize" type="range" min="1" max="18" value="4"></label><button id="eraseCanvas" class="secondary">Clear drawing</button></div><canvas id="drawingCanvas" class="drawing-canvas" width="900" height="540"></canvas><div class="modalfoot"><button id="cancelDraw" class="secondary">Cancel</button><button id="insertDrawing" class="primary">Insert drawing</button></div></div></div>
<div id="confirmModal" class="modalback"><div class="modal"><div class="modalhead"><h3 id="confirmTitle">Delete note?</h3><button id="closeConfirm" class="iconbtn">×</button></div><p id="confirmText" style="color:#667085;font-size:14px;line-height:1.5">This action cannot be undone.</p><div class="modalfoot"><button id="cancelConfirm" class="secondary">Cancel</button><button id="acceptConfirm" class="dangerbtn">Delete</button></div></div></div>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEYS={notes:'notepal_notes_v1',cats:'notepal_categories_v1'};
const DEFAULT_CATS=['General','Sermon','Bible Study','Devotion','Ministry','Personal'];
let notes=readStore(KEYS.notes,[]),categories=readStore(KEYS.cats,DEFAULT_CATS),activeId=null,mode='edit',sortNewest=true,filterCategory='All',searchTerm='',saveTimer=null,confirmAction=null,rangeBookmark=null,drawCtx=null,drawing=false,lastPoint=null;
const $=id=>document.getElementById(id);
function readStore(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch(e){return fallback}}
function persist(){try{localStorage.setItem(KEYS.notes,JSON.stringify(notes));localStorage.setItem(KEYS.cats,JSON.stringify(categories))}catch(e){toast('Storage is full. Consider removing large attachments.')}}
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function plainText(html=''){const d=document.createElement('div');d.innerHTML=html;return (d.innerText||d.textContent||'').replace(/\u00a0/g,' ')}
function fmtDate(v){if(!v)return 'Not saved yet';const d=new Date(v);if(isNaN(d))return '';return d.toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function currentNote(){return notes.find(n=>n.id===activeId)||null}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2100)}
function showScreen(which){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(which+'Screen').classList.add('active');if(which==='home')renderHome();}
function renderCategories(){const nav=$('categoryChips');nav.innerHTML='';const names=['All',...categories,'★ Favorites'];names.forEach(name=>{const b=document.createElement('button');b.className='chip'+(filterCategory===name?' active':'');b.textContent=name;b.onclick=()=>{filterCategory=name;renderCategories();renderHome()};nav.appendChild(b)});const select=$('noteCategory');const prev=select.value;select.innerHTML='';categories.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;select.appendChild(o)});const add=document.createElement('option');add.value='__add__';add.textContent='＋ Add category…';select.appendChild(add);if(categories.includes(prev))select.value=prev}
function renderHome(){renderCategories();const grid=$('notesGrid');grid.innerHTML='';let list=notes.filter(n=>{const hay=(n.title+' '+plainText(n.content)+' '+n.category).toLowerCase();const matchSearch=hay.includes(searchTerm.toLowerCase());const matchCat=filterCategory==='All'||(filterCategory==='★ Favorites'?!!n.favorite:n.category===filterCategory);return matchSearch&&matchCat});list.sort((a,b)=>{if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;const x=new Date(a.updatedAt||a.createdAt||0).getTime(),y=new Date(b.updatedAt||b.createdAt||0).getTime();return (sortNewest?y-x:x-y)});$('listHeading').textContent=filterCategory==='All'?'All notes':filterCategory;$('noteCount').textContent=`${list.length} ${list.length===1?'note':'notes'}`;if(!list.length){grid.innerHTML='<div class="empty"><strong>'+(searchTerm?'No matching notes':'Nothing here yet')+'</strong>'+(searchTerm?'Try a different search.':'Tap “New note” to capture an idea.')+'</div>';return}list.forEach(n=>{const card=document.createElement('button');card.className='note-card';card.type='button';const title=n.title?.trim()||'Untitled note';const text=plainText(n.content||'').trim()||'No additional text';card.innerHTML=`${n.pinned?'<span class="pinmark" title="Pinned">📌</span>':''}<h3>${escapeHTML(title)}</h3><div class="note-preview">${escapeHTML(text)}</div><div class="card-meta"><span class="tag">${escapeHTML(n.category||'General')}${n.favorite?' · ★':''}</span><span class="date-mini">${escapeHTML(fmtDate(n.updatedAt||n.createdAt).split(',')[0]||'')}</span></div>`;card.onclick=()=>openNote(n.id);card.oncontextmenu=e=>{e.preventDefault();activeId=n.id;openActionMenu()};grid.appendChild(card)})}
function createNote(){const now=new Date().toISOString();const n={id:uid(),title:'',category:categories[0]||'General',content:'',favorite:false,pinned:false,createdAt:now,updatedAt:now};notes.unshift(n);activeId=n.id;persist();fillEditor(n);setMode('edit');showScreen('editor');$('noteTitle').focus();history.pushState({screen:'editor',id:activeId},'','#note')}
function openNote(id){const n=notes.find(n=>n.id===id);if(!n)return;activeId=id;fillEditor(n);setMode('read');showScreen('editor');history.pushState({screen:'editor',id},'','#note')}
function fillEditor(n){$('noteTitle').value=n.title||'';$('noteBody').innerHTML=n.content||'';$('noteCategory').value=categories.includes(n.category)?n.category:(categories[0]||'General');$('timestamp').textContent=(n.createdAt?'Created '+fmtDate(n.createdAt):'New note')+' · Updated '+fmtDate(n.updatedAt);$('actionTitle').textContent=n.title?.trim()||'Untitled note';updateFavoriteLabel();$('readStatus').textContent='Tap any word to highlight it.';}
function setMode(next){mode=next;const ed=$('noteBody'),title=$('noteTitle');const isRead=mode==='read';$('editorScreen').classList.toggle('readmode',isRead);ed.contentEditable=String(!isRead);title.readOnly=isRead;$('formatBar').classList.toggle('hidden',isRead);document.querySelectorAll('.edit-only').forEach(el=>el.classList.toggle('hidden',isRead));$('saveBtn').title=isRead?'Saved':'Save note';$('saveBtn').setAttribute('aria-label',isRead?'Saved':'Save note');$('saveBtn').style.opacity=isRead?'.6':'1';$('readStatus').classList.toggle('hidden',!isRead);$('actionMenu').classList.remove('open');if(isRead)makeReadWords();else{restoreEditableBody();$('noteTitle').focus({preventScroll:true})}updateFavoriteLabel()}
function restoreEditableBody(){const n=currentNote();if(n)$('noteBody').innerHTML=n.content||''}
function makeReadWords(){const body=$('noteBody');const marked=new Set([...body.querySelectorAll('.word.marked')].map(e=>e.dataset.wordkey));const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,{acceptNode(node){if(!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;if(node.parentElement.closest('script,style,button,input,textarea,select,a,.attachment,.word'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{const frag=document.createDocumentFragment();const re=/\S+|\s+/g;let m;while((m=re.exec(node.nodeValue))){if(/^\s+$/.test(m[0]))frag.appendChild(document.createTextNode(m[0]));else{const span=document.createElement('span');span.className='word';span.textContent=m[0];span.dataset.wordkey=m[0].toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');if(marked.has(span.dataset.wordkey))span.classList.add('marked');span.addEventListener('click',e=>{e.stopPropagation();span.classList.toggle('marked');$('readStatus').textContent=span.classList.contains('marked')?'Word highlighted':'Highlight removed'});frag.appendChild(span)}}node.parentNode.replaceChild(frag,node)})}
function saveNote(showMsg=true){const n=currentNote();if(!n)return;if(mode==='read'){if(showMsg)toast('You are in Read Mode');return}n.title=$('noteTitle').value.trim();n.category=$('noteCategory').value;n.content=$('noteBody').innerHTML;n.updatedAt=new Date().toISOString();persist();$('timestamp').textContent='Created '+fmtDate(n.createdAt)+' · Updated '+fmtDate(n.updatedAt);$('actionTitle').textContent=n.title||'Untitled note';if(showMsg)toast('Note saved ✓');renderHome()}
function scheduleSave(){if(mode!=='edit')return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveNote(false),450);$('actionTitle').textContent=$('noteTitle').value.trim()||'Untitled note'}
function updateFavoriteLabel(){const n=currentNote();const b=$('menuFavorite');if(!n)return;b.innerHTML=(n.favorite?'★ <span>Remove from favorites</span>':'☆ <span>Add to favorites</span>')}
function openActionMenu(){$('actionMenu').classList.toggle('open')}
function deleteCurrent(){const n=currentNote();if(!n)return;showConfirm('Delete note?',`Delete “${n.title||'Untitled note'}”? This cannot be undone.`,()=>{notes=notes.filter(x=>x.id!==activeId);activeId=null;persist();$('actionMenu').classList.remove('open');showScreen('home');toast('Note deleted')})}
function showConfirm(title,text,fn){$('confirmTitle').textContent=title;$('confirmText').textContent=text;confirmAction=fn;$('confirmModal').classList.add('open')}
function closeConfirm(){$('confirmModal').classList.remove('open');confirmAction=null}
function shareNote(){const n=currentNote();if(!n)return;const content=`${n.title||'Untitled note'}\n${n.category||'General'}\n\n${plainText(n.content||'')}`;if(navigator.share){navigator.share({title:n.title||'NOTE PAL',text:content}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(content).then(()=>toast('Note copied to clipboard')).catch(()=>fallbackCopy(content))}else fallbackCopy(content);$('actionMenu').classList.remove('open')}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Note copied to clipboard')}catch(e){toast('Sharing is not available on this device')}t.remove()}
function bookmarkSelection(){const sel=window.getSelection();if(sel&&sel.rangeCount&&$('noteBody').contains(sel.anchorNode)){rangeBookmark=sel.getRangeAt(0).cloneRange()}}
function restoreSelection(){if(!rangeBookmark)return;const sel=window.getSelection();sel.removeAllRanges();sel.addRange(rangeBookmark)}
function execCmd(cmd,val=null){if(mode!=='edit')return;$('noteBody').focus();restoreSelection();document.execCommand(cmd,false,val);bookmarkSelection();scheduleSave()}
function applyWordHighlight(){if(mode!=='edit')return;const sel=window.getSelection();if(!sel||sel.isCollapsed){toast('Select a word or text first');return}const range=sel.getRangeAt(0);if(!$('noteBody').contains(range.commonAncestorContainer)){toast('Select text inside your note');return}const mark=document.createElement('mark');mark.style.backgroundColor='#ffdc73';mark.style.color='#3b2b00';try{range.surroundContents(mark)}catch(e){document.execCommand('hiliteColor',false,'#ffdc73')}sel.removeAllRanges();scheduleSave();toast('Highlight added')}
function insertChecklist(){if(mode!=='edit')return;$('noteBody').focus();restoreSelection();const ul=document.createElement('ul');const li=document.createElement('li');li.innerHTML='<input type="checkbox" aria-label="Checklist item"> <span>Checklist item</span>';ul.appendChild(li);const sel=window.getSelection();if(sel&&sel.rangeCount&&$('noteBody').contains(sel.anchorNode)){const r=sel.getRangeAt(0);r.deleteContents();r.insertNode(ul)}else $('noteBody').appendChild(ul);const range=document.createRange();range.selectNodeContents(li.querySelector('span'));range.collapse(false);sel.removeAllRanges();sel.addRange(range);scheduleSave()}
function insertAttachment(file){if(!file)return;const body=$('noteBody');body.focus();if(file.type.startsWith('image/')){const reader=new FileReader();reader.onload=()=>{const img=document.createElement('img');img.src=reader.result;img.alt=file.name;img.style.display='block';img.style.margin='12px 0';const sel=window.getSelection();if(sel&&sel.rangeCount&&body.contains(sel.anchorNode)){const r=sel.getRangeAt(0);r.collapse(false);r.insertNode(img)}else body.appendChild(img);const cap=document.createElement('div');cap.className='attachment';cap.textContent='📎 '+file.name;img.after(cap);scheduleSave()};reader.readAsDataURL(file)}else{const link=document.createElement('a');link.className='attachment';link.href=URL.createObjectURL(file);link.target='_blank';link.rel='noopener';link.download=file.name;link.textContent='📎 '+file.name+' ('+Math.max(1,Math.round(file.size/1024))+' KB)';body.appendChild(link);scheduleSave();toast('File attached for this session') }}
function openDraw(){if(mode!=='edit')return;$('drawModal').classList.add('open');setupCanvas()}
function setupCanvas(){const c=$('drawingCanvas');drawCtx=c.getContext('2d');drawCtx.lineCap='round';drawCtx.lineJoin='round';drawCtx.fillStyle='#fff';drawCtx.fillRect(0,0,c.width,c.height)}
function canvasPoint(e){const c=$('drawingCanvas'),r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function drawStart(e){drawing=true;lastPoint=canvasPoint(e);$('drawingCanvas').setPointerCapture?.(e.pointerId)}
function drawMove(e){if(!drawing||!drawCtx)return;const p=canvasPoint(e);drawCtx.strokeStyle=$('penColor').value;drawCtx.lineWidth=+$('penSize').value;drawCtx.beginPath();drawCtx.moveTo(lastPoint.x,lastPoint.y);drawCtx.lineTo(p.x,p.y);drawCtx.stroke();lastPoint=p}
function drawEnd(){drawing=false;lastPoint=null}
function insertDrawing(){const data=$('drawingCanvas').toDataURL('image/png');const img=document.createElement('img');img.src=data;img.alt='Drawing';img.style.display='block';img.style.margin='12px 0';$('noteBody').appendChild(img);$('drawModal').classList.remove('open');scheduleSave();toast('Drawing inserted')}
function setCategory(){const val=$('noteCategory').value;if(val==='__add__'){const name=prompt('New category name:');if(name&&name.trim()&&!categories.some(c=>c.toLowerCase()===name.trim().toLowerCase())){categories.push(name.trim());localStorage.setItem(KEYS.cats,JSON.stringify(categories));renderCategories();$('noteCategory').value=name.trim();const n=currentNote();if(n)n.category=name.trim();scheduleSave()}else if(name)toast('Category already exists or is invalid');$('noteCategory').value=currentNote()?.category||categories[0]||'General';return}const n=currentNote();if(n){n.category=val;scheduleSave()}}
function goHome(){if(mode==='edit')saveNote(false);activeId=null;showScreen('home');history.replaceState({screen:'home'},'','#home')}
$('addNoteBtn').addEventListener('click',createNote);$('searchInput').addEventListener('input',e=>{searchTerm=e.target.value;renderHome()});$('sortBtn').addEventListener('click',()=>{sortNewest=!sortNewest;$('sortBtn').textContent=sortNewest?'↕ Recent':'↕ Oldest';renderHome()});$('saveBtn').addEventListener('click',()=>{if(mode==='edit'){saveNote();setMode('read')}else toast('Note is saved')});$('menuBtn').addEventListener('click',openActionMenu);$('menuEdit').addEventListener('click',()=>{saveNote(false);setMode('edit')});$('menuRead').addEventListener('click',()=>{saveNote(false);setMode('read')});$('menuShare').addEventListener('click',shareNote);$('menuFavorite').addEventListener('click',()=>{const n=currentNote();if(n){n.favorite=!n.favorite;persist();updateFavoriteLabel();renderHome();toast(n.favorite?'Added to favorites':'Removed from favorites')}$('actionMenu').classList.remove('open')});$('menuDelete').addEventListener('click',deleteCurrent);$('noteCategory').addEventListener('change',setCategory);$('noteTitle').addEventListener('input',scheduleSave);$('noteBody').addEventListener('input',()=>{bookmarkSelection();scheduleSave()});$('noteBody').addEventListener('keyup',bookmarkSelection);$('noteBody').addEventListener('mouseup',bookmarkSelection);$('undoBtn').addEventListener('click',()=>execCmd('undo'));$('redoBtn').addEventListener('click',()=>execCmd('redo'));$('undoBarBtn').addEventListener('click',()=>execCmd('undo'));$('redoBarBtn').addEventListener('click',()=>execCmd('redo'));document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>execCmd(b.dataset.cmd)));$('fontColorBtn').addEventListener('click',()=>{$('fontColor').click()});$('fontColor').addEventListener('input',e=>execCmd('foreColor',e.target.value));$('highlightBtn').addEventListener('click',applyWordHighlight);$('clearFormatBtn').addEventListener('click',()=>execCmd('removeFormat'));$('checklistBtn').addEventListener('click',insertChecklist);$('attachBtn').addEventListener('click',()=>{$('filePicker').click()});$('filePicker').addEventListener('change',e=>{[...e.target.files].forEach(insertAttachment);e.target.value=''});$('drawBtn').addEventListener('click',openDraw);$('fontSizeBtn').addEventListener('click',()=>{const size=prompt('Text size (1–7):','4');if(size&&/^[1-7]$/.test(size))execCmd('fontSize',size)});$('closeDraw').addEventListener('click',()=>$('drawModal').classList.remove('open'));$('cancelDraw').addEventListener('click',()=>$('drawModal').classList.remove('open'));$('insertDrawing').addEventListener('click',insertDrawing);$('eraseCanvas').addEventListener('click',setupCanvas);$('drawingCanvas').addEventListener('pointerdown',drawStart);$('drawingCanvas').addEventListener('pointermove',drawMove);$('drawingCanvas').addEventListener('pointerup',drawEnd);$('drawingCanvas').addEventListener('pointercancel',drawEnd);$('closeConfirm').addEventListener('click',closeConfirm);$('cancelConfirm').addEventListener('click',closeConfirm);$('acceptConfirm').addEventListener('click',()=>{const fn=confirmAction;closeConfirm();if(fn)fn()});document.addEventListener('click',e=>{if(!$('menuBtn').contains(e.target)&&!$('actionMenu').contains(e.target))$('actionMenu').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('actionMenu').classList.remove('open');$('drawModal').classList.remove('open');closeConfirm()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&mode==='edit'){e.preventDefault();saveNote();setMode('read')}});window.addEventListener('beforeunload',()=>{if(mode==='edit')saveNote(false)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='edit')saveNote(false)});window.addEventListener('popstate',()=>{if($('editorScreen').classList.contains('active')){if(mode==='edit'){saveNote(false);setMode('read')}else goHome()}else renderHome()});
// Initialize existing stored notes without discarding their original fields.
if(!Array.isArray(notes))notes=[];if(!Array.isArray(categories)||!categories.length)categories=DEFAULT_CATS.slice();categories=[...new Set([...DEFAULT_CATS,...categories])];persist();renderHome();
})();
</script></body></html>
