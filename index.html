
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>NOTE PAL</title>

<style>
:root{
  --bg:#f3f4f6;
  --surface:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --primary:#2563eb;
  --primary-light:#dbeafe;
  --highlight:#fef08a;
  --shadow:0 3px 12px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  min-height:58px;background:var(--surface);display:flex;align-items:center;
  gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0
}
.brand{font-size:20px;font-weight:800;letter-spacing:.2px;flex:1}
.icon-btn{
  border:0;background:transparent;border-radius:10px;width:40px;height:40px;
  display:inline-flex;align-items:center;justify-content:center;font-size:21px;color:var(--text)
}
.icon-btn:active{background:var(--border)}
.searchbar{padding:10px 14px 5px;background:var(--surface);flex-shrink:0}
.searchbar input{
  width:100%;border:1px solid var(--border);background:var(--bg);
  padding:11px 13px;border-radius:12px;outline:none
}
.category-row{
  display:flex;align-items:center;gap:7px;overflow-x:auto;white-space:nowrap;
  padding:10px 12px;background:var(--surface);scrollbar-width:none;flex-shrink:0
}
.category-row::-webkit-scrollbar{display:none}
.category-tab{
  border:1px solid var(--border);border-radius:22px;padding:8px 13px;
  background:#fff;color:#374151;font-size:13px;flex-shrink:0
}
.category-tab.active{background:var(--primary);border-color:var(--primary);color:white}
.add-category{
  width:37px;height:37px;flex-shrink:0;border:1px dashed #9ca3af;border-radius:50%;
  background:#fff;color:#374151;font-size:20px
}
.home-content{flex:1;overflow-y:auto;padding:12px 12px 92px}
.section-heading{font-size:13px;color:var(--muted);margin:3px 3px 12px}
.notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.note-card{
  min-height:135px;background:var(--surface);border:1px solid var(--border);
  border-radius:15px;padding:13px;box-shadow:var(--shadow);position:relative;
  overflow:hidden;display:flex;flex-direction:column;gap:8px
}
.note-card:active{transform:scale(.99)}
.note-card-title{font-weight:750;font-size:15px;overflow-wrap:anywhere;padding-right:17px}
.note-card-preview{
  font-size:13px;line-height:1.45;color:#4b5563;overflow-wrap:anywhere;
  white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden
}
.note-card-meta{margin-top:auto;padding-top:5px;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px}
.note-fav{position:absolute;top:8px;right:9px;font-size:15px;color:#d97706}
.empty-state{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.6}
.fab{
  position:fixed;right:21px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;
  background:var(--primary);color:#fff;font-size:32px;box-shadow:0 6px 18px #0003;z-index:20
}
.drawer-backdrop,.dialog-backdrop{
  position:fixed;inset:0;background:#0006;z-index:50
}
.drawer{
  position:absolute;left:0;top:0;bottom:0;width:min(82vw,320px);background:#fff;
  padding:18px;box-shadow:5px 0 24px #0002;display:flex;flex-direction:column;gap:8px
}
.drawer-title{font-size:21px;font-weight:800;padding:10px 6px 20px}
.drawer-item{border:0;background:transparent;text-align:left;padding:13px 12px;border-radius:10px;font-size:15px}
.drawer-item:active,.drawer-item:hover{background:var(--bg)}
.drawer-footer{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
.editor-screen{
  position:fixed;inset:0;background:var(--surface);z-index:30;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)
}
.editor-header{
  display:flex;align-items:center;gap:5px;padding:7px 8px;border-bottom:1px solid var(--border);
  min-height:54px;flex-shrink:0;background:var(--surface)
}
.editor-title{
  flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:18px;
  font-weight:750;padding:9px 5px;color:var(--text)
}
.editor-title::placeholder{color:#9ca3af}
.mode-label{font-size:11px;color:var(--muted);white-space:nowrap;padding:0 3px}
.note-body{
  flex:1;min-height:0;overflow-y:auto;outline:0;border:0;padding:18px 17px 115px;
  font-size:17px;line-height:1.7;overflow-wrap:anywhere;word-break:normal;
  -webkit-user-select:text;user-select:text
}
.note-body:empty:before{content:"Write your note here...";color:#9ca3af;pointer-events:none}
.note-body[contenteditable="false"]{cursor:text}
.note-body img{max-width:100%;height:auto}
.note-body blockquote{border-left:3px solid #9ca3af;margin-left:0;padding-left:12px;color:#4b5563}
.note-body ul,.note-body ol{padding-left:25px}
.read-word-marker{background:#fbbf24!important;color:#111827!important;border-radius:3px}
.editor-toolbar{
  position:fixed;left:0;right:0;bottom:0;min-height:48px;background:#fff;
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  align-items:center;gap:2px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));
  z-index:45;box-shadow:0 -3px 12px #0000000a
}
.fmt-btn{
  min-width:35px;height:38px;border:1px solid transparent;border-radius:8px;
  background:transparent;color:#1f2937;display:inline-flex;align-items:center;
  justify-content:center;font-size:16px;padding:5px 8px;flex:1;max-width:55px
}
.fmt-btn:active,.fmt-btn.active{background:#e5e7eb}
#btnHighlight{background:#fef08a;border-color:#eab308}
#btnTextColor{font-size:19px}
.editor-menu{
  position:absolute;right:8px;top:49px;width:205px;background:#fff;border:1px solid var(--border);
  border-radius:12px;box-shadow:0 8px 28px #0002;padding:6px;z-index:60
}
.menu-item{
  width:100%;border:0;background:transparent;text-align:left;padding:12px 11px;
  border-radius:8px;font-size:14px;color:#111827
}
.menu-item:active{background:var(--bg)}
.menu-item.danger{color:#dc2626}
.dialog-backdrop{display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.dialog{
  width:min(100%,360px);background:#fff;border-radius:16px;padding:20px;
  box-shadow:0 12px 40px #0003
}
.dialog h3{margin:0 0 14px;font-size:18px}
.dialog input,.dialog select{
  width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;margin-bottom:13px;background:#fff
}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}
.btn{border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:9px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:#dc2626}
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#111827;color:#fff;padding:10px 15px;border-radius:20px;
  font-size:13px;z-index:100;box-shadow:0 4px 15px #0003;max-width:90vw;text-align:center
}
@media(min-width:650px){
  .notes-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .home-content{padding-left:22px;padding-right:22px}
  .note-body{padding-left:max(24px,calc((100% - 760px)/2));padding-right:max(24px,calc((100% - 760px)/2))}
}
</style>
</head>

<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnDrawer" aria-label="Open menu">☰</button>
    <div class="brand">NOTE PAL</div>
    <button class="icon-btn" id="btnFavorites" title="Favorites">☆</button>
  </header>

  <div class="searchbar">
    <input id="searchInput" type="search" placeholder="Search notes..." autocomplete="off">
  </div>

  <nav class="category-row" id="categoryTabs" aria-label="Categories"></nav>

  <main class="home-content" id="homeContent">
    <div class="section-heading" id="notesCount">Your notes</div>
    <div class="notes-grid" id="notesGrid"></div>
    <div class="empty-state hidden" id="emptyState">
      <div style="font-size:38px;margin-bottom:8px">📝</div>
      <strong>No notes found</strong>
      <div>Create a note using the + button.</div>
    </div>
  </main>

  <button class="fab" id="btnNewNote" aria-label="Create new note">+</button>
</div>

<!-- Side drawer -->
<div class="drawer-backdrop hidden" id="drawerBackdrop">
  <aside class="drawer">
    <div class="drawer-title">NOTE PAL</div>
    <button class="drawer-item" id="drawerHome">⌂ &nbsp; All Notes</button>
    <button class="drawer-item" id="drawerFavorites">☆ &nbsp; Favorites</button>
    <button class="drawer-item" id="drawerNewCategory">⊞ &nbsp; Add Category</button>
    <button class="drawer-item" id="drawerNewNote">＋ &nbsp; New Note</button>
    <button class="drawer-item" id="drawerExport">↗ &nbsp; Export Notes</button>
    <div class="drawer-footer">Your notes are saved on this device.</div>
  </aside>
</div>

<!-- Editor -->
<section class="editor-screen hidden" id="editorScreen">
  <header class="editor-header">
    <button class="icon-btn" id="btnBack" title="Back">‹</button>
    <input class="editor-title" id="noteTitle" placeholder="Note title" maxlength="180">
    <span class="mode-label" id="modeLabel">EDIT</span>
    <button class="icon-btn" id="btnCopy" title="Copy note">▣</button>
    <button class="icon-btn" id="btnMenu" title="More options">⋮</button>
  </header>

  <div class="note-body" id="noteBody" contenteditable="true" spellcheck="true"></div>

  <div class="editor-menu hidden" id="editorMenu">
    <button class="menu-item" id="menuMode">Read Mode</button>
    <button class="menu-item" id="menuMove">↪ Move to Category</button>
    <button class="menu-item" id="menuFavorite">☆ Favorite</button>
    <button class="menu-item danger" id="menuDelete">Delete Note</button>
  </div>
</section>

<!-- Formatting toolbar: floats above the mobile keyboard while editing -->
<div class="editor-toolbar hidden" id="editorToolbar">
  <button class="fmt-btn" id="btnBold" title="Bold"><b>B</b></button>
  <button class="fmt-btn" id="btnItalic" title="Italic"><i>I</i></button>
  <button class="fmt-btn" id="btnUnderline" title="Underline"><u>U</u></button>
  <button class="fmt-btn" id="btnHighlight" title="Highlight selected text">A</button>
  <button class="fmt-btn" id="btnTextColor" title="Change text color">◉</button>
  <button class="fmt-btn" id="btnFontMinus" title="Decrease note size">−</button>
  <button class="fmt-btn" id="btnFontPlus" title="Increase note size">+</button>
</div>

<!-- Dialog -->
<div class="dialog-backdrop hidden" id="dialogBackdrop">
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 id="dialogTitle">Add Category</h3>
    <div id="dialogContent"></div>
    <div class="dialog-actions">
      <button class="btn" id="dialogCancel">Cancel</button>
      <button class="btn primary" id="dialogConfirm">Save</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "notepal_notes_v2";
  const CATEGORIES_KEY = "notepal_categories_v2";

  const DEFAULT_CATEGORIES = ["All Notes","Personal","Study","Work","Ideas"];
  const DEFAULT_NOTES = [
    {
      id: makeId(),
      title: "Welcome to NOTE PAL",
      content: "<p>Your notes are saved automatically on this device.</p><p><b>Read Mode:</b> Tap a word to mark where you stopped reading. The marker is temporary and will not change your saved note.</p><p><b>Edit Mode:</b> Use the toolbar to format your text.</p>",
      category: "Personal",
      favorite: false,
      fontSize: 17,
      color: "#111827",
      updated: Date.now()
    }
  ];

  function makeId(){
    return "n_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  function safeParse(value, fallback){
    try{
      const parsed = JSON.parse(value);
      return parsed ?? fallback;
    }catch(e){ return fallback; }
  }

  let categories = safeParse(localStorage.getItem(CATEGORIES_KEY), DEFAULT_CATEGORIES);
  if(!Array.isArray(categories) || !categories.length) categories = [...DEFAULT_CATEGORIES];
  if(!categories.includes("All Notes")) categories.unshift("All Notes");

  let notes = safeParse(localStorage.getItem(STORAGE_KEY), null);
  if(!Array.isArray(notes)){
    notes = DEFAULT_NOTES;
    persist();
  }

  let activeCategory = "All Notes";
  let favoritesOnly = false;
  let currentNoteId = null;
  let isEditMode = true;
  let dialogAction = null;
  let savedSelection = null;
  let toastTimer = null;
  let markerSpan = null;
  let toolbarWasFocused = false;

  const home = $("app");
  const editor = $("editorScreen");
  const noteTitle = $("noteTitle");
  const noteBody = $("noteBody");
  const toolbar = $("editorToolbar");
  const menu = $("editorMenu");
  const visualViewportRef = window.visualViewport;

  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
    }catch(e){
      showToast("Unable to save. Device storage may be full.");
    }
  }

  function currentNote(){
    return notes.find(n => n.id === currentNoteId) || null;
  }

  function plainText(html){
    const box = document.createElement("div");
    box.innerHTML = html || "";
    return (box.innerText || box.textContent || "").replace(/\s+/g," ").trim();
  }

  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[ch]);
  }

  function showToast(message){
    const el = $("toast");
    el.textContent = message;
    el.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add("hidden"), 1900);
  }

  function saveCurrentNote(){
    const note = currentNote();
    if(!note) return;

    note.title = noteTitle.value.trim();
    // Save a clone with the temporary reading marker removed.
    const clone = noteBody.cloneNode(true);
    clone.querySelectorAll(".read-word-marker").forEach(span => {
      span.replaceWith(...span.childNodes);
    });
    note.content = clone.innerHTML;
    note.fontSize = parseInt(noteBody.dataset.fontSize || note.fontSize || 17,10);
    note.color = noteBody.style.color || note.color || "#111827";
    note.updated = Date.now();
    persist();
  }

  function renderCategories(){
    const row = $("categoryTabs");
    row.innerHTML = "";

    categories.forEach(category => {
      if(category === "All Notes") return;
      const button = document.createElement("button");
      button.className = "category-tab" + (activeCategory === category && !favoritesOnly ? " active" : "");
      button.textContent = category;
      button.addEventListener("click", () => {
        activeCategory = category;
        favoritesOnly = false;
        renderCategories();
        renderNotes();
      });
      row.appendChild(button);
    });

    const all = document.createElement("button");
    all.className = "category-tab" + (activeCategory === "All Notes" && !favoritesOnly ? " active" : "");
    all.textContent = "All Notes";
    all.addEventListener("click", () => {
      activeCategory = "All Notes";
      favoritesOnly = false;
      renderCategories();
      renderNotes();
    });
    row.insertBefore(all,row.firstChild);

    const add = document.createElement("button");
    add.className = "add-category";
    add.textContent = "⊞+";
    add.title = "Add category";
    add.addEventListener("click", addCategoryDialog);
    row.appendChild(add);
  }

  function renderNotes(){
    const grid = $("notesGrid");
    const empty = $("emptyState");
    const search = $("searchInput").value.trim().toLowerCase();
    grid.innerHTML = "";

    const filtered = notes
      .filter(note => !favoritesOnly || note.favorite)
      .filter(note => activeCategory === "All Notes" || note.category === activeCategory)
      .filter(note => {
        if(!search) return true;
        return (note.title || "").toLowerCase().includes(search) ||
               plainText(note.content).toLowerCase().includes(search) ||
               (note.category || "").toLowerCase().includes(search);
      })
      .sort((a,b) => (b.updated || 0) - (a.updated || 0));

    $("notesCount").textContent =
      (favoritesOnly ? "Favorite notes" : activeCategory === "All Notes" ? "Your notes" : activeCategory)
      + " · " + filtered.length;

    filtered.forEach(note => {
      const card = document.createElement("article");
      card.className = "note-card";
      card.tabIndex = 0;

      const title = document.createElement("div");
      title.className = "note-card-title";
      title.textContent = note.title || "Untitled note";

      const preview = document.createElement("div");
      preview.className = "note-card-preview";
      preview.textContent = plainText(note.content) || "No content yet";

      const meta = document.createElement("div");
      meta.className = "note-card-meta";
      const category = document.createElement("span");
      category.textContent = note.category || "Personal";
      const date = document.createElement("span");
      date.textContent = "· " + new Date(note.updated || Date.now()).toLocaleDateString();
      meta.append(category,date);

      if(note.favorite){
        const star = document.createElement("span");
        star.className = "note-fav";
        star.textContent = "★";
        card.appendChild(star);
      }

      card.append(title,preview,meta);
      card.addEventListener("click", () => openNote(note.id));
      card.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          openNote(note.id);
        }
      });
      grid.appendChild(card);
    });

    empty.classList.toggle("hidden", filtered.length !== 0);
  }

  function openNote(id){
    currentNoteId = id;
    const note = currentNote();
    if(!note) return;

    clearReadMarker();
    noteTitle.value = note.title || "";
    noteBody.innerHTML = note.content || "";
    noteBody.dataset.fontSize = String(note.fontSize || 17);
    noteBody.style.fontSize = (note.fontSize || 17) + "px";
    noteBody.style.color = note.color || "#111827";

    home.classList.add("hidden");
    editor.classList.remove("hidden");
    menu.classList.add("hidden");
    setMode(true);
    noteBody.scrollTop = 0;
    updateToolbarPosition();
  }

  function newNote(){
    const category = activeCategory !== "All Notes" && categories.includes(activeCategory)
      ? activeCategory
      : (categories.find(c => c !== "All Notes") || "Personal");

    const note = {
      id: makeId(),
      title: "",
      content: "",
      category,
      favorite: false,
      fontSize: 17,
      color: "#111827",
      updated: Date.now()
    };
    notes.unshift(note);
    persist();
    openNote(note.id);
    setTimeout(() => noteTitle.focus(),100);
  }

  function closeEditor(){
    saveCurrentNote();
    clearReadMarker();
    editor.classList.add("hidden");
    toolbar.classList.add("hidden");
    menu.classList.add("hidden");
    home.classList.remove("hidden");
    currentNoteId = null;
    renderNotes();
  }

  function setMode(editMode){
    isEditMode = !!editMode;
    if(!isEditMode){
      clearReadMarker();
      saveCurrentNote();
    }
    noteTitle.readOnly = !isEditMode;
    noteBody.contentEditable = isEditMode ? "true" : "false";
    $("modeLabel").textContent = isEditMode ? "EDIT" : "READ";
    $("menuMode").textContent = isEditMode ? "Read Mode" : "Edit Mode";
    toolbar.classList.toggle("hidden", !isEditMode);
    if(isEditMode){
      updateToolbarPosition();
    }else{
      toolbar.style.bottom = "0px";
    }
    menu.classList.add("hidden");
  }

  // Temporary reading marker: remove the wrapper without changing saved content.
  function clearReadMarker(){
    const old = noteBody.querySelector(".read-word-marker");
    if(old){
      old.replaceWith(...old.childNodes);
    }
    markerSpan = null;
  }

  function getRangeAtPoint(event){
    let range = null;
    if(document.caretRangeFromPoint){
      range = document.caretRangeFromPoint(event.clientX,event.clientY);
    }else if(document.caretPositionFromPoint){
      const pos = document.caretPositionFromPoint(event.clientX,event.clientY);
      if(pos){
        range = document.createRange();
        range.setStart(pos.offsetNode,pos.offset);
        range.collapse(true);
      }
    }
    return range;
  }

  function isWordChar(char){
    return !!char && /[\p{L}\p{N}_'-]/u.test(char);
  }

  function markWordAtPoint(event){
    if(isEditMode) return;
    if(event.target.closest("button,input,a,select,textarea")) return;

    const range = getRangeAtPoint(event);
    if(!range || !range.startContainer || range.startContainer.nodeType !== Node.TEXT_NODE) return;

    const textNode = range.startContainer;
    const offset = range.startOffset;
    const text = textNode.textContent || "";
    if(!text.length) return;

    let start = Math.min(offset,text.length);
    if(start === text.length) start--;
    if(start >= 0 && !isWordChar(text[start]) && start > 0 && isWordChar(text[start-1])) start--;

    if(start < 0 || !isWordChar(text[start])) return;

    let end = start;
    while(start > 0 && isWordChar(text[start-1])) start--;
    while(end < text.length && isWordChar(text[end])) end++;

    // Keep the original text node intact when unwrapping the old marker.
    clearReadMarker();

    try{
      const wordRange = document.createRange();
      wordRange.setStart(textNode,start);
      wordRange.setEnd(textNode,end);
      const span = document.createElement("span");
      span.className = "read-word-marker";
      wordRange.surroundContents(span);
      markerSpan = span;
    }catch(e){
      // A click on non-text or complex inline content is safely ignored.
    }
  }

  noteBody.addEventListener("click", markWordAtPoint);

  function saveSelection(){
    const selection = window.getSelection();
    if(!selection || !selection.rangeCount) return;
    const range = selection.getRangeAt(0);
    if(noteBody.contains(range.commonAncestorContainer)){
      savedSelection = range.cloneRange();
    }
  }

  function restoreSelection(){
    if(!savedSelection) return;
    try{
      noteBody.focus({preventScroll:true});
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(savedSelection);
    }catch(e){}
  }

  function applyCommand(command,value=null){
    if(!isEditMode) setMode(true);
    restoreSelection();
    noteBody.focus();
    try{
      document.execCommand(command,false,value);
    }catch(e){}
    saveCurrentNote();
    saveSelection();
  }

  function applyHighlight(){
    if(!isEditMode) setMode(true);
    restoreSelection();
    noteBody.focus();
    try{
      document.execCommand("hiliteColor",false,"#fef08a");
    }catch(e){
      try{document.execCommand("backColor",false,"#fef08a");}catch(ignore){}
    }
    saveCurrentNote();
    saveSelection();
  }

  const textColors = ["#111827","#1d4ed8","#b91c1c","#047857","#7e22ce","#b45309"];
  let colorIndex = 0;

  function changeTextColor(){
    if(!isEditMode) setMode(true);
    restoreSelection();
    noteBody.focus();
    colorIndex = (colorIndex + 1) % textColors.length;
    try{
      document.execCommand("foreColor",false,textColors[colorIndex]);
    }catch(e){}
    $("btnTextColor").style.color = textColors[colorIndex];
    saveCurrentNote();
    saveSelection();
  }

  function changeFontSize(amount){
    if(!isEditMode) setMode(true);
    const note = currentNote();
    if(!note) return;
    let size = parseInt(noteBody.dataset.fontSize || note.fontSize || 17,10);
    size = Math.max(12,Math.min(34,size + amount));
    noteBody.dataset.fontSize = String(size);
    noteBody.style.fontSize = size + "px";
    note.fontSize = size;
    saveCurrentNote();
  }

  function copyCurrentNote(){
    const note = currentNote();
    if(!note) return;
    const text = (note.title ? note.title + "\n\n" : "") + plainText(note.content);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        () => showToast("Note copied"),
        () => fallbackCopy(text)
      );
    }else{
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text){
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try{
      document.execCommand("copy");
      showToast("Note copied");
    }catch(e){ showToast("Copy not available"); }
    area.remove();
  }

  function addCategoryDialog(){
    openDialog("Add Category",
      '<input id="dialogCategoryName" maxlength="35" placeholder="Category name" autocomplete="off">',
      () => {
        const field = $("dialogCategoryName");
        const name = field.value.trim();
        if(!name){ showToast("Enter a category name"); return false; }
        if(categories.some(c => c.toLowerCase() === name.toLowerCase())){
          showToast("That category already exists");
          return false;
        }
        categories.push(name);
        activeCategory = name;
        favoritesOnly = false;
        persist();
        renderCategories();
        renderNotes();
        return true;
      }
    );
    setTimeout(() => $("dialogCategoryName")?.focus(),50);
  }

  function moveCategoryDialog(){
    const note = currentNote();
    if(!note) return;

    const options = categories.filter(c => c !== "All Notes")
      .map(c => `<option value="${escapeHtml(c)}" ${c===note.category?"selected":""}>${escapeHtml(c)}</option>`)
      .join("");

    openDialog("Move to Category",
      `<select id="dialogMoveCategory">${options}</select>`,
      () => {
        const selected = $("dialogMoveCategory").value;
        if(!selected) return false;
        note.category = selected;
        note.updated = Date.now();
        persist();
        renderCategories();
        renderNotes();
        showToast("Moved to " + selected);
        return true;
      }
    );
  }

  function deleteCurrentNote(){
    const note = currentNote();
    if(!note) return;
    openDialog("Delete Note",
      `<p style="line-height:1.5;color:#4b5563">Delete “${escapeHtml(note.title || "Untitled note")}”? This cannot be undone.</p>`,
      () => {
        notes = notes.filter(n => n.id !== currentNoteId);
        persist();
        closeEditor();
        showToast("Note deleted");
        return true;
      },
      "Delete",
      true
    );
  }

  function openDialog(title,content,onConfirm,confirmLabel="Save",danger=false){
    $("dialogTitle").textContent = title;
    $("dialogContent").innerHTML = content;
    $("dialogConfirm").textContent = confirmLabel;
    $("dialogConfirm").classList.toggle("danger",danger);
    $("dialogBackdrop").classList.remove("hidden");
    dialogAction = onConfirm;
  }

  function closeDialog(){
    $("dialogBackdrop").classList.add("hidden");
    $("dialogContent").innerHTML = "";
    dialogAction = null;
  }

  function toggleFavorite(){
    const note = currentNote();
    if(!note) return;
    note.favorite = !note.favorite;
    note.updated = Date.now();
    persist();
    $("menuFavorite").textContent = note.favorite ? "★ Remove Favorite" : "☆ Favorite";
    renderNotes();
    menu.classList.add("hidden");
    showToast(note.favorite ? "Added to favorites" : "Removed from favorites");
  }

  function showFavorites(){
    activeCategory = "All Notes";
    favoritesOnly = true;
    renderCategories();
    renderNotes();
    closeDrawer();
  }

  function openDrawer(){ $("drawerBackdrop").classList.remove("hidden"); }
  function closeDrawer(){ $("drawerBackdrop").classList.add("hidden"); }

  function exportNotes(){
    const payload = JSON.stringify({categories,notes},null,2);
    const blob = new Blob([payload],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "notepal-backup.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url),1000);
    closeDrawer();
    showToast("Backup exported");
  }

  // Anchor the formatting toolbar above the keyboard on mobile browsers.
  function updateToolbarPosition(){
    if(!isEditMode || editor.classList.contains("hidden")){
      toolbar.classList.add("hidden");
      return;
    }
    toolbar.classList.remove("hidden");

    let bottom = 0;
    if(visualViewportRef){
      const keyboardGap = Math.max(
        0,
        window.innerHeight - visualViewportRef.height - visualViewportRef.offsetTop
      );
      const keyboardLikelyOpen = visualViewportRef.height < window.innerHeight * 0.82;
      bottom = keyboardLikelyOpen ? keyboardGap : 0;
    }
    toolbar.style.bottom = bottom + "px";
  }

  if(visualViewportRef){
    visualViewportRef.addEventListener("resize",updateToolbarPosition);
    visualViewportRef.addEventListener("scroll",updateToolbarPosition);
  }
  window.addEventListener("resize",updateToolbarPosition);
  window.addEventListener("orientationchange",() => setTimeout(updateToolbarPosition,250));

  // Keep selection available when tapping the formatting buttons.
  toolbar.querySelectorAll("button").forEach(button => {
    button.addEventListener("mousedown",e => {
      e.preventDefault();
      saveSelection();
    });
    button.addEventListener("touchstart",saveSelection,{passive:true});
  });

  $("btnBold").addEventListener("click",() => applyCommand("bold"));
  $("btnItalic").addEventListener("click",() => applyCommand("italic"));
  $("btnUnderline").addEventListener("click",() => applyCommand("underline"));
  $("btnHighlight").addEventListener("click",applyHighlight);
  $("btnTextColor").addEventListener("click",changeTextColor);
  $("btnFontMinus").addEventListener("click",() => changeFontSize(-1));
  $("btnFontPlus").addEventListener("click",() => changeFontSize(1));

  noteBody.addEventListener("keyup",saveSelection);
  noteBody.addEventListener("mouseup",saveSelection);
  noteBody.addEventListener("input",() => {
    if(isEditMode) saveCurrentNote();
  });
  noteTitle.addEventListener("input",() => {
    if(isEditMode) saveCurrentNote();
  });

  $("btnNewNote").addEventListener("click",newNote);
  $("btnBack").addEventListener("click",closeEditor);
  $("btnCopy").addEventListener("click",copyCurrentNote);
  $("btnMenu").addEventListener("click",e => {
    e.stopPropagation();
    const note = currentNote();
    if(note){
      $("menuFavorite").textContent = note.favorite ? "★ Remove Favorite" : "☆ Favorite";
    }
    menu.classList.toggle("hidden");
  });

  $("menuMode").addEventListener("click",() => setMode(!isEditMode));
  $("menuMove").addEventListener("click",() => {
    menu.classList.add("hidden");
    moveCategoryDialog();
  });
  $("menuFavorite").addEventListener("click",toggleFavorite);
  $("menuDelete").addEventListener("click",deleteCurrentNote);

  $("btnDrawer").addEventListener("click",openDrawer);
  $("drawerBackdrop").addEventListener("click",e => {
    if(e.target === $("drawerBackdrop")) closeDrawer();
  });
  $("drawerHome").addEventListener("click",() => {
    activeCategory = "All Notes";
    favoritesOnly = false;
    $("searchInput").value = "";
    renderCategories();
    renderNotes();
    closeDrawer();
  });
  $("drawerFavorites").addEventListener("click",showFavorites);
  $("drawerNewCategory").addEventListener("click",() => {
    closeDrawer();
    addCategoryDialog();
  });
  $("drawerNewNote").addEventListener("click",() => {
    closeDrawer();
    newNote();
  });
  $("drawerExport").addEventListener("click",exportNotes);

  $("btnFavorites").addEventListener("click",showFavorites);
  $("searchInput").addEventListener("input",renderNotes);

  $("dialogCancel").addEventListener("click",closeDialog);
  $("dialogBackdrop").addEventListener("click",e => {
    if(e.target === $("dialogBackdrop")) closeDialog();
  });
  $("dialogConfirm").addEventListener("click",() => {
    if(typeof dialogAction === "function"){
      const success = dialogAction();
      if(success !== false) closeDialog();
    }
  });

  document.addEventListener("click",e => {
    if(!menu.classList.contains("hidden") &&
       !menu.contains(e.target) &&
       e.target !== $("btnMenu")){
      menu.classList.add("hidden");
    }
  });

  document.addEventListener("keydown",e => {
    if(e.key === "Escape"){
      if(!$("dialogBackdrop").classList.contains("hidden")) closeDialog();
      else if(!$("drawerBackdrop").classList.contains("hidden")) closeDrawer();
      else if(!menu.classList.contains("hidden")) menu.classList.add("hidden");
      else if(!editor.classList.contains("hidden")) closeEditor();
    }
    if(e.key === "Enter" && e.target.id === "dialogCategoryName"){
      e.preventDefault();
      $("dialogConfirm").click();
    }
  });

  // Save on app backgrounding/closing as a final safety net.
  document.addEventListener("visibilitychange",() => {
    if(document.visibilityState === "hidden" && currentNoteId) saveCurrentNote();
  });
  window.addEventListener("pagehide",() => {
    if(currentNoteId) saveCurrentNote();
  });

  renderCategories();
  renderNotes();
})();
</script>
</body>
</html>
