<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>NOTE PAL</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#778196;--line:#e3e8f0;--accent:#2563eb;--soft:#eaf1ff;--amber:#ffcf4a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.app{height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;min-height:0}
.screen.active{display:flex}
.home-head,.editor-top{background:var(--panel);border-bottom:1px solid var(--line);padding:12px}
.brandrow,.actionbar,.subheader,.sectionline{display:flex;align-items:center;justify-content:space-between;gap:9px}
.brand{font-size:24px;font-weight:850}
.brand span{color:var(--accent)}
.subbrand,.timestamp,.smallmuted{font-size:12px;color:var(--muted)}
.primary{background:var(--accent);color:white;border-radius:11px;padding:10px 14px;font-weight:750}
.searchrow{display:flex;gap:8px;margin-top:13px}
.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px}
.filter,.chip{border:1px solid var(--line);border-radius:10px;background:white;padding:8px 11px}
.chips{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:white}
.chip{white-space:nowrap;font-size:12px}
.chip.active{background:var(--soft);color:var(--accent);font-weight:bold}
.home-main{padding:13px;overflow:auto;flex:1}
.sectionline{margin-bottom:12px}
.sectionline h2{font-size:15px;margin:0}
.notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note-card{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:125px;text-align:left;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.note-card h3{font-size:15px;margin:0}
.note-preview{font-size:12px;color:#6c778a;line-height:1.45;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.card-meta{display:flex;justify-content:space-between;gap:5px;margin-top:auto}
.tag{font-size:10px;background:#eef2f7;border-radius:6px;padding:4px 6px}
.date-mini{font-size:10px;color:#929bad}
.empty{grid-column:1/-1;text-align:center;padding:40px 15px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:10px;background:transparent;color:#344054;font-size:21px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.save{background:var(--accent);color:white}
.action-title{flex:1;text-align:center;font-size:12px;color:var(--muted);font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actiongroup{display:flex;align-items:center;gap:3px}
.subheader{padding-top:9px}
.timestamp{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.category-select{max-width:48%;min-width:110px;border:1px solid var(--line);border-radius:9px;padding:7px;background:#f8faff;font-size:12px}
.body-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:17px;background:white}
.title-input{display:block;width:100%;border:0;outline:none;font-size:25px;font-weight:800;padding:0 0 15px;background:transparent;color:var(--ink)}
.content-body{font-size:16px;line-height:1.75;min-height:70%;outline:none;overflow-wrap:anywhere;white-space:normal}
.content-body:empty:before{content:'Start writing your note…';color:#a6afbe;pointer-events:none}
.content-body img{max-width:100%;height:auto;border-radius:9px}
.content-body ul,.content-body ol{padding-left:24px}
.content-body input[type=checkbox]{width:18px;height:18px;vertical-align:middle}
.word{border-radius:4px;cursor:pointer}
.word.marked{background:#ffdf66;color:#2c1b00;box-shadow:0 0 0 2px #ffbf33,0 0 10px #ffb30099}
.formatbar{flex-shrink:0;display:flex;align-items:center;gap:5px;overflow-x:auto;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:white;border-top:1px solid var(--line);box-shadow:0 -5px 18px #17203308;scrollbar-width:none}
.formatbar::-webkit-scrollbar{display:none}
.toolbtn{min-width:42px;height:42px;padding:0 10px;border-radius:10px;background:#f4f6fa;color:#354157;display:flex;align-items:center;justify-content:center;gap:5px;font-size:17px;white-space:nowrap;border:1px solid transparent;flex-shrink:0}
.toolbtn:active,.toolbtn.selected{background:var(--soft);border-color:#d4e1ff;color:var(--accent)}
.toolbtn.word-highlighter{min-width:70px;justify-content:space-between;gap:8px;background:#171207;color:#ffe36a;border:1px solid #d99a18;border-radius:12px;box-shadow:0 0 0 1px #ffbf3340,0 0 10px #ffb30055,inset 0 0 8px #ffbf3318;font-weight:800}
.counter-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#ffcf4a;color:#211704;font-size:11px;font-weight:900}
.toolsep{width:1px;background:var(--line);margin:4px 1px;flex-shrink:0}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:44px;width:190px;background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 15px 40px #11182725;padding:6px;z-index:20;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:transparent;padding:11px;border-radius:8px;font-size:13px}
.menu button:active{background:#f1f5fb}
.menu .danger{color:#dc2626}
.modalback{display:none;position:fixed;inset:0;background:#11182775;z-index:50;align-items:center;justify-content:center;padding:16px}
.modalback.open{display:flex}
.modal{background:white;width:min(500px,100%);max-height:90dvh;overflow:auto;border-radius:18px;padding:17px}
.modalhead,.modalfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.modalhead h3{margin:0;font-size:17px}
.modalfoot{justify-content:flex-end;margin-top:12px}
.secondary{background:#eef2f7;color:#334155;border-radius:10px;padding:10px 13px}
.dangerbtn{background:#fee2e2;color:#b91c1c;border-radius:10px;padding:10px 13px}
.drawing-canvas{width:100%;height:250px;border:1px solid #d7deea;border-radius:10px;touch-action:none;background:white}
.hidden{display:none!important}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:10px 15px;border-radius:99px;font-size:12px;z-index:90;opacity:0;pointer-events:none}
.toast.show{opacity:1}
@media(min-width:650px){.notes-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.body-scroll{padding:25px 32px}.formatbar{justify-content:center}}
</style>
</head>
<body>
<div class="app">
<section id="homeScreen" class="screen active">
<header class="home-head">
<div class="brandrow"><div><div class="brand">NOTE <span>PAL</span></div><div class="subbrand">Your thoughts, always within reach.</div></div><button class="primary" id="addNoteBtn">＋ New note</button></div>
<div class="searchrow"><input id="searchInput" class="search" placeholder="Search notes…"><button id="sortBtn" class="filter">↕ Recent</button></div>
</header>
<nav id="categoryChips" class="chips"></nav>
<main class="home-main"><div class="sectionline"><h2 id="listHeading">All notes</h2><span id="noteCount" class="smallmuted">0 notes</span></div><div id="notesGrid" class="notes-grid"></div></main>
</section>

<section id="editorScreen" class="screen">
<header class="editor-top">
<div class="actionbar">
<div class="actiongroup"><button id="saveBtn" class="iconbtn save" title="Save note">✓</button></div>
<div id="actionTitle" class="action-title">New note</div>
<div class="actiongroup">
<button id="undoBtn" class="iconbtn edit-only" title="Undo">↶</button>
<button id="redoBtn" class="iconbtn edit-only" title="Redo">↷</button>
<div class="menu-wrap"><button id="menuBtn" class="iconbtn" title="More actions">⋮</button>
<div id="actionMenu" class="menu">
<button id="menuEdit">✎ Edit mode</button><button id="menuRead">◉ Read mode</button><button id="menuShare">↗ Share note</button><button id="menuFavorite">☆ Add to favorites</button><button id="menuPin">📌 Pin / unpin note</button><button id="menuDelete" class="danger">⌫ Delete note</button>
</div></div>
</div>
</div>
<div class="subheader"><div id="timestamp" class="timestamp">New note</div><select id="noteCategory" class="category-select"></select></div>
</header>
<div id="editorScroll" class="body-scroll">
<input id="noteTitle" class="title-input" placeholder="Untitled note" maxlength="180">
<div id="noteBody" class="content-body" contenteditable="true" spellcheck="true"></div>
<div id="readStatus" class="smallmuted" style="text-align:center;padding-top:12px">Tap a word to highlight it.</div>
</div>
<footer id="formatBar" class="formatbar">
<button class="toolbtn" data-cmd="bold" title="Bold"><b>B</b></button>
<button class="toolbtn" data-cmd="italic" title="Italic"><i>I</i></button>
<button class="toolbtn" data-cmd="underline" title="Underline"><u>U</u></button>
<button class="toolbtn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
<div class="toolsep"></div>
<button id="fontColorBtn" class="toolbtn" title="Text color">A<span style="font-size:10px;color:#e34b4b">▰</span></button>
<input id="fontColor" type="color" class="hidden" value="#172033" aria-label="Text color">
<button id="fontSizeMinus" class="toolbtn" title="Decrease font size">A−</button>
<button id="fontSizePlus" class="toolbtn" title="Increase font size">A+</button>
<div class="toolsep"></div>
<button id="highlightBtn" class="toolbtn word-highlighter" title="Highlight selected word"><span>🖍</span><span id="highlightCount" class="counter-badge">0</span></button>
<button id="checklistBtn" class="toolbtn" title="Checklist">☑</button>
<button id="attachBtn" class="toolbtn" title="Attach file">📎</button>
<button id="drawBtn" class="toolbtn" title="Draw">✎</button>
<button id="clearFormatBtn" class="toolbtn" title="Clear formatting">Tx</button>
</footer>
<input type="file" id="filePicker" class="hidden" multiple accept="image/*,.pdf,.txt,.doc,.docx,.xlsx,.ppt,.pptx,.mp3,.m4a,.wav,.mp4">
</section>
</div>

<div id="drawModal" class="modalback"><div class="modal">
<div class="modalhead"><h3>Draw on your note</h3><button id="closeDraw" class="iconbtn">×</button></div>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0"><label>Pen <input id="penColor" type="color" value="#172033"></label><label>Size <input id="penSize" type="range" min="1" max="18" value="4"></label><button id="eraseCanvas" class="secondary">Clear drawing</button></div>
<canvas id="drawingCanvas" class="drawing-canvas" width="900" height="540"></canvas>
<div class="modalfoot"><button id="cancelDraw" class="secondary">Cancel</button><button id="insertDrawing" class="primary">Insert drawing</button></div>
</div></div>
<div id="confirmModal" class="modalback"><div class="modal">
<div class="modalhead"><h3 id="confirmTitle">Delete note?</h3><button id="closeConfirm" class="iconbtn">×</button></div>
<p id="confirmText">This action cannot be undone.</p>
<div class="modalfoot"><button id="cancelConfirm" class="secondary">Cancel</button><button id="acceptConfirm" class="dangerbtn">Delete</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
(()=>{'use strict';
const KEYS={notes:'notepal_notes_v1',cats:'notepal_categories_v1'};
const DEFAULT_CATS=['General','Sermon','Bible Study','Devotion','Ministry','Personal'];
let notes=readStore(KEYS.notes,[]),categories=readStore(KEYS.cats,DEFAULT_CATS),activeId=null,mode='edit',sortNewest=true,filterCategory='All',searchTerm='',saveTimer=null,confirmAction=null,rangeBookmark=null,drawing=false,lastPoint=null,drawCtx=null,fontSize=16;

const $=id=>document.getElementById(id);
function readStore(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function persist(){try{localStorage.setItem(KEYS.notes,JSON.stringify(notes));localStorage.setItem(KEYS.cats,JSON.stringify(categories))}catch(e){toast('Storage full. Remove large attachments.')}}
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function plain(h=''){const d=document.createElement('div');d.innerHTML=h;return d.innerText||d.textContent||''}
function fmt(v){if(!v)return 'Not saved yet';const d=new Date(v);return isNaN(d)?'':d.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function current(){return notes.find(n=>n.id===activeId)||null}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2100)}
function showScreen(n){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(n+'Screen').classList.add('active');if(n==='home')renderHome()}
function renderCategories(){
const nav=$('categoryChips');nav.innerHTML='';
['All',...categories,'★ Favorites'].forEach(c=>{const b=document.createElement('button');b.className='chip'+(filterCategory===c?' active':'');b.textContent=c;b.onclick=()=>{filterCategory=c;renderHome()};nav.appendChild(b)});
const s=$('noteCategory'),prev=s.value;s.innerHTML='';
categories.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)});
const add=document.createElement('option');add.value='__add__';add.textContent='＋ Add category…';s.appendChild(add);
if(categories.includes(prev))s.value=prev
}
function renderHome(){
renderCategories();const grid=$('notesGrid');grid.innerHTML='';
let list=notes.filter(n=>((n.title||'')+' '+plain(n.content||'')+' '+(n.category||'')).toLowerCase().includes(searchTerm.toLowerCase())&&(filterCategory==='All'||(filterCategory==='★ Favorites'?!!n.favorite:n.category===filterCategory)));
list.sort((a,b)=>{if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;return (sortNewest?1:-1)*(new Date(b.updatedAt||b.createdAt||0)-new Date(a.updatedAt||a.createdAt||0))});
$('listHeading').textContent=filterCategory==='All'?'All notes':filterCategory;$('noteCount').textContent=list.length+' notes';
if(!list.length){grid.innerHTML='<div class="empty"><strong>'+(searchTerm?'No matching notes':'Nothing here yet')+'</strong><br>Tap “New note” to capture an idea.</div>';return}
list.forEach(n=>{const b=document.createElement('button');b.className='note-card';b.innerHTML=`<h3>${n.pinned?'📌 ':''}${esc(n.title||'Untitled note')}</h3><div class="note-preview">${esc(plain(n.content||'')||'No additional text')}</div><div class="card-meta"><span class="tag">${esc(n.category||'General')}${n.favorite?' · ★':''}</span><span class="date-mini">${esc(fmt(n.updatedAt||n.createdAt).split(',')[0]||'')}</span></div>`;b.onclick=()=>openNote(n.id);grid.appendChild(b)})
}
function createNote(){const now=new Date().toISOString();const n={id:uid(),title:'',category:categories[0]||'General',content:'',favorite:false,pinned:false,createdAt:now,updatedAt:now};notes.unshift(n);activeId=n.id;persist();fill(n);setMode('edit');showScreen('editor');$('noteTitle').focus();history.pushState({screen:'editor',id:activeId},'','#note')}
function openNote(id){const n=notes.find(x=>x.id===id);if(!n)return;activeId=id;fill(n);setMode('read');showScreen('editor');history.pushState({screen:'editor',id},'','#note')}
function fill(n){$('noteTitle').value=n.title||'';$('noteBody').innerHTML=n.content||'';$('noteCategory').value=categories.includes(n.category)?n.category:categories[0];$('timestamp').textContent='Created '+fmt(n.createdAt)+' · Updated '+fmt(n.updatedAt);$('actionTitle').textContent=n.title||'Untitled note';updateFavLabel();updateBadge()}
function setMode(m){
mode=m;const r=m==='read';$('editorScreen').classList.toggle('readmode',r);$('noteBody').contentEditable=String(!r);$('noteTitle').readOnly=r;$('noteCategory').disabled=r;$('formatBar').classList.toggle('hidden',r);document.querySelectorAll('.edit-only').forEach(x=>x.classList.toggle('hidden',r));$('readStatus').classList.toggle('hidden',!r);$('actionMenu').classList.remove('open');
if(r)makeWords();else $('noteBody').innerHTML=current()?.content||'';
updateBadge();updateFavLabel()
}
function makeWords(){
const body=$('noteBody');const marked=body.querySelector('.word.marked')?.dataset.wordkey||'';
const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()&&!n.parentElement.closest('script,style,button,input,textarea,select,a,.attachment,.word')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
const ns=[];while(walker.nextNode())ns.push(walker.currentNode);
ns.forEach(n=>{const f=document.createDocumentFragment(),re=/\S+|\s+/g;let m;while((m=re.exec(n.nodeValue))){if(/^\s+$/.test(m[0]))f.appendChild(document.createTextNode(m[0]));else{const s=document.createElement('span');s.className='word';s.textContent=m[0];s.dataset.wordkey=m[0].toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');if(marked&&marked===s.dataset.wordkey)s.classList.add('marked');s.onclick=e=>{e.stopPropagation();const was=s.classList.contains('marked');body.querySelectorAll('.word.marked').forEach(w=>w.classList.remove('marked'));if(!was)s.classList.add('marked');$('readStatus').textContent=was?'Highlight removed':'Latest word highlighted';updateBadge()};f.appendChild(s)}}n.parentNode.replaceChild(f,n)});updateBadge()
}
function updateBadge(){const b=$('highlightCount');if(b)b.textContent=String($('noteBody').querySelectorAll('.word.marked,mark').length)}
function save(show=true){const n=current();if(!n||mode==='read')return;n.title=$('noteTitle').value.trim();n.category=$('noteCategory').value;n.content=$('noteBody').innerHTML;n.updatedAt=new Date().toISOString();persist();$('timestamp').textContent='Created '+fmt(n.createdAt)+' · Updated '+fmt(n.updatedAt);$('actionTitle').textContent=n.title||'Untitled note';if(show)toast('Note saved ✓');renderHome()}
function schedule(){if(mode!=='edit')return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(false),400);$('actionTitle').textContent=$('noteTitle').value.trim()||'Untitled note'}
function updateFavLabel(){const n=current();if($('menuFavorite'))$('menuFavorite').textContent=n?.favorite?'★ Remove from favorites':'☆ Add to favorites'}
function bookmark(){const s=getSelection();if(s&&s.rangeCount&&$('noteBody').contains(s.anchorNode))rangeBookmark=s.getRangeAt(0).cloneRange()}
function restore(){if(!rangeBookmark)return;try{const s=getSelection();s.removeAllRanges();s.addRange(rangeBookmark)}catch(e){}}
function cmd(c,v=null){if(mode!=='edit')return;$('noteBody').focus({preventScroll:true});restore();try{document.execCommand(c,false,v)}catch(e){}bookmark();schedule()}
function changeFont(delta){
if(mode!=='edit')return;const body=$('noteBody');body.focus({preventScroll:true});restore();const s=getSelection();
if(s&&!s.isCollapsed&&body.contains(s.anchorNode)){
try{const span=document.createElement('span');span.style.fontSize=delta>0?'larger':'smaller';s.getRangeAt(0).surroundContents(span)}catch(e){document.execCommand('fontSize',false,delta>0?'5':'3')}
}else{fontSize=Math.max(8,Math.min(48,fontSize+delta*2));document.execCommand('fontSize',false,delta>0?'5':'3');const fonts=body.querySelectorAll('font[size="5"],font[size="3"]');fonts.forEach(f=>{f.style.fontSize=fontSize+'px';f.removeAttribute('size')})}
bookmark();schedule()
}
function highlightSelected(){
if(mode!=='edit')return;restore();const s=getSelection();if(!s||s.isCollapsed){toast('Select one word first');return}const r=s.getRangeAt(0);if(!$('noteBody').contains(r.commonAncestorContainer)){toast('Select text inside your note');return}const t=s.toString().trim();if(!t||/\s/.test(t)){toast('Please select one word at a time');return}const mark=document.createElement('mark');mark.style.backgroundColor='#ffdf66';mark.style.color='#2c1b00';try{r.surroundContents(mark)}catch(e){document.execCommand('hiliteColor',false,'#ffdf66')}s.removeAllRanges();schedule();updateBadge();toast('Word highlighted')}
function checklist(){if(mode!=='edit')return;const ul=document.createElement('ul'),li=document.createElement('li');li.innerHTML='<input type="checkbox"> <span>Checklist item</span>';ul.appendChild(li);$('noteBody').appendChild(ul);schedule()}
function attach(file){if(!file)return;const body=$('noteBody');if(file.type.startsWith('image/')){const rd=new FileReader();rd.onload=()=>{const img=document.createElement('img');img.src=rd.result;img.alt=file.name;body.appendChild(img);const cap=document.createElement('div');cap.className='attachment';cap.textContent='📎 '+file.name;body.appendChild(cap);schedule()};rd.readAsDataURL(file)}else{const a=document.createElement('a');a.className='attachment';a.href=URL.createObjectURL(file);a.target='_blank';a.rel='noopener';a.textContent='📎 '+file.name;body.appendChild(a);schedule();toast('Attached for this session')}}
function openDraw(){if(mode!=='edit')return;$('drawModal').classList.add('open');const c=$('drawingCanvas');drawCtx=c.getContext('2d');drawCtx.fillStyle='white';drawCtx.fillRect(0,0,c.width,c.height)}
function point(e){const c=$('drawingCanvas'),r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function drawStart(e){drawing=true;lastPoint=point(e);$('drawingCanvas').setPointerCapture(e.pointerId)}
function drawMove(e){if(!drawing)return;const p=point(e);drawCtx.strokeStyle=$('penColor').value;drawCtx.lineWidth=+$('penSize').value;drawCtx.lineCap='round';drawCtx.beginPath();drawCtx.moveTo(lastPoint.x,lastPoint.y);drawCtx.lineTo(p.x,p.y);drawCtx.stroke();lastPoint=p}
function drawEnd(){drawing=false;lastPoint=null}
function insertDrawing(){const img=document.createElement('img');img.src=$('drawingCanvas').toDataURL('image/png');img.alt='Drawing';$('noteBody').appendChild(img);$('drawModal').classList.remove('open');schedule()}
function confirmBox(title,msg,fn){$('confirmTitle').textContent=title;$('confirmText').textContent=msg;confirmAction=fn;$('confirmModal').classList.add('open')}
let confirmAction=null;
function closeConfirm(){$('confirmModal').classList.remove('open');confirmAction=null}
function deleteNote(){const n=current();if(!n)return;confirmBox('Delete note?',`Delete “${n.title||'Untitled note'}”?`,()=>{notes=notes.filter(x=>x.id!==activeId);activeId=null;persist();showScreen('home');toast('Note deleted')})}
function share(){
const n=current();if(!n)return;const text=(n.title||'Untitled note')+'\n'+(n.category||'General')+'\n\n'+plain(n.content||'');
if(navigator.share)navigator.share({title:n.title||'NOTE PAL',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Note copied')).catch(()=>toast('Could not copy note'));else{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Note copied')}
$('actionMenu').classList.remove('open')
}
function setCategory(){const v=$('noteCategory').value;if(v==='__add__'){const name=prompt('New category name:');if(name&&name.trim()&&!categories.includes(name.trim())){categories.push(name.trim());persist();renderCategories();$('noteCategory').value=name.trim();const n=current();if(n)n.category=name.trim();schedule()}else $('noteCategory').value=current()?.category||categories[0];return}const n=current();if(n){n.category=v;schedule()}}
$('addNoteBtn').onclick=createNote;
$('searchInput').oninput=e=>{searchTerm=e.target.value;renderHome()};
$('sortBtn').onclick=()=>{sortNewest=!sortNewest;$('sortBtn').textContent=sortNewest?'↕ Recent':'↕ Oldest';renderHome()};
$('saveBtn').onclick=()=>{if(mode==='edit'){save();setMode('read')}else toast('Note is saved')};
$('menuBtn').onclick=()=>$('actionMenu').classList.toggle('open');
$('menuEdit').onclick=()=>{if(mode==='read'){setMode('edit');return}save(false)};
$('menuRead').onclick=()=>{save(false);setMode('read')};
$('menuShare').onclick=share;
$('menuFavorite').onclick=()=>{const n=current();if(n){n.favorite=!n.favorite;persist();updateFavLabel();renderHome();toast(n.favorite?'Added to favorites':'Removed from favorites')}};
$('menuPin').onclick=()=>{const n=current();if(n){n.pinned=!n.pinned;persist();renderHome();toast(n.pinned?'Note pinned':'Note unpinned')}};
$('menuDelete').onclick=deleteNote;
$('noteCategory').onchange=setCategory;
$('noteTitle').oninput=schedule;
$('noteBody').addEventListener('input',()=>{bookmark();schedule()});
$('noteBody').addEventListener('keyup',bookmark);$('noteBody').addEventListener('mouseup',bookmark);
$('formatBar').addEventListener('pointerdown',e=>{if(e.target.closest('button'))bookmark()});
$('formatBar').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>cmd(b.dataset.cmd));
$('fontColorBtn').onclick=()=>{$('fontColor').click()};
$('fontColor').oninput=e=>cmd('foreColor',e.target.value);
$('fontSizeMinus').onclick=()=>changeFont(-1);$('fontSizePlus').onclick=()=>changeFont(1);
$('highlightBtn').onclick=highlightSelected;$('checklistBtn').onclick=checklist;
$('clearFormatBtn').onclick=()=>cmd('removeFormat');
$('attachBtn').onclick=()=>$('filePicker').click();
$('filePicker').onchange=e=>{[...e.target.files].forEach(attach);e.target.value=''};
$('drawBtn').onclick=openDraw;
$('closeDraw').onclick=$('cancelDraw').onclick=()=>$('drawModal').classList.remove('open');
$('insertDrawing').onclick=insertDrawing;
$('eraseCanvas').onclick=()=>{drawCtx.clearRect(0,0,$('drawingCanvas').width,$('drawingCanvas').height);drawCtx.fillStyle='white';drawCtx.fillRect(0,0,$('drawingCanvas').width,$('drawingCanvas').height)};
$('drawingCanvas').addEventListener('pointerdown',drawStart);$('drawingCanvas').addEventListener('pointermove',drawMove);$('drawingCanvas').addEventListener('pointerup',drawEnd);$('drawingCanvas').addEventListener('pointercancel',drawEnd);
$('closeConfirm').onclick=$('cancelConfirm').onclick=closeConfirm;
$('acceptConfirm').onclick=()=>{const fn=confirmAction;closeConfirm();if(fn)fn()};
document.addEventListener('click',e=>{if(!$('menuBtn').contains(e.target)&&!$('actionMenu').contains(e.target))$('actionMenu').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeConfirm();$('drawModal').classList.remove('open');$('actionMenu').classList.remove('open')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&mode==='edit'){e.preventDefault();save();setMode('read')}});
window.addEventListener('beforeunload',()=>{if(mode==='edit')save(false)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='edit')save(false)});
window.addEventListener('popstate',()=>{if($('editorScreen').classList.contains('active')){if(mode==='edit'){save(false);setMode('read')}else{activeId=null;showScreen('home')}}else renderHome()});
function syncViewport(){if(window.visualViewport){document.documentElement.style.setProperty('--app-height',Math.round(window.visualViewport.height)+'px')}}
if(window.visualViewport){window.visualViewport.addEventListener('resize',syncViewport);window.visualViewport.addEventListener('scroll',syncViewport);syncViewport()}
if(!Array.isArray(notes))notes=[];if(!Array.isArray(categories)||!categories.length)categories=DEFAULT_CATS.slice();categories=[...new Set([...DEFAULT_CATS,...categories])];persist();renderHome();
})();
</script>
</body>
</html>
