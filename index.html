
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#173b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>NOTE PAL</title>

<style>
:root{
  --green:#173b2b;
  --green2:#245b40;
  --bg:#f1f5f2;
  --paper:#fff;
  --ink:#17221b;
  --muted:#68766d;
  --line:#dce5df;
  --yellow:#ffe36e;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Arial,system-ui,sans-serif;
}
button,input,select{font:inherit}
button{
  border:0;border-radius:10px;padding:10px 12px;
  background:#e7eee9;color:var(--green);
  font-weight:650;cursor:pointer;
}
button:active{transform:scale(.98)}
.hidden{display:none!important}

.topbar{
  position:sticky;top:0;z-index:10;
  background:var(--green);color:white;
  display:flex;align-items:center;gap:10px;
  padding:13px 15px;
  box-shadow:0 2px 8px #0002;
}
.brand{font-size:20px;font-weight:850;flex:1}
.topbar button{background:#ffffff20;color:white}

main{
  max-width:850px;margin:auto;
  padding:14px 13px 100px;
}
.search{
  width:100%;padding:13px;
  border:1px solid var(--line);border-radius:12px;
  background:white;outline:none;margin-bottom:12px;
}
.categories{
  display:flex;gap:8px;overflow-x:auto;
  padding:2px 0 13px;
}
.chip{
  white-space:nowrap;border-radius:30px;
  padding:8px 13px;background:white;
  border:1px solid var(--line);
}
.chip.active{background:var(--green);color:white}

.note-list{display:grid;gap:10px}
.note-card{
  background:white;border:1px solid var(--line);
  border-radius:14px;padding:14px;
  box-shadow:0 2px 7px #10291b08;
}
.note-card.pinned{border-left:5px solid #e8b92f}
.card-title{
  font-size:17px;font-weight:750;
  overflow-wrap:anywhere;
}
.meta{font-size:12px;color:var(--muted);margin:6px 0 9px}
.preview{
  font-size:14px;color:#536158;
  line-height:1.5;white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.card-actions{
  display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;
}
.card-actions button{font-size:13px;padding:8px 10px}
.primary{background:var(--green);color:white}
.danger{background:#ffebeb;color:#a12424}
.pin-active{background:#fff0bf;color:#745200}
.empty{text-align:center;color:var(--muted);padding:35px 10px}

.fab{
  position:fixed;right:20px;bottom:20px;z-index:12;
  width:58px;height:58px;border-radius:50%;
  background:var(--green);color:white;
  font-size:30px;padding:0;
  box-shadow:0 5px 18px #0003;
}

.panel{
  background:white;border:1px solid var(--line);
  border-radius:15px;padding:14px;margin-bottom:12px;
}
.date-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.title-input{
  width:100%;font-size:23px;font-weight:800;
  padding:8px 2px;border:0;border-bottom:1px solid var(--line);
  outline:none;background:transparent;color:var(--ink);
}
.select-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.select-row select{
  flex:1;min-width:110px;padding:10px;
  border:1px solid var(--line);border-radius:9px;background:white;
}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.toolbar button{min-width:38px;padding:8px 10px}
.toolbar select{
  max-width:160px;min-width:85px;
  border:1px solid var(--line);border-radius:9px;
  padding:8px;background:white;
}
.color-input{
  width:40px;height:37px;padding:2px;
  border:1px solid var(--line);border-radius:9px;
}
.editor{
  min-height:48vh;padding:15px;
  border:1px solid var(--line);border-radius:12px;
  background:white;outline:none;
  font-size:18px;line-height:1.7;
  overflow-wrap:anywhere;
}
.editor:empty:before{content:"Write your note here…";color:#9aa69e}
.editor:focus{border-color:#7da58a}
.bottom-actions{
  display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;margin-top:12px;
}
.status{font-size:12px;color:var(--muted)}

.read-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.read-title{flex:1;font-size:23px;font-weight:800;overflow-wrap:anywhere}
.read-date{font-size:12px;color:var(--muted);margin-bottom:14px}
.read-body{
  min-height:70vh;background:white;
  border:1px solid var(--line);border-radius:15px;
  padding:20px 17px;font-size:22px;line-height:1.85;
  overflow-wrap:anywhere;box-shadow:0 2px 8px #00000008;
}
.read-body:empty:after{content:"This note is empty.";color:var(--muted)}
.read-word{
  border-radius:4px;
  -webkit-tap-highlight-color:transparent;
}
.read-word.marked{
  background:var(--yellow);
  box-shadow:0 0 0 2px var(--yellow);
  color:#201d0c;
}
.read-hint{
  text-align:center;color:var(--muted);
  font-size:12px;padding:12px;
}

dialog{
  border:0;border-radius:16px;padding:20px;
  width:min(390px,calc(100% - 28px));
  box-shadow:0 20px 70px #0005;
}
dialog::backdrop{background:#0b1b11a6}
dialog h3{margin-top:0}
.dialog-input{
  width:100%;padding:12px;
  border:1px solid var(--line);border-radius:9px;
  margin:6px 0 14px;
}
@media(min-width:650px){
  .note-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .editor{min-height:420px}
  .read-body{padding:28px;font-size:24px}
}
</style>
</head>

<body>

<header class="topbar">
  <button id="backBtn" class="hidden">←</button>
  <div class="brand">📝 NOTE PAL</div>
  <button id="searchBtn">⌕ Search</button>
</header>

<main>

  <!-- HOME -->
  <section id="homeView">
    <input id="searchInput" class="search" type="search"
      placeholder="Search title, content, or category…">

    <div id="categoryBar" class="categories"></div>
    <div id="noteList" class="note-list"></div>
    <div id="emptyState" class="empty hidden">
      No notes found.<br>Tap ＋ to create a note.
    </div>
  </section>

  <!-- EDITOR -->
  <section id="editView" class="hidden">
    <div class="panel">
      <div id="editDate" class="date-label"></div>

      <input id="titleInput" class="title-input"
        placeholder="Note title" autocomplete="off">

      <div class="select-row">
        <select id="noteCategory" aria-label="Category"></select>
        <button id="addCategoryBtn">＋ Category</button>
        <button id="pinBtn">📌 Pin</button>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <select id="fontFamily" aria-label="Font">
          <option value="Arial">Arial</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Verdana">Verdana</option>
          <option value="Trebuchet MS">Trebuchet MS</option>
          <option value="monospace">Monospace</option>
        </select>

        <select id="fontSize" aria-label="Font size">
          <option value="3">Normal</option>
          <option value="4">Large</option>
          <option value="5">Larger</option>
          <option value="6">Very large</option>
          <option value="7">Huge</option>
        </select>

        <input id="fontColor" class="color-input"
          type="color" value="#17221b" aria-label="Font color">

        <button data-cmd="bold" title="Bold"><b>B</b></button>
        <button data-cmd="italic" title="Italic"><i>I</i></button>
        <button data-cmd="underline" title="Underline"><u>U</u></button>
        <button id="clearFormatBtn" title="Remove formatting">Tx</button>
      </div>

      <div id="editor" class="editor" contenteditable="true"
        spellcheck="true" aria-label="Note content"></div>

      <div class="bottom-actions">
        <button id="saveBtn" class="primary">💾 Save</button>
        <button id="readBtn">📖 Read Mode</button>
        <button id="deleteBtn" class="danger">🗑 Delete</button>
        <span id="saveStatus" class="status">Autosave ready</span>
      </div>
    </div>
  </section>

  <!-- READ MODE -->
  <section id="readView" class="hidden">
    <div class="read-head">
      <div id="readTitle" class="read-title"></div>
      <button id="readEditBtn">✎ Edit</button>
      <button id="readPinBtn" title="Pin note">📌</button>
    </div>

    <div id="readDate" class="read-date"></div>
    <article id="readBody" class="read-body"></article>

    <div class="read-hint">
      Tap a word to mark where you stopped reading.
      The marker is temporary and is never saved.
    </div>
  </section>

</main>

<button id="newNoteBtn" class="fab" aria-label="New note">＋</button>

<dialog id="categoryDialog">
  <h3>Add category</h3>
  <input id="newCategoryInput" class="dialog-input"
    placeholder="Category name" maxlength="40">
  <div class="bottom-actions">
    <button id="categoryCancel">Cancel</button>
    <button id="categorySave" class="primary">Add</button>
  </div>
</dialog>

<dialog id="deleteDialog">
  <h3>Delete this note?</h3>
  <p>This note will be permanently removed from this device.</p>
  <div class="bottom-actions">
    <button id="deleteCancel">Cancel</button>
    <button id="deleteConfirm" class="danger">Delete note</button>
  </div>
</dialog>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const NOTES_KEY = "notepal_notes_v1";
  const CATEGORIES_KEY = "notepal_categories_v1";

  const DEFAULT_CATEGORIES = [
    "General","Sermon","Bible Study","Devotion","Ministry","Personal"
  ];

  function loadJSON(key, fallback) {
    try {
      const value = JSON.parse(localStorage.getItem(key));
      return value ?? fallback;
    } catch {
      return fallback;
    }
  }

  let notes = loadJSON(NOTES_KEY, []);
  let categories = loadJSON(CATEGORIES_KEY, DEFAULT_CATEGORIES);

  if (!Array.isArray(notes)) notes = [];
  if (!Array.isArray(categories) || !categories.length) {
    categories = [...DEFAULT_CATEGORIES];
  }

  let activeCategory = "All";
  let currentId = null;
  let mode = "home";
  let saveTimer = null;
  let savedRange = null;
  let dirty = false;

  function persistNotes() {
    try {
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      return true;
    } catch (err) {
      $("saveStatus").textContent = "Storage error";
      alert("Unable to save. Device storage may be full.");
      return false;
    }
  }

  function persistCategories() {
    try {
      localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
    } catch {
      alert("Unable to save categories on this device.");
    }
  }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
  }

  function formatDate(value) {
    if (!value) return "";
    const d = new Date(value.slice(0,10) + "T12:00:00");
    return Number.isNaN(d.getTime()) ? value :
      d.toLocaleDateString(undefined,{
        year:"numeric",month:"short",day:"numeric"
      });
  }

  function makeId() {
    return (crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now() + "_" + Math.random().toString(36).slice(2);
  }

  function currentNote() {
    return notes.find(n => n.id === currentId);
  }

  function plainText(html) {
    const el = document.createElement("div");
    el.innerHTML = html || "";
    return (el.innerText || el.textContent || "").trim();
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#39;"
    })[c]);
  }

  function show(view) {
    mode = view;
    $("homeView").classList.toggle("hidden",view !== "home");
    $("editView").classList.toggle("hidden",view !== "edit");
    $("readView").classList.toggle("hidden",view !== "read");
    $("backBtn").classList.toggle("hidden",view === "home");
    $("newNoteBtn").classList.toggle("hidden",view !== "home");
    $("searchBtn").classList.toggle("hidden",view !== "home");
    window.scrollTo(0,0);
  }

  function renderCategories() {
    const bar = $("categoryBar");
    bar.innerHTML = "";

    ["All",...categories].forEach(cat => {
      const button = document.createElement("button");
      button.className = "chip" +
        (activeCategory === cat ? " active" : "");
      button.textContent = cat;
      button.addEventListener("click",() => {
        activeCategory = cat;
        renderCategories();
        renderNotes();
      });
      bar.appendChild(button);
    });

    const add = document.createElement("button");
    add.className = "chip";
    add.textContent = "＋ Add";
    add.addEventListener("click",openCategoryDialog);
    bar.appendChild(add);

    const select = $("noteCategory");
    const previous = select.value;
    select.innerHTML = "";

    categories.forEach(cat => {
      const option = document.createElement("option");
      option.value = cat;
      option.textContent = cat;
      select.appendChild(option);
    });

    if (categories.includes(previous)) select.value = previous;
  }

  function renderNotes() {
    const query = $("searchInput").value.trim().toLowerCase();
    const list = $("noteList");
    list.innerHTML = "";

    const visible = notes.filter(n => {
      const categoryMatch =
        activeCategory === "All" || n.category === activeCategory;

      const searchable =
        (n.title || "") + " " +
        plainText(n.content) + " " +
        (n.category || "");

      return categoryMatch &&
        searchable.toLowerCase().includes(query);
    }).sort((a,b) =>
      Number(!!b.pinned) - Number(!!a.pinned) ||
      (b.updatedAt || "").localeCompare(a.updatedAt || "")
    );

    visible.forEach(n => {
      const card = document.createElement("div");
      card.className = "note-card" + (n.pinned ? " pinned" : "");

      const title = n.title || "Untitled note";
      const preview = plainText(n.content).slice(0,180) || "No content yet";

      card.innerHTML = `
        <div class="card-title">${n.pinned ? "📌 " : ""}${escapeHTML(title)}</div>
        <div class="meta">
          ${escapeHTML(formatDate(n.date || n.updatedAt))} ·
          ${escapeHTML(n.category || "General")}
        </div>
        <div class="preview">${escapeHTML(preview)}</div>
        <div class="card-actions">
          <button class="primary edit-note">✎ Edit</button>
          <button class="read-note">📖 Read</button>
          <button class="pin-note ${n.pinned ? "pin-active" : ""}">
            ${n.pinned ? "Unpin" : "📌 Pin"}
          </button>
          <button class="danger delete-note">🗑 Delete</button>
        </div>`;

      card.querySelector(".card-title").addEventListener("click",
        () => openReader(n.id));
      card.querySelector(".edit-note").addEventListener("click",
        () => openEditor(n.id));
      card.querySelector(".read-note").addEventListener("click",
        () => openReader(n.id));
      card.querySelector(".pin-note").addEventListener("click",() => {
        n.pinned = !n.pinned;
        n.updatedAt = new Date().toISOString();
        persistNotes();
        renderNotes();
      });
      card.querySelector(".delete-note").addEventListener("click",() => {
        currentId = n.id;
        $("deleteDialog").showModal();
      });

      list.appendChild(card);
    });

    $("emptyState").classList.toggle("hidden",visible.length > 0);
  }

  function newNote() {
    const now = new Date().toISOString();
    const note = {
      id:makeId(),
      title:"",
      date:todayISO(),
      category:categories[0] || "General",
      content:"",
      pinned:false,
      createdAt:now,
      updatedAt:now
    };

    notes.unshift(note);
    currentId = note.id;
    persistNotes();
    openEditor(note.id);
    $("titleInput").focus();
  }

  function openEditor(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;

    if (mode === "edit" && currentId !== id) saveNow();

    currentId = id;
    $("editDate").textContent =
      "Date: " + formatDate(note.date || todayISO());
    $("titleInput").value = note.title || "";

    renderCategories();
    $("noteCategory").value = note.category || categories[0];
    $("editor").innerHTML = note.content || "";

    dirty = false;
    $("saveStatus").textContent = "Saved";
    updatePinButtons();
    show("edit");
  }

  function openReader(id) {
    if (mode === "edit") saveNow();

    const note = notes.find(n => n.id === id);
    if (!note) return;

    currentId = id;
    $("readTitle").textContent = note.title || "Untitled note";
    $("readDate").textContent =
      formatDate(note.date || todayISO()) + " · " +
      (note.category || "General");

    const body = $("readBody");
    body.innerHTML = note.content || "";
    wrapReadWords(body);

    updatePinButtons();
    show("read");
  }

  function updatePinButtons() {
    const note = currentNote();
    if (!note) return;

    $("pinBtn").textContent =
      note.pinned ? "📌 Pinned" : "📌 Pin";
    $("readPinBtn").textContent =
      note.pinned ? "📌 Pinned" : "📌 Pin";
  }

  function markDirty() {
    dirty = true;
    $("saveStatus").textContent = "Saving…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow,180);
  }

  function saveNow() {
    clearTimeout(saveTimer);

    if (mode !== "edit") return;

    const note = currentNote();
    if (!note) return;

    note.title = $("titleInput").value.trim();
    note.category = $("noteCategory").value || "General";
    note.content = $("editor").innerHTML;
    note.updatedAt = new Date().toISOString();

    const ok = persistNotes();
    if (ok) {
      dirty = false;
      $("saveStatus").textContent = "Saved ✓";
      renderNotes();
    }
  }

  function togglePin() {
    const note = currentNote();
    if (!note) return;

    note.pinned = !note.pinned;
    note.updatedAt = new Date().toISOString();
    persistNotes();
    updatePinButtons();
    renderNotes();
  }

  function deleteCurrent() {
    notes = notes.filter(n => n.id !== currentId);
    persistNotes();
    $("deleteDialog").close();
    currentId = null;
    show("home");
    renderNotes();
  }

  function openCategoryDialog() {
    $("newCategoryInput").value = "";
    $("categoryDialog").showModal();
    setTimeout(() => $("newCategoryInput").focus(),50);
  }

  // Remember the selected text so formatting buttons work on mobile.
  function rememberSelection() {
    const selection = window.getSelection();

    if (selection && selection.rangeCount &&
        $("editor").contains(selection.anchorNode)) {
      savedRange = selection.getRangeAt(0).cloneRange();
    }
  }

  function restoreSelection() {
    const selection = window.getSelection();

    if (savedRange && selection) {
      selection.removeAllRanges();
      selection.addRange(savedRange);
    }
  }

  function command(name,value=null) {
    $("editor").focus();
    restoreSelection();
    document.execCommand(name,false,value);
    rememberSelection();
    markDirty();
  }

  // Wrap readable words in temporary spans. This modifies only the
  // reader's displayed copy, never the saved note.
  function wrapReadWords(root) {
    const walker = document.createTreeWalker(
      root,NodeFilter.SHOW_TEXT,{
        acceptNode(node) {
          if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if (node.parentElement.closest("script,style,.read-word")) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(node => {
      const fragment = document.createDocumentFragment();
      const regex = /\S+|\s+/g;
      let match;

      while ((match = regex.exec(node.nodeValue))) {
        if (/^\s+$/.test(match[0])) {
          fragment.appendChild(document.createTextNode(match[0]));
        } else {
          const span = document.createElement("span");
          span.className = "read-word";
          span.textContent = match[0];
          fragment.appendChild(span);
        }
      }

      node.parentNode.replaceChild(fragment,node);
    });
  }

  $("newNoteBtn").addEventListener("click",newNote);

  $("backBtn").addEventListener("click",() => {
    if (mode === "edit") saveNow();
    show("home");
    renderNotes();
  });

  $("searchBtn").addEventListener("click",() => {
    $("searchInput").focus();
  });

  $("searchInput").addEventListener("input",renderNotes);

  $("titleInput").addEventListener("input",markDirty);
  $("editor").addEventListener("input",() => {
    rememberSelection();
    markDirty();
  });
  $("editor").addEventListener("keyup",rememberSelection);
  $("editor").addEventListener("mouseup",rememberSelection);
  $("noteCategory").addEventListener("change",markDirty);

  $("pinBtn").addEventListener("click",togglePin);
  $("readPinBtn").addEventListener("click",togglePin);

  $("saveBtn").addEventListener("click",() => {
    saveNow();
    $("saveStatus").textContent = "Saved ✓";
  });

  $("readBtn").addEventListener("click",() => {
    saveNow();
    openReader(currentId);
  });

  $("readEditBtn").addEventListener("click",() => {
    openEditor(currentId);
  });

  $("readBody").addEventListener("click",event => {
    const word = event.target.closest(".read-word");
    if (!word) return;

    $("readBody").querySelectorAll(".read-word.marked")
      .forEach(el => el.classList.remove("marked"));

    word.classList.add("marked");
  });

  document.querySelectorAll("[data-cmd]").forEach(button => {
    button.addEventListener("mousedown",event => event.preventDefault());
    button.addEventListener("click",() => command(button.dataset.cmd));
  });

  $("fontFamily").addEventListener("change",event => {
    command("fontName",event.target.value);
  });

  $("fontSize").addEventListener("change",event => {
    command("fontSize",event.target.value);
  });

  $("fontColor").addEventListener("input",event => {
    command("foreColor",event.target.value);
  });

  $("clearFormatBtn").addEventListener("click",() => {
    command("removeFormat");
  });

  $("addCategoryBtn").addEventListener("click",openCategoryDialog);

  $("categoryCancel").addEventListener("click",() => {
    $("categoryDialog").close();
  });

  $("categorySave").addEventListener("click",() => {
    const name = $("newCategoryInput").value.trim();
    if (!name) {
      $("newCategoryInput").focus();
      return;
    }

    const existing = categories.find(
      c => c.toLowerCase() === name.toLowerCase()
    );

    const category = existing || name;

    if (!existing) {
      categories.push(name);
      persistCategories();
    }

    activeCategory = category;
    renderCategories();
    renderNotes();

    if (mode === "edit") {
      $("noteCategory").value = category;
      markDirty();
    }

    $("categoryDialog").close();
  });

  $("newCategoryInput").addEventListener("keydown",event => {
    if (event.key === "Enter") {
      event.preventDefault();
      $("categorySave").click();
    }
  });

  $("deleteBtn").addEventListener("click",() => {
    $("deleteDialog").showModal();
  });

  $("deleteCancel").addEventListener("click",() => {
    $("deleteDialog").close();
  });

  $("deleteConfirm").addEventListener("click",deleteCurrent);

  document.addEventListener("visibilitychange",() => {
    if (document.hidden && mode === "edit") saveNow();
  });

  window.addEventListener("pagehide",() => {
    if (mode === "edit") saveNow();
  });

  renderCategories();
  renderNotes();
  show("home");
})();
</script>
</body>
</html>
