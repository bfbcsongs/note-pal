
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>PREACH MATE</title>
<style>
:root{
  --bg:#f3f4f6;--surface:#fff;--text:#111827;--muted:#6b7280;
  --border:#e5e7eb;--primary:#2563eb;--highlight:#fef08a;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{min-height:58px;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-size:20px;font-weight:800;flex:1}
.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:1.2px;color:#92400e;margin-top:2px}
.icon-btn{border:0;background:transparent;border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:var(--text)}
.icon-btn:active{background:var(--border)}
.searchbar{padding:9px 12px 5px;background:#fff;flex-shrink:0}
.searchbar input{width:100%;border:1px solid var(--border);background:var(--bg);padding:11px 13px;border-radius:12px;outline:none}
.category-row{display:flex;align-items:center;gap:7px;overflow-x:auto;white-space:nowrap;padding:10px 12px;background:#fff;scrollbar-width:none;flex-shrink:0;touch-action:pan-y}
.category-row::-webkit-scrollbar{display:none}
.category-tab{border:1px solid var(--border);border-radius:22px;padding:8px 13px;background:#fff;color:#374151;font-size:13px;flex-shrink:0;user-select:none;touch-action:pan-y}
.category-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.category-tab.dragging{opacity:.4;border:2px dashed var(--primary)}
.category-tab.drag-target{outline:2px solid var(--primary);outline-offset:2px}
.add-category{width:37px;height:37px;flex-shrink:0;border:1px dashed #9ca3af;border-radius:50%;background:#fff;color:#374151;font-size:18px}
.home-content{flex:1;overflow-y:auto;padding:12px 12px 90px}
.section-heading{font-size:13px;color:var(--muted);margin:3px 3px 12px}
.notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.note-card{min-height:135px;background:#fff;border:1px solid var(--border);border-radius:15px;padding:13px;box-shadow:0 3px 12px #0000000b;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.note-card-title{font-weight:750;font-size:15px;overflow-wrap:anywhere;padding-right:17px}
.note-card-preview{font-size:13px;line-height:1.45;color:#4b5563;overflow-wrap:anywhere;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.note-card-meta{margin-top:auto;padding-top:5px;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px}
.note-fav{position:absolute;top:8px;right:9px;font-size:15px;color:#d97706}
.empty-state{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.6}
.fab{position:fixed;right:21px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:var(--primary);color:#fff;font-size:32px;box-shadow:0 6px 18px #0003;z-index:20}
.drawer-backdrop,.dialog-backdrop{position:fixed;inset:0;background:#0006;z-index:50}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(84vw,330px);background:#fff;padding:16px;box-shadow:5px 0 24px #0002;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.drawer-title{font-size:21px;font-weight:800;padding:10px 6px 16px}
.drawer-title small{display:block;font-size:10px;letter-spacing:1.2px;color:#92400e;margin-top:3px}
.drawer-item{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;font-size:15px}
.drawer-item:active,.drawer-item:hover{background:var(--bg)}
.drawer-section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:14px 10px 5px}
.drawer-categories{display:flex;flex-direction:column;gap:3px}
.drawer-category{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:#fff;padding:11px 10px;border-radius:9px;font-size:14px}
.drawer-category.active{background:#dbeafe;color:#1d4ed8;font-weight:700}
.drawer-category .cat-count{margin-left:auto;font-size:11px;color:#6b7280}
.drawer-footer{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 6px}
.editor-screen{position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.editor-header{display:flex;align-items:center;gap:4px;padding:7px 7px;border-bottom:1px solid var(--border);min-height:54px;flex-shrink:0;background:#fff}
.editor-title{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:18px;font-weight:750;padding:9px 5px;color:var(--text)}
.editor-title::placeholder{color:#9ca3af}
.mode-label{font-size:10px;color:var(--muted);padding:0 2px}
.note-body{flex:1;min-height:0;overflow-y:auto;outline:0;border:0;padding:18px 17px 120px;font-size:17px;line-height:1.7;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.note-body:empty:before{content:"Write your note here...";color:#9ca3af;pointer-events:none}
.note-body[contenteditable="false"]{cursor:text}
.note-body img{max-width:100%;height:auto}
.note-body blockquote{border-left:3px solid #9ca3af;margin-left:0;padding-left:12px;color:#4b5563}
.note-body ul,.note-body ol{padding-left:25px}

/* Read Mode highlighter: muted amber fill, thin yellow outline, light yellow text.
   No padding/margin/border so the marker does not add spacing or move the words. */
.read-word-marker{
  display:inline;
  padding:0!important;
  margin:0!important;
  background:#8f7910!important;
  color:#ffeb3b!important;
  font-size:inherit!important;
  font-weight:400!important;
  line-height:inherit!important;
  border:0!important;
  outline:1px solid #ffe45c;
  outline-offset:0;
  border-radius:1px;
  box-shadow:none;
  text-shadow:0 0 1px #fff4a3,0 0 3px rgba(255,233,92,.65);
  vertical-align:baseline;
}
.read-word-marker::after{content:none!important;display:none!important}

.editor-toolbar{position:fixed;left:0;right:0;bottom:0;min-height:49px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;gap:2px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));z-index:45;box-shadow:0 -3px 12px #0000000a}
.fmt-btn{min-width:34px;height:38px;border:1px solid transparent;border-radius:8px;background:transparent;color:#1f2937;display:inline-flex;align-items:center;justify-content:center;font-size:16px;padding:5px 7px;flex:1;max-width:55px}
.fmt-btn:active,.fmt-btn.active{background:#e5e7eb}
#btnHighlight{background:#fef08a;border-color:#eab308}
#btnTextColor{font-size:19px}
.color-palette{position:fixed;left:8px;right:8px;bottom:55px;z-index:47;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 24px #0002;padding:12px}
.palette-heading{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px}
.palette-colors{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.color-swatch{width:100%;aspect-ratio:1;border:2px solid #e5e7eb;border-radius:50%;position:relative;min-width:25px}
.color-swatch.selected{outline:2px solid #2563eb;outline-offset:2px}
.color-swatch.selected:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#111;font-size:15px;font-weight:bold;text-shadow:0 0 3px white}
.palette-close{border:0;background:transparent;font-size:20px;padding:0 5px}
.editor-menu{position:absolute;right:8px;top:49px;width:215px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px #0002;padding:6px;z-index:60}
.menu-item{width:100%;border:0;background:transparent;text-align:left;padding:12px 11px;border-radius:8px;font-size:14px;color:#111827}
.menu-item:active{background:var(--bg)}
.menu-item.danger{color:#dc2626}
.dialog-backdrop{display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.dialog{width:min(100%,360px);background:#fff;border-radius:16px;padding:20px;box-shadow:0 12px 40px #0003}
.dialog h3{margin:0 0 14px;font-size:18px}
.dialog input,.dialog select{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;margin-bottom:13px;background:#fff}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}
.btn{border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:9px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:#dc2626}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:20px;font-size:13px;z-index:100;box-shadow:0 4px 15px #0003;max-width:90vw;text-align:center}
@media(min-width:650px){.notes-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.home-content{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnDrawer" aria-label="Open menu">☰</button>
    <div class="brand">PREACH MATE<small>by:paulm.</small></div>
    <button class="icon-btn" id="btnFavorites" title="Favorites">☆</button>
  </header>
  <div class="searchbar"><input id="searchInput" type="search" placeholder="Search notes..." autocomplete="off"></div>
  <nav class="category-row" id="categoryTabs" aria-label="Categories"></nav>
  <main class="home-content">
    <div class="section-heading" id="notesCount">Your notes</div>
    <div class="notes-grid" id="notesGrid"></div>
    <div class="empty-state hidden" id="emptyState"><div style="font-size:38px;margin-bottom:8px">📝</div><strong>No notes found</strong><div>Create a note using the + button.</div></div>
  </main>
  <button class="fab" id="btnNewNote" aria-label="Create new note">+</button>
</div>

<div class="drawer-backdrop hidden" id="drawerBackdrop">
  <aside class="drawer">
    <div class="drawer-title">PREACH MATE<small>by:paulm.</small></div>
    <button class="drawer-item" id="drawerHome">⌂ &nbsp; All Notes</button>
    <button class="drawer-item" id="drawerFavorites">☆ &nbsp; Favorites</button>
    <button class="drawer-item" id="drawerNewCategory">⊞ &nbsp; Add Category</button>
    <button class="drawer-item" id="drawerNewNote">＋ &nbsp; New Note</button>
    <div class="drawer-section-title">Your Categories</div>
    <div class="drawer-categories" id="drawerCategories"></div>
    <button class="drawer-item" id="drawerExport">↗ &nbsp; Export Notes</button>
    <div class="drawer-footer">Notes are saved on this device.</div>
  </aside>
</div>

<section class="editor-screen hidden" id="editorScreen">
  <header class="editor-header">
    <button class="icon-btn" id="btnBack" title="Back">‹</button>
    <input class="editor-title" id="noteTitle" placeholder="Note title" maxlength="180">
    <span class="mode-label" id="modeLabel">READ</span>
    <button class="icon-btn" id="btnCopy" title="Copy note">▣</button>
    <button class="icon-btn" id="btnMenu" title="More options">⋮</button>
  </header>
  <div class="note-body" id="noteBody" contenteditable="false" spellcheck="true"></div>
  <div class="editor-menu hidden" id="editorMenu">
    <button class="menu-item" id="menuMode">Edit Mode</button>
    <button class="menu-item" id="menuMove">↪ Move to Category</button>
    <button class="menu-item" id="menuFavorite">☆ Favorite</button>
    <button class="menu-item danger" id="menuDelete">Delete Note</button>
  </div>
</section>

<div class="editor-toolbar hidden" id="editorToolbar">
  <button class="fmt-btn" id="btnBold" title="Bold"><b>B</b></button>
  <button class="fmt-btn" id="btnItalic" title="Italic"><i>I</i></button>
  <button class="fmt-btn" id="btnUnderline" title="Underline"><u>U</u></button>
  <button class="fmt-btn" id="btnHighlight" title="Choose highlight color">A</button>
  <button class="fmt-btn" id="btnTextColor" title="Choose font color">◉</button>
  <button class="fmt-btn" id="btnFontMinus" title="Decrease size">−</button>
  <button class="fmt-btn" id="btnFontPlus" title="Increase size">+</button>
</div>

<div class="color-palette hidden" id="colorPalette">
  <div class="palette-heading"><span id="paletteTitle">Choose color</span><button class="palette-close" id="paletteClose">×</button></div>
  <div class="palette-colors" id="paletteColors"></div>
</div>

<div class="dialog-backdrop hidden" id="dialogBackdrop">
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 id="dialogTitle">Add Category</h3>
    <div id="dialogContent"></div>
    <div class="dialog-actions">
      <button class="btn" id="dialogCancel">Cancel</button>
      <button class="btn primary" id="dialogConfirm">Save</button>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const STORAGE_KEY = "notepal_notes_v2";
const CATEGORIES_KEY = "notepal_categories_v2";
const COLORS = [
  {name:"Yellow",value:"#fef08a"},
  {name:"Gold",value:"#fde047"},
  {name:"Orange",value:"#fed7aa"},
  {name:"Pink",value:"#fbcfe8"},
  {name:"Red",value:"#fecaca"},
  {name:"Purple",value:"#e9d5ff"},
  {name:"Blue",value:"#bfdbfe"},
  {name:"Sky",value:"#bae6fd"},
  {name:"Green",value:"#bbf7d0"},
  {name:"Mint",value:"#a7f3d0"},
  {name:"White",value:"#ffffff"},
  {name:"Gray",value:"#d1d5db"},
  {name:"Black",value:"#111827"},
  {name:"Dark blue",value:"#1d4ed8"},
  {name:"Dark red",value:"#b91c1c"},
  {name:"Dark green",value:"#047857"},
  {name:"Violet",value:"#7e22ce"},
  {name:"Brown",value:"#92400e"},
  {name:"Slate",value:"#475569"},
  {name:"Teal",value:"#0f766e"},
  {name:"Rose",value:"#e11d48"}
];

function makeId(){return "n_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function parseJSON(v,f){try{return JSON.parse(v)??f}catch(e){return f}}
const DEFAULT_CATEGORIES=["All Notes","Personal","Study","Work","Ideas"];
let categories=parseJSON(localStorage.getItem(CATEGORIES_KEY),DEFAULT_CATEGORIES);
if(!Array.isArray(categories)||!categories.length)categories=[...DEFAULT_CATEGORIES];
if(!categories.includes("All Notes"))categories.unshift("All Notes");

let notes=parseJSON(localStorage.getItem(STORAGE_KEY),null);
if(!Array.isArray(notes)){
  notes=[{
    id:makeId(),title:"Welcome to NOTE PAL",
    content:"<p>Your notes are saved automatically on this device.</p><p><b>Read Mode:</b> Tap a word to temporarily mark where you stopped reading.</p><p><b>Edit Mode:</b> Select text, then choose highlight or font color from the toolbar.</p>",
    category:"Personal",favorite:false,fontSize:17,color:"#111827",updated:Date.now()
  }];
}
let activeCategory="All Notes",favoritesOnly=false,currentNoteId=null,isEditMode=false;
let dialogAction=null,toastTimer=null,markerSpan=null,savedSelection=null;
let paletteType="highlight";
let dragInfo=null,suppressCategoryClick=false;
const home=$("app"),editor=$("editorScreen"),noteTitle=$("noteTitle"),noteBody=$("noteBody");
const toolbar=$("editorToolbar"),palette=$("colorPalette"),menu=$("editorMenu");
const vv=window.visualViewport;

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(notes));
    localStorage.setItem(CATEGORIES_KEY,JSON.stringify(categories));
  }catch(e){showToast("Unable to save. Device storage may be full.")}
}
function currentNote(){return notes.find(n=>n.id===currentNoteId)||null}
function plainText(html){
  const box=document.createElement("div");box.innerHTML=html||"";
  return (box.innerText||box.textContent||"").replace(/\s+/g," ").trim();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showToast(msg){
  $("toast").textContent=msg;$("toast").classList.remove("hidden");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),1900);
}
function cleanTemporaryMarker(root){
  root.querySelectorAll(".read-word-marker").forEach(s=>s.replaceWith(...s.childNodes));
}
function saveCurrentNote(){
  const n=currentNote();if(!n)return;
  n.title=noteTitle.value.trim();
  const clone=noteBody.cloneNode(true);
  cleanTemporaryMarker(clone);
  n.content=clone.innerHTML;
  n.fontSize=parseInt(noteBody.dataset.fontSize||n.fontSize||17,10);
  n.color=noteBody.style.color||n.color||"#111827";
  n.updated=Date.now();persist();
}
function renderCategories(){
  const row=$("categoryTabs");row.innerHTML="";
  const ordered=["All Notes",...categories.filter(c=>c!=="All Notes")];
  ordered.forEach(cat=>{
    const b=document.createElement("button");
    b.className="category-tab"+(activeCategory===cat&&!favoritesOnly?" active":"");
    b.textContent=cat;b.dataset.category=cat;
    b.addEventListener("click",()=>{
      if(suppressCategoryClick){suppressCategoryClick=false;return}
      activeCategory=cat;favoritesOnly=false;renderCategories();renderNotes();renderDrawerCategories();
    });
    if(cat!=="All Notes")attachCategoryDrag(b);
    row.appendChild(b);
  });
  const add=document.createElement("button");
  add.className="add-category";add.textContent="⊞+";add.title="Add category";
  add.addEventListener("click",addCategoryDialog);row.appendChild(add);
  renderDrawerCategories();
}
function renderDrawerCategories(){
  const holder=$("drawerCategories");holder.innerHTML="";
  ["All Notes",...categories.filter(c=>c!=="All Notes")].forEach(cat=>{
    const b=document.createElement("button");
    b.className="drawer-category"+(activeCategory===cat&&!favoritesOnly?" active":"");
    const count=cat==="All Notes"?notes.length:notes.filter(n=>n.category===cat).length;
    b.innerHTML=`<span>${cat==="All Notes"?"▦":"▤"}</span><span>${esc(cat)}</span><span class="cat-count">${count}</span>`;
    b.addEventListener("click",()=>{
      activeCategory=cat;favoritesOnly=false;$("searchInput").value="";
      renderCategories();renderNotes();closeDrawer();
    });
    holder.appendChild(b);
  });
}

/* Reorder category tabs with mouse or touch drag. All Notes remains first. */
function attachCategoryDrag(button){
  button.addEventListener("pointerdown",e=>{
    if(e.button!==0&&e.pointerType==="mouse")return;
    dragInfo={button,startX:e.clientX,startY:e.clientY,moved:false,pointerId:e.pointerId};
  });
  button.addEventListener("pointermove",e=>{
    if(!dragInfo||dragInfo.button!==button)return;
    const dx=e.clientX-dragInfo.startX,dy=e.clientY-dragInfo.startY;
    if(!dragInfo.moved&&Math.abs(dx)<10&&Math.abs(dy)<10)return;
    if(Math.abs(dx)<Math.abs(dy))return;
    dragInfo.moved=true;button.classList.add("dragging");
    const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".category-tab");
    if(target&&target!==button&&target.dataset.category!=="All Notes"){
      target.classList.add("drag-target");
      const rect=target.getBoundingClientRect();
      const after=e.clientX>rect.left+rect.width/2;
      target.parentNode.insertBefore(button,after?target.nextSibling:target);
      document.querySelectorAll(".category-tab.drag-target").forEach(el=>{if(el!==target)el.classList.remove("drag-target")});
    }
    e.preventDefault();
  });
  const finish=()=>{
    if(!dragInfo||dragInfo.button!==button)return;
    const moved=dragInfo.moved;
    button.classList.remove("dragging");
    document.querySelectorAll(".drag-target").forEach(el=>el.classList.remove("drag-target"));
    if(moved){
      const tabOrder=[...$("categoryTabs").querySelectorAll(".category-tab")]
        .map(el=>el.dataset.category).filter(c=>c&&c!=="All Notes");
      categories=["All Notes",...tabOrder,...categories.filter(c=>c!=="All Notes"&&!tabOrder.includes(c))];
      persist();renderCategories();renderDrawerCategories();suppressCategoryClick=true;
      setTimeout(()=>suppressCategoryClick=false,300);
      showToast("Category order saved");
    }
    dragInfo=null;
  };
  button.addEventListener("pointerup",finish);
  button.addEventListener("pointercancel",finish);
}
function renderNotes(){
  const grid=$("notesGrid");grid.innerHTML="";
  const search=$("searchInput").value.trim().toLowerCase();
  const list=notes.filter(n=>!favoritesOnly||n.favorite)
    .filter(n=>activeCategory==="All Notes"||n.category===activeCategory)
    .filter(n=>!search||(n.title||"").toLowerCase().includes(search)||
      plainText(n.content).toLowerCase().includes(search)||(n.category||"").toLowerCase().includes(search))
    .sort((a,b)=>(b.updated||0)-(a.updated||0));
  $("notesCount").textContent=(favoritesOnly?"Favorite notes":activeCategory==="All Notes"?"Your notes":activeCategory)+" · "+list.length;
  list.forEach(n=>{
    const card=document.createElement("article");card.className="note-card";
    const title=document.createElement("div");title.className="note-card-title";title.textContent=n.title||"Untitled note";
    const preview=document.createElement("div");preview.className="note-card-preview";preview.textContent=plainText(n.content)||"No content yet";
    const meta=document.createElement("div");meta.className="note-card-meta";
    const cat=document.createElement("span");cat.textContent=n.category||"Personal";
    const date=document.createElement("span");date.textContent="· "+new Date(n.updated||Date.now()).toLocaleDateString();
    meta.append(cat,date);card.append(title,preview,meta);
    if(n.favorite){const star=document.createElement("span");star.className="note-fav";star.textContent="★";card.appendChild(star)}
    card.addEventListener("click",()=>openNote(n.id));
    grid.appendChild(card);
  });
  $("emptyState").classList.toggle("hidden",list.length!==0);
}
function openNote(id){
  currentNoteId=id;const n=currentNote();if(!n)return;
  clearReadMarker();noteTitle.value=n.title||"";noteBody.innerHTML=n.content||"";
  noteBody.dataset.fontSize=String(n.fontSize||17);
  noteBody.style.fontSize=(n.fontSize||17)+"px";noteBody.style.color=n.color||"#111827";
  home.classList.add("hidden");editor.classList.remove("hidden");menu.classList.add("hidden");
  closePalette();setMode(false);noteBody.scrollTop=0;
}
function newNote(){
  const cat=activeCategory!=="All Notes"&&categories.includes(activeCategory)?activeCategory:(categories.find(c=>c!=="All Notes")||"Personal");
  const n={id:makeId(),title:"",content:"",category:cat,favorite:false,fontSize:17,color:"#111827",updated:Date.now()};
  notes.unshift(n);persist();openNote(n.id);setMode(true);setTimeout(()=>noteTitle.focus(),100);
}
function closeEditor(){
  saveCurrentNote();clearReadMarker();closePalette();editor.classList.add("hidden");
  toolbar.classList.add("hidden");menu.classList.add("hidden");home.classList.remove("hidden");
  currentNoteId=null;renderCategories();renderNotes();
}
function setMode(edit){
  isEditMode=!!edit;
  if(!isEditMode){clearReadMarker();saveCurrentNote();closePalette();}
  noteTitle.readOnly=!isEditMode;noteBody.contentEditable=isEditMode?"true":"false";
  $("modeLabel").textContent=isEditMode?"EDIT":"READ";
  $("menuMode").textContent=isEditMode?"Read Mode":"Edit Mode";
  toolbar.classList.toggle("hidden",!isEditMode);
  if(isEditMode)updateToolbarPosition();else toolbar.style.bottom="0px";
  menu.classList.add("hidden");
}
function clearReadMarker(){
  const old=noteBody.querySelector(".read-word-marker");
  if(old)old.replaceWith(...old.childNodes);
  markerSpan=null;
}
function getRangeAtPoint(e){
  if(document.caretRangeFromPoint)return document.caretRangeFromPoint(e.clientX,e.clientY);
  if(document.caretPositionFromPoint){
    const p=document.caretPositionFromPoint(e.clientX,e.clientY);
    if(p){const r=document.createRange();r.setStart(p.offsetNode,p.offset);r.collapse(true);return r}
  }
  return null;
}
function isWordChar(c){return !!c&&/[\p{L}\p{N}_'-]/u.test(c)}
function markWordAtPoint(e){
  if(isEditMode||e.target.closest("button,input,a,select,textarea"))return;
  const r=getRangeAtPoint(e);
  if(!r||r.startContainer.nodeType!==Node.TEXT_NODE)return;
  const node=r.startContainer,text=node.textContent||"";
  if(!text.length)return;
  let start=Math.min(r.startOffset,text.length-1);
  if(!isWordChar(text[start])&&start>0&&isWordChar(text[start-1]))start--;
  if(!isWordChar(text[start]))return;
  let end=start;
  while(start>0&&isWordChar(text[start-1]))start--;
  while(end<text.length&&isWordChar(text[end]))end++;
  clearReadMarker();
  try{
    const wr=document.createRange();wr.setStart(node,start);wr.setEnd(node,end);
    const span=document.createElement("span");span.className="read-word-marker";
    wr.surroundContents(span);markerSpan=span;
  }catch(err){}
}
noteBody.addEventListener("click",markWordAtPoint);

function saveSelection(){
  const s=window.getSelection();if(!s||!s.rangeCount)return;
  const r=s.getRangeAt(0);
  if(noteBody.contains(r.commonAncestorContainer))savedSelection=r.cloneRange();
}
function restoreSelection(){
  if(!savedSelection)return;
  try{noteBody.focus({preventScroll:true});const s=window.getSelection();s.removeAllRanges();s.addRange(savedSelection)}catch(e){}
}
function applyCommand(command,value=null){
  if(!isEditMode)setMode(true);
  restoreSelection();noteBody.focus();
  try{document.execCommand(command,false,value)}catch(e){}
  saveCurrentNote();saveSelection();
}
function openPalette(type){
  if(!isEditMode)setMode(true);
  saveSelection();paletteType=type;
  $("paletteTitle").textContent=type==="highlight"?"Choose highlight color":"Choose font color";
  const holder=$("paletteColors");holder.innerHTML="";
  COLORS.forEach(color=>{
    const b=document.createElement("button");b.className="color-swatch";
    b.style.background=color.value;b.title=color.name;b.setAttribute("aria-label",color.name);
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.addEventListener("click",()=>{
      restoreSelection();noteBody.focus();
      if(type==="highlight"){
        try{document.execCommand("hiliteColor",false,color.value)}
        catch(e){try{document.execCommand("backColor",false,color.value)}catch(ignore){}}
      }else{
        try{document.execCommand("foreColor",false,color.value)}catch(e){}
        $("btnTextColor").style.color=color.value;
      }
      saveCurrentNote();saveSelection();closePalette();
    });
    holder.appendChild(b);
  });
  palette.classList.remove("hidden");updateToolbarPosition();
}
function closePalette(){palette.classList.add("hidden")}
function changeFontSize(delta){
  const n=currentNote();if(!n)return;
  let size=parseInt(noteBody.dataset.fontSize||n.fontSize||17,10);
  size=Math.max(12,Math.min(36,size+delta));
  noteBody.dataset.fontSize=String(size);noteBody.style.fontSize=size+"px";
  n.fontSize=size;saveCurrentNote();
}
function copyCurrentNote(){
  const n=currentNote();if(!n)return;
  const text=(noteTitle.value.trim()?noteTitle.value.trim()+"\n\n":"")+plainText(n.content);
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>showToast("Note copied"),()=>fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const area=document.createElement("textarea");area.value=text;
  area.style.position="fixed";area.style.opacity="0";document.body.appendChild(area);area.select();
  try{document.execCommand("copy");showToast("Note copied")}catch(e){showToast("Copy not available")}
  area.remove();
}
function openDialog(title,content,action,label="Save",danger=false){
  $("dialogTitle").textContent=title;$("dialogContent").innerHTML=content;
  $("dialogConfirm").textContent=label;$("dialogConfirm").classList.toggle("danger",danger);
  $("dialogBackdrop").classList.remove("hidden");dialogAction=action;
}
function closeDialog(){$("dialogBackdrop").classList.add("hidden");$("dialogContent").innerHTML="";dialogAction=null}
function addCategoryDialog(){
  openDialog("Add Category",'<input id="dialogCategoryName" maxlength="35" placeholder="Category name" autocomplete="off">',()=>{
    const name=$("dialogCategoryName").value.trim();
    if(!name){showToast("Enter a category name");return false}
    if(categories.some(c=>c.toLowerCase()===name.toLowerCase())){showToast("Category already exists");return false}
    categories.push(name);activeCategory=name;favoritesOnly=false;persist();renderCategories();renderNotes();return true;
  });
  setTimeout(()=>$("dialogCategoryName")?.focus(),50);
}
function moveCategoryDialog(){
  const n=currentNote();if(!n)return;
  const options=categories.filter(c=>c!=="All Notes").map(c=>`<option value="${esc(c)}" ${c===n.category?"selected":""}>${esc(c)}</option>`).join("");
  openDialog("Move to Category",`<select id="dialogMoveCategory">${options}</select>`,()=>{
    const cat=$("dialogMoveCategory").value;if(!cat)return false;
    n.category=cat;n.updated=Date.now();persist();renderCategories();renderNotes();showToast("Moved to "+cat);return true;
  });
}
function deleteCurrentNote(){
  const n=currentNote();if(!n)return;
  openDialog("Delete Note",`<p style="line-height:1.5;color:#4b5563">Delete “${esc(n.title||"Untitled note")}”? This cannot be undone.</p>`,()=>{
    notes=notes.filter(x=>x.id!==currentNoteId);persist();closeDialog();closeEditor();showToast("Note deleted");return false;
  },"Delete",true);
}
function toggleFavorite(){
  const n=currentNote();if(!n)return;
  n.favorite=!n.favorite;n.updated=Date.now();persist();
  $("menuFavorite").textContent=n.favorite?"★ Remove Favorite":"☆ Favorite";
  renderNotes();menu.classList.add("hidden");showToast(n.favorite?"Added to favorites":"Removed from favorites");
}
function showFavorites(){activeCategory="All Notes";favoritesOnly=true;renderCategories();renderNotes();closeDrawer()}
function openDrawer(){$("drawerBackdrop").classList.remove("hidden")}
function closeDrawer(){$("drawerBackdrop").classList.add("hidden")}
function exportNotes(){
  const blob=new Blob([JSON.stringify({categories,notes},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="notepal-backup.json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);closeDrawer();showToast("Backup exported");
}
function updateToolbarPosition(){
  if(!isEditMode||editor.classList.contains("hidden")){toolbar.classList.add("hidden");return}
  toolbar.classList.remove("hidden");
  let bottom=0;
  if(vv){
    const gap=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
    bottom=vv.height<window.innerHeight*.82?gap:0;
  }
  toolbar.style.bottom=bottom+"px";
  if(!palette.classList.contains("hidden"))palette.style.bottom=(bottom+55)+"px";
}

$("btnBold").addEventListener("mousedown",e=>e.preventDefault());
$("btnItalic").addEventListener("mousedown",e=>e.preventDefault());
$("btnUnderline").addEventListener("mousedown",e=>e.preventDefault());
$("btnHighlight").addEventListener("mousedown",e=>e.preventDefault());
$("btnTextColor").addEventListener("mousedown",e=>e.preventDefault());
toolbar.querySelectorAll("button").forEach(b=>{
  b.addEventListener("mousedown",e=>{e.preventDefault();saveSelection()});
  b.addEventListener("touchstart",saveSelection,{passive:true});
});
$("btnBold").addEventListener("click",()=>applyCommand("bold"));
$("btnItalic").addEventListener("click",()=>applyCommand("italic"));
$("btnUnderline").addEventListener("click",()=>applyCommand("underline"));
$("btnHighlight").addEventListener("click",()=>openPalette("highlight"));
$("btnTextColor").addEventListener("click",()=>openPalette("font"));
$("btnFontMinus").addEventListener("click",()=>changeFontSize(-1));
$("btnFontPlus").addEventListener("click",()=>changeFontSize(1));
$("paletteClose").addEventListener("click",closePalette);
noteBody.addEventListener("keyup",saveSelection);
noteBody.addEventListener("mouseup",saveSelection);
noteBody.addEventListener("input",()=>{if(isEditMode)saveCurrentNote()});
noteTitle.addEventListener("input",()=>{if(isEditMode)saveCurrentNote()});

$("btnNewNote").addEventListener("click",newNote);
$("btnBack").addEventListener("click",closeEditor);
$("btnCopy").addEventListener("click",copyCurrentNote);
$("btnMenu").addEventListener("click",e=>{
  e.stopPropagation();const n=currentNote();
  if(n)$("menuFavorite").textContent=n.favorite?"★ Remove Favorite":"☆ Favorite";
  menu.classList.toggle("hidden");
});
$("menuMode").addEventListener("click",()=>setMode(!isEditMode));
$("menuMove").addEventListener("click",()=>{menu.classList.add("hidden");moveCategoryDialog()});
$("menuFavorite").addEventListener("click",toggleFavorite);
$("menuDelete").addEventListener("click",deleteCurrentNote);

$("btnDrawer").addEventListener("click",openDrawer);
$("drawerBackdrop").addEventListener("click",e=>{if(e.target===$("drawerBackdrop"))closeDrawer()});
$("drawerHome").addEventListener("click",()=>{
  activeCategory="All Notes";favoritesOnly=false;$("searchInput").value="";
  renderCategories();renderNotes();closeDrawer();
});
$("drawerFavorites").addEventListener("click",showFavorites);
$("drawerNewCategory").addEventListener("click",()=>{closeDrawer();addCategoryDialog()});
$("drawerNewNote").addEventListener("click",()=>{closeDrawer();newNote()});
$("drawerExport").addEventListener("click",exportNotes);
$("btnFavorites").addEventListener("click",showFavorites);
$("searchInput").addEventListener("input",renderNotes);
$("dialogCancel").addEventListener("click",closeDialog);
$("dialogBackdrop").addEventListener("click",e=>{if(e.target===$("dialogBackdrop"))closeDialog()});
$("dialogConfirm").addEventListener("click",()=>{
  if(typeof dialogAction==="function"){
    const result=dialogAction();
    if(result!==false)closeDialog();
  }
});
document.addEventListener("click",e=>{
  if(!menu.classList.contains("hidden")&&!menu.contains(e.target)&&e.target!==$("btnMenu"))menu.classList.add("hidden");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(!$("dialogBackdrop").classList.contains("hidden"))closeDialog();
    else if(!$("drawerBackdrop").classList.contains("hidden"))closeDrawer();
    else if(!menu.classList.contains("hidden"))menu.classList.add("hidden");
    else if(!editor.classList.contains("hidden"))closeEditor();
  }
  if(e.key==="Enter"&&e.target.id==="dialogCategoryName"){e.preventDefault();$("dialogConfirm").click()}
});
if(vv){vv.addEventListener("resize",updateToolbarPosition);vv.addEventListener("scroll",updateToolbarPosition)}
window.addEventListener("resize",updateToolbarPosition);
window.addEventListener("pagehide",()=>{if(currentNoteId)saveCurrentNote()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&currentNoteId)saveCurrentNote()});

persist();renderCategories();renderNotes();
})();
</script>
</body>
</html>
